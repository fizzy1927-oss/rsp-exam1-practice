"opts":["Short-acting beta agonist","Long-acting beta agonist","Short-acting muscarinic antagonist","Long-acting muscarinic antagonist"],"ans":1,"why":"Salmeterol lasts about 12 hours, which makes it long acting. Its onset is slow, so it is used only for maintenance."},{"cat":"Classification","stem":"Classify formoterol by duration of action.","roman":null,"opts":["Short-acting beta agonist","Long-acting beta agonist","Short-acting muscarinic antagonist","Long-acting muscarinic antagonist"],"ans":1,"why":"Formoterol lasts about 12 hours, which makes it long acting. Its onset is fast at 2-3 minutes, but duration is what defines the class."},{"cat":"Classification","stem":"Classify levalbuterol by duration of action.","roman":null,"opts":["Short-acting beta agonist","Long-acting beta agonist","Short-acting muscarinic antagonist","Long-acting muscarinic antagonist"],"ans":0,"why":"Levalbuterol lasts about 5-6 hours, which makes it short acting. It is the R-isomer of albuterol."},{"cat":"Classification","stem":"Classify olodaterol by duration of action.","roman":null,"opts":["Short-acting beta agonist","Long-acting beta agonist","Short-acting muscarinic antagonist","Long-acting muscarinic antagonist"],"ans":1,"why":"Olodaterol lasts 24 hours, which makes it long acting, sometimes called an ultra-LABA. It is given once daily for COPD."},{"cat":"Autonomic","stem":"Stimulation of beta-2 receptors in the airway produces which effect?","roman":null,"opts":["Bronchoconstriction and increased mucus","Relaxation of bronchial smooth muscle","Vasoconstriction of the nasal mucosa","Increased heart rate and contractility"],"ans":1,"why":"Beta-2 stimulation relaxes bronchial smooth muscle, reduces mast cell mediator release, and increases mucociliary clearance. Vasoconstriction is an alpha effect and the cardiac changes are beta-1 effects."},{"cat":"Autonomic","stem":"A drug that blocks the parasympathetic nervous system is classified as a:","roman":null,"opts":["Sympathomimetic","Parasympathomimetic","Parasympatholytic","Sympatholytic"],"ans":2,"why":"The suffix -lytic means block and -mimetic means copy. Blocking the parasympathetic system leaves the body in a fight-or-flight pattern, which is why these drugs dilate the airway."},{"cat":"Autonomic","stem":"A patient with asthma is started on a new medication for hypertension and develops wheezing. The new drug most likely belongs to which class?","roman":null,"opts":["Sympathomimetic","Parasympatholytic","Sympatholytic","Xanthine"],"ans":2,"why":"A sympatholytic such as a nonselective beta blocker opposes the sympathetic system, leaving the bronchoconstricting parasympathetic side dominant. The other three classes all tend to open the airway."},{"cat":"Autonomic","stem":"Both sympathomimetics and parasympatholytics produce which of the following?","roman":null,"opts":["Increased salivation and digestion","Constricted pupils and slowed heart rate","Increased mucus and bronchoconstriction","Increased heart rate and dilated pupils"],"ans":3,"why":"Blocking the parasympathetic system leaves the same pattern as stimulating the sympathetic one: bronchodilation, faster heart rate, higher blood pressure, dilated pupils, less saliva, slower digestion, and higher blood glucose."},{"cat":"Autonomic","stem":"The neurotransmitter acting at muscarinic receptors in the airway is:","roman":null,"opts":["Epinephrine","Norepinephrine","Acetylcholine","Dopamine"],"ans":2,"why":"Acetylcholine binds muscarinic (M3) receptors to cause bronchoconstriction and mucus secretion. Anticholinergic bronchodilators work by blocking that binding."},{"cat":"Mechanism","stem":"Beta-2 agonists produce bronchodilation by which mechanism?","roman":null,"opts":["Blocking phosphodiesterase, raising cAMP","Activating adenyl cyclase, raising cAMP","Blocking muscarinic receptors on smooth muscle","Binding directly to actin and myosin"],"ans":1,"why":"The agonist binds the receptor, a G protein activates adenyl cyclase, and cAMP rises. cAMP then inactivates the enzyme that starts actin-myosin interaction and lowers intracellular calcium. Blocking phosphodiesterase is how xanthines work."},{"cat":"Mechanism","stem":"Which enzyme breaks cAMP down into inactive AMP?","roman":null,"opts":["Adenyl cyclase","Phosphodiesterase","Catechol-O-methyltransferase","Monoamine oxidase"],"ans":1,"why":"Phosphodiesterase converts cAMP to AMP, and large amounts of AMP actually interfere with bronchodilation. Adenyl cyclase makes cAMP, while COMT and MAO break down catecholamines."},{"cat":"Mechanism","stem":"Increased intracellular cAMP relaxes airway smooth muscle in part by:","roman":null,"opts":["Increasing intracellular calcium","Decreasing intracellular calcium","Increasing acetylcholine release","Promoting mast cell degranulation"],"ans":1,"why":"Calcium is required for contraction, so lowering it relaxes the muscle. Preventing calcium influx into mast cells also limits mediator release, which is the theorized anti-inflammatory effect."},{"cat":"Mechanism","stem":"Catecholamines are rapidly inactivated by which enzymes?","roman":null,"opts":["Phosphodiesterase and adenyl cyclase","COMT and MAO","Sulfotransferase and DNase","Lipase and amylase"],"ans":1,"why":"COMT is found in the liver, kidneys, and throughout the body, and MAO is found in the GI tract. Together they break catecholamines down quickly, which is why their duration is only about 0.5-3 hours."},{"cat":"Drug class","stem":"Which structural class of bronchodilators is the most beta-2 specific and the most widely prescribed today?","roman":null,"opts":["Catecholamines","Resorcinols","Saligenins","Xanthines"],"ans":2,"why":"Saligenins came from modifying the catechol nucleus and are the most beta-2 specific. Albuterol, levalbuterol, and salmeterol are saligenins, and they largely replaced the catecholamines and resorcinols."},{"cat":"Drug class","stem":"Why can catecholamines not be administered orally?","roman":null,"opts":["They are too large to be absorbed","They are degraded by MAO in the GI tract","They are inactivated by gastric acid alone","They bind irreversibly to plasma proteins"],"ans":1,"why":"MAO in the GI tract destroys catecholamines before they can act, so they must be inhaled or injected. Their short duration of 0.5-3 hours is a separate limitation."},{"cat":"Drug class","stem":"Which of the following is classified as a resorcinol?","roman":null,"opts":["Albuterol","Terbutaline","Salmeterol","Isoproterenol"],"ans":1,"why":"Terbutaline and metaproterenol are resorcinols. Their modified catechol ring resists COMT, so they last 4-6 hours and can be given orally. Albuterol and salmeterol are saligenins and isoproterenol is a catecholamine."},{"cat":"Drug class","stem":"A nebulizer solution containing a catecholamine has turned pink. This indicates that:","roman":null,"opts":["The solution has become more concentrated","The drug has oxidized and lost potency","The solution has been contaminated","The drug has reached peak potency"],"ans":1,"why":"Catecholamines turn pink as they oxidize on exposure to heat, light, or air, which means the drug has been inactivated. Protect them from light and discard any discolored solution."},{"cat":"Clinical scenario","stem":"A 2-year-old presents with a barking cough and inspiratory stridor. Which aerosolized medication is indicated?","roman":null,"opts":["Albuterol","Racemic epinephrine","Ipratropium bromide","Cromolyn sodium"],"ans":1,"why":"Croup narrows the airway through mucosal swelling rather than smooth muscle spasm. The alpha effect of racemic epinephrine constricts blood vessels and shrinks the swollen tissue, which bronchodilators cannot do."},{"cat":"Clinical scenario","stem":"Following a racemic epinephrine treatment for croup, the patient should be:","roman":null,"opts":["Discharged as soon as the stridor resolves","Observed for about 2 hours before discharge","Given a second dose after 5 minutes","Started on a long-acting bronchodilator"],"ans":1,"why":"The effect lasts only about 1-2 hours and the swelling can return as it wears off, so the patient is watched for rebound before discharge."},{"cat":"Anticholinergic","stem":"A patient receiving a nebulized treatment by face mask complains of blurred vision and eye pain. Which drug most likely caused this?","roman":null,"opts":["Albuterol","Ipratropium","Acetylcysteine","Normal saline"],"ans":1,"why":"Anticholinergic mist reaching the eyes dilates the pupil and can precipitate acute narrow-angle glaucoma. Use a mouthpiece or a well-fitting mask and keep the aerosol out of the eyes."},{"cat":"Anticholinergic","stem":"Which patient would require the most caution when receiving ipratropium?","roman":null,"opts":["A patient with diabetes mellitus","A patient with narrow-angle glaucoma","A patient with hypothyroidism","A patient with iron-deficiency anemia"],"ans":1,"why":"Anticholinergics can precipitate acute glaucoma and cause urinary retention, so glaucoma and benign prostatic hyperplasia are the classic cautions. Dry mouth and constipation are the common complaints."},{"cat":"Delivery device","stem":"Tiotropium HandiHaler capsules should be:","roman":null,"opts":["Swallowed whole with a glass of water","Opened and the powder mixed into food","Pierced in the device and the powder inhaled","Dissolved in saline and given by nebulizer"],"ans":2,"why":"The device pierces the capsule so the powder can be inhaled. A swallowed capsule delivers no drug to the lungs at all."},{"cat":"Anticholinergic","stem":"A COPD patient is prescribed a maintenance bronchodilator taken every 12 hours through a multidose dry powder inhaler. Which drug was most likely prescribed?","roman":null,"opts":["Tiotropium","Aclidinium","Umeclidinium","Olodaterol"],"ans":1,"why":"Aclidinium is given twice daily through the Pressair, a multidose DPI. Tiotropium, umeclidinium, and olodaterol are all once-daily drugs."},{"cat":"Anticholinergic","stem":"Atropine is rarely used as a bronchodilator primarily because:","roman":null,"opts":["It does not relax airway smooth muscle at all","It crosses barriers and causes systemic effects","It has no affinity for muscarinic receptors","It is available only by intravenous injection"],"ans":1,"why":"Atropine does relax airway smooth muscle, but being lipophilic it crosses barriers easily, so even small doses produce CNS effects. It also dries secretions and slows mucociliary clearance."},{"cat":"Xanthine","stem":"The therapeutic serum range for theophylline is:","roman":null,"opts":["1-5 mcg/mL","5-15 mcg/mL","20-30 mcg/mL","50-100 mcg/mL"],"ans":1,"why":"The range is 5-15 mcg/mL. Side effects increase as levels approach 20 mcg/mL and anything above 20 is considered toxic."},{"cat":"Xanthine","stem":"A patient on theophylline has a serum level of 28 mcg/mL. Which findings would you most expect?","roman":null,"opts":["Bradycardia and hypotension","Nausea and possible arrhythmias","Hypothermia and lethargy","No symptoms at this level"],"ans":1,"why":"On the lecture's graded scale, nausea appears above 20 mcg/mL and cardiac arrhythmias above 30, so a level of 28 sits between the two. Seizures come at 40 to 45."},{"cat":"Xanthine","stem":"Besides weak bronchodilation, theophylline produces clinical improvement by:","roman":null,"opts":["Increasing mucus production and clearance","Increasing diaphragmatic strength and drive","Blocking circulating IgE antibodies","Stabilizing mast cell membranes"],"ans":1,"why":"Theophylline increases the strength and endurance of muscle contraction, including the diaphragm, and raises ventilatory drive. Animal studies also show reduced inflammation and a smaller late-phase response."},{"cat":"Xanthine","stem":"Which factor would most likely INCREASE a patient's theophylline level?","roman":null,"opts":["Cigarette smoking","Congestive heart failure","Phenytoin therapy","Rifampin therapy"],"ans":1,"why":"Heart failure, liver disease, fever, older age, and drugs such as ciprofloxacin, macrolides, and cimetidine raise levels. Smoking, phenytoin, carbamazepine, and rifampin lower them."},{"cat":"Xanthine","stem":"Aminophylline is best described as:","roman":null,"opts":["An inhaled xanthine bronchodilator","The intravenous salt form of theophylline","A long-acting beta agonist given orally","A leukotriene receptor antagonist"],"ans":1,"why":"Aminophylline is theophylline complexed with ethylenediamine for intravenous use. It is about 79% theophylline by weight, so doses must be converted when switching between the two."},{"cat":"Xanthine","stem":"Xanthines are administered by which route?","roman":null,"opts":["Aerosol only","Oral or intravenous","Subcutaneous injection only","Nasal spray"],"ans":1,"why":"Xanthines are given orally or intravenously and are never aerosolized. Clinicians still need to know them because of their role in bronchodilation and their narrow therapeutic range."},{"cat":"Adverse effects","stem":"Which set of side effects is most characteristic of beta-2 agonists?","roman":null,"opts":["Dry mouth, urinary retention, constipation","Tremor, tachycardia, hypokalemia, hyperglycemia","Bradycardia, hypoglycemia, constricted pupils","Oral thrush, hoarseness, sore throat"],"ans":1,"why":"Beta agonists produce a fight-or-flight pattern. The first set describes anticholinergic effects, the third describes a rest-and-digest pattern, and the fourth describes inhaled corticosteroid effects."},{"cat":"Adverse effects","stem":"A decreased response to a beta agonist that occurs within seconds of administration and reverses when the drug is stopped is called:","roman":null,"opts":["Tolerance","Tachyphylaxis","Downregulation","Anaphylaxis"],"ans":1,"why":"Tachyphylaxis is the rapid, transient loss of response. Tolerance develops over hours to days of long-term use and involves downregulation, an actual decrease in the number of beta-2 receptors."},{"cat":"Adverse effects","stem":"Which intervention can reverse beta-2 receptor desensitization?","roman":null,"opts":["Inhaled corticosteroids","Systemic corticosteroids","Increasing the beta agonist dose","Adding a second long-acting agent"],"ans":1,"why":"Systemic corticosteroids can reverse both tachyphylaxis and downregulation, while inhaled corticosteroids do not appear to. Never add a second long-acting beta agonist."},{"cat":"Safety","stem":"A long-acting beta agonist used alone in a patient with asthma carries an increased risk of:","roman":null,"opts":["Serious asthma-related events","Oral candidiasis and hoarseness","Adrenal suppression over time","Nephrotoxicity and hearing loss"],"ans":0,"why":"LABA monotherapy in asthma increases the risk of serious asthma-related events, including death, and is contraindicated. In asthma a LABA must always be paired with an inhaled corticosteroid."},{"cat":"Safety","stem":"A patient's rescue inhaler use has risen from twice a week to several times a day. This most likely indicates that:","roman":null,"opts":["The inhaler has passed its expiration date","Disease control is deteriorating","A higher rescue dose is needed","This is expected disease progression"],"ans":1,"why":"Rising rescue inhaler use is a marker of worsening control. The patient and the whole treatment plan need reassessment rather than simply more rescue medication."},{"cat":"Delivery device","stem":"Which device delivers aerosol at a slower velocity to enhance deposition?","roman":null,"opts":["Jet nebulizer","Soft mist inhaler","Dry powder inhaler","Metered dose inhaler"],"ans":1,"why":"The soft mist inhaler, such as the Respimat, releases a slow-moving mist that improves lung deposition and reduces impaction in the mouth and throat."},{"cat":"Delivery device","stem":"A spacer or valved holding chamber should be used with which device?","roman":null,"opts":["Dry powder inhaler","Metered dose inhaler","Soft mist inhaler","Jet nebulizer"],"ans":1,"why":"Spacers improve coordination and reduce oropharyngeal deposition with MDIs. A DPI is breath-actuated and must never be used with a spacer."},{"cat":"Delivery device","stem":"Which instruction is essential for a patient using a dry powder inhaler?","roman":null,"opts":["Shake the device well before each dose","Exhale fully into the device first","Inhale quickly and forcefully","Always use it with a spacer"],"ans":2,"why":"A DPI relies on the patient's own inspiratory effort to disperse the powder, so the breath must be quick and forceful. Exhaling into the device adds moisture and clumps the powder."},{"cat":"Concept","stem":"Bronchoconstriction caused by airway edema is best treated with:","roman":null,"opts":["A beta-2 agonist bronchodilator","A vasoconstrictor or corticosteroid","A mucolytic and airway clearance","A xanthine such as theophylline"],"ans":1,"why":"Edema is swelling from dilated, leaky vessels, so treatment targets the vessels with a vasoconstrictor and the inflammation with steroids. Bronchodilators relieve only smooth muscle spasm."},{"cat":"Concept","stem":"Which of the following narrows the airway as a result of impaired mucociliary clearance?","roman":null,"opts":["Bronchospasm","Airway edema","Retained secretions","Bronchodilation"],"ans":2,"why":"When the mucociliary escalator fails, secretions accumulate and reduce the lumen. Treatment is bronchial hygiene together with wetting agents and mucolytics."},{"cat":"Concept","stem":"Bronchospasm specifically refers to:","roman":null,"opts":["Swelling of the airway mucosa","Contraction of bronchial smooth muscle","Accumulation of airway secretions","Collapse of the alveoli"],"ans":1,"why":"Bronchospasm is contraction of the smooth muscle in the bronchial wall. It raises airway resistance and increases the work of breathing, and it is the problem bronchodilators treat."},{"cat":"Clinical scenario","stem":"A COPD patient prescribed Brovana 15 mcg by nebulizer asks whether he can take it whenever he feels short of breath. Your best response is:","roman":null,"opts":["Yes, it may be used whenever symptoms occur","No, it is a maintenance drug taken every 12 hours","Yes, but no more than once per hour","No, and the rescue inhaler should be stopped"],"ans":1,"why":"Arformoterol is dosed every 12 hours for COPD maintenance, and extra doses risk toxicity as the drug accumulates. The patient keeps a short-acting inhaler for sudden symptoms."},{"cat":"Clinical scenario","stem":"A physician orders nebulized formoterol (Perforomist) for a patient with asthma. Your best action is to:","roman":null,"opts":["Administer the treatment as ordered","Question the order before administering it","Administer a double dose for asthma","Substitute salmeterol without notifying anyone"],"ans":1,"why":"Perforomist is labeled for COPD maintenance only, and a long-acting beta agonist without an inhaled corticosteroid is contraindicated in asthma. Clarify the order with the physician."},{"cat":"Clinical scenario","stem":"Which finding would most concern you during a bronchodilator treatment?","roman":null,"opts":["Heart rate rise from 78 to 88 beats/minute","Heart rate rise from 88 to 130 beats/minute","A fine tremor of the hands","A brief cough at the start of the treatment"],"ans":1,"why":"A rise of more than about 20 beats/minute, or new palpitations, is a reason to stop and notify the nurse and physician. Mild tremor and a brief cough are common and expected."},{"cat":"Clinical scenario","stem":"A patient taking albuterol asks why the physician also ordered ipratropium. Your best explanation is that:","roman":null,"opts":["Ipratropium replaces the need for albuterol","The two act by different mechanisms and add together","Ipratropium prevents albuterol's side effects","Ipratropium is an inhaled corticosteroid"],"ans":1,"why":"Albuterol stimulates beta-2 receptors while ipratropium blocks muscarinic receptors. Because the pathways differ, the bronchodilation is additive, which is the basis for DuoNeb and Combivent."},{"cat":"Clinical scenario","stem":"Levalbuterol may be selected over racemic albuterol in which situation?","roman":null,"opts":["When a 24-hour duration of action is needed","When albuterol has caused troublesome tremor","When an anti-inflammatory effect is needed","When the patient cannot use a nebulizer"],"ans":1,"why":"Levalbuterol is the R-isomer and is sometimes chosen when beta side effects are troublesome, though the evidence for a real advantage is limited because beta toxicity is largely dose related."},{"cat":"Pharmacology","stem":"Which maintenance bronchodilator has both a rapid onset of 2-3 minutes and a 12-hour duration?","roman":null,"opts":["Salmeterol","Formoterol","Albuterol","Indacaterol"],"ans":1,"why":"Formoterol is both fast and long acting. Salmeterol has a slow onset, albuterol is fast but lasts only 4-6 hours, and indacaterol is a once-daily drug."},{"cat":"Pharmacology","stem":"Salmeterol's prolonged duration of action is explained by:","roman":null,"opts":["Its resistance to breakdown by COMT and MAO","Its lipophilic tail anchoring in the receptor","Its strong inhibition of phosphodiesterase","Its very slow clearance by the kidneys"],"ans":1,"why":"Salmeterol is lipophilic, so it diffuses into the cell membrane and approaches the receptor from the side. The long tail anchors in a hydrophobic region while the active head engages and disengages, giving about 12 hours of effect."},{"cat":"Drug naming","stem":"The name assigned to a chemical by the United States Adopted Name Council, also called the nonproprietary name, is the:","roman":null,"opts":["Chemical name","Generic name","Code name","Trade name"],"ans":1,"why":"The USAN Council assigns the generic, or nonproprietary, name once a chemical appears to have therapeutic use and the manufacturer wishes to market it. Once the drug is fully approved for general use, that generic name becomes the official name."},{"cat":"Drug naming","stem":"Aerosol SCH 1000 was used to identify ipratropium bromide while it was still experimental. This is an example of a:","roman":null,"opts":["Chemical name","Code name","Official name","Trade name"],"ans":1,"why":"A code name is assigned by a manufacturer to an experimental chemical that shows potential as a drug. The chemical name describes the molecular structure instead."},{"cat":"Drug naming","stem":"A brand or proprietary name given to a drug by its manufacturer is the:","roman":null,"opts":["Chemical name","Generic name","Official name","Trade name"],"ans":3,"why":"The trade name is the brand or proprietary name. Because an approved drug may be marketed by many manufacturers, the official name is used rather than any one brand name."},{"cat":"Pharmacokinetics","stem":"Which four processes make up the pharmacokinetic phase of drug action?","roman":null,"opts":["Absorption, distribution, metabolism, elimination","Ingestion, digestion, diffusion, excretion","Binding, activation, inhibition, clearance","Dilution, diffusion, osmosis, filtration"],"ans":0,"why":"The pharmacokinetic phase is absorption, distribution, metabolism, and elimination. Metabolism plus elimination equals clearance. The pharmacodynamic phase is where drug binds receptor to produce the effect."},{"cat":"Pharmacokinetics","stem":"The phase in which a drug combines with its receptor to produce stimulation or inhibition is the:","roman":null,"opts":["Absorption phase","Pharmacokinetic phase","Pharmacodynamic phase","Elimination phase"],"ans":2,"why":"The pharmacodynamic phase is drug plus receptor equals effect. The pharmacokinetic phase covers what the body does to the drug: absorption, distribution, metabolism, and elimination."},{"cat":"Pharmacokinetics","stem":"The initial metabolism of an orally administered drug in the liver, before it reaches the systemic circulation, is called the:","roman":null,"opts":["Steady state effect","First-pass effect","Loading effect","Clearance effect"],"ans":1,"why":"Blood from the GI tract travels through the portal vein to the liver first. If a drug is highly metabolized there, most of its activity is terminated before it ever reaches the general circulation."},{"cat":"Pharmacokinetics","stem":"The time required for the plasma concentration of a drug to decrease by one-half is the:","roman":null,"opts":["Onset of action","Duration of action","Half-life","Steady state"],"ans":2,"why":"Half-life measures how quickly a drug is eliminated from the body. Steady state is the maximum concentration reached when dosing balances elimination."},{"cat":"Pharmacokinetics","stem":"A dose given at a higher amount than usual in order to reach the desired blood concentration more quickly is a:","roman":null,"opts":["Loading dose","Maintenance dose","Titrated dose","Divided dose"],"ans":0,"why":"A loading dose gets the blood level up quickly. A maintenance dose then keeps the level steady, with dosing set to equal the rate of elimination."},{"cat":"Routes","stem":"A medication given by NG tube is being delivered by which route?","roman":null,"opts":["Enteral","Parenteral","Topical","Transdermal"],"ans":0,"why":"Enteral routes include PO, NG, OG, PEG, PR, and SL. Parenteral means IV, IM, SC, or a central line, bypassing the GI tract entirely."},{"cat":"Routes","stem":"Which dosage forms are associated with the inhalation route?","roman":null,"opts":["Tablet and capsule","Gas and aerosol","Patch and paste","Lotion and ointment"],"ans":1,"why":"Inhalation delivers gases and aerosols to the lung or mucous membranes. Patches and pastes are transdermal; lotions and ointments are topical."},{"cat":"Drug responsiveness","stem":"A rapid decrease in responsiveness to a drug, occurring shortly after it is given, is called:","roman":null,"opts":["Tolerance","Tachyphylaxis","Hypersensitivity","Anaphylaxis"],"ans":1,"why":"Tachyphylaxis is the rapid drop in responsiveness. Tolerance is the decreasing intensity of response over time, where the dose may need to increase for the same effect."},{"cat":"Drug responsiveness","stem":"An allergic or immune-mediated reaction to a drug is called:","roman":null,"opts":["Tolerance","Desensitization","Hypersensitivity","Tachyphylaxis"],"ans":2,"why":"Hypersensitivity is the allergic or immune-mediated reaction. Anaphylaxis is its most serious form and may require airway maintenance or ventilatory assistance."},{"cat":"Drug responsiveness","stem":"After a tissue has been exposed to a drug for a period, it becomes less responsive to further stimulation by that agent. This is:","roman":null,"opts":["Desensitization","Anaphylaxis","Hypersensitivity","First-pass effect"],"ans":0,"why":"Desensitization is the reduced responsiveness of a cell or tissue after a period of exposure. With beta agonists it shows up as downregulation of the receptors. NOTE: your instructor's study set labels this one tolerance. His own lecture slide defines desensitization exactly this way, so confirm which term he wants."},{"cat":"Safety","stem":"Approximately what percentage of reported hospitalizations result from an adverse drug reaction?","roman":null,"opts":["Less than 1%","About 5%","About 25%","About 50%"],"ans":1,"why":"About 5% of reported hospitalizations are the result of an adverse drug reaction. An ADR is any unintended side effect, ranging from mild to life-threatening."},{"cat":"Safety","stem":"The six rights of medication administration include all of the following EXCEPT:","roman":null,"opts":["Right drug and right dose","Right patient and right time","Right route and documentation","Right manufacturer and cost"],"ans":3,"why":"The six rights are right drug, right dose, right patient, right time, right route, and right documentation. Manufacturer and cost are not among them."},{"cat":"Safety","stem":"A clinician repeatedly clicks past computer warnings without reading them. This is best described as:","roman":null,"opts":["A duplicate order","Alert fatigue","A default setting trap","A wrong-route error"],"ans":1,"why":"Alert fatigue is desensitization to repeated warnings in the electronic record. Other common CPOE errors are wrong drug, wrong patient, wrong route or formulation, auto-fill traps, and duplicate orders."},{"cat":"Safety","stem":"A list of the drugs available within a particular healthcare system is called a:","roman":null,"opts":["Protocol","Standing order","Formulary","Package insert"],"ans":2,"why":"A formulary lists the drugs available in that system. Protocols, standing orders, and therapy guidelines direct how a particular disease is treated."},{"cat":"Safety","stem":"A physician should be advised to discontinue a medication for which two reasons?","roman":null,"opts":["Cost and inconvenience","Recovery or a serious adverse reaction","Patient preference or pharmacy stock","Shift change or transfer"],"ans":1,"why":"Discontinue when the patient has recovered and no longer needs the drug, or when there is a serious adverse reaction. If the drug is simply ineffective, recommend changing it or adjusting the amount instead."},{"cat":"Abbreviations","stem":"An order written q4h prn means the medication is given:","roman":null,"opts":["Every 4 hours around the clock","Every 4 hours as needed","Four times daily as needed","For 4 hours only"],"ans":1,"why":"The abbreviation q means every, so q4h is every 4 hours, and prn means as needed. Four times daily would be written qid."},{"cat":"Abbreviations","stem":"Which abbreviation means nothing by mouth?","roman":null,"opts":["po","prn","NPO","qid"],"ans":2,"why":"NPO means nothing by mouth. The abbreviation po means by mouth, prn means as needed, and qid means four times daily."},{"cat":"Abbreviations","stem":"A medication ordered tid is given how many times per day?","roman":null,"opts":["Two","Three","Four","Every hour"],"ans":1,"why":"The abbreviation tid means three times daily. Twice daily is bid, four times daily is qid, and every hour is qh."},{"cat":"Mechanism","stem":"Anticholinergic bronchodilators block the bronchoconstricting effects of the parasympathetic system by:","roman":null,"opts":["Increasing cAMP","Decreasing cGMP","Inhibiting phosphodiesterase","Blocking beta-2 receptors"],"ans":1,"why":"Anticholinergics work by decreasing cyclic guanosine monophosphate. Sympathomimetics raise cAMP directly, and methylxanthines raise it indirectly by inhibiting phosphodiesterase."},{"cat":"Mechanism","stem":"Which class produces bronchodilation by directly increasing cAMP?","roman":null,"opts":["Sympathomimetics","Anticholinergics","Methylxanthines","Monoclonal antibodies"],"ans":0,"why":"Sympathomimetics raise cAMP directly through the beta-2 receptor. Methylxanthines raise it indirectly by blocking phosphodiesterase, and anticholinergics lower cGMP instead."},{"cat":"Mechanism","stem":"Which class uses modified cells from living organisms to target specific molecules and disrupt inflammatory pathways?","roman":null,"opts":["Sympathomimetics","Anticholinergics","Methylxanthines","Monoclonal antibodies"],"ans":3,"why":"Monoclonal antibodies are produced using modified cells from organisms such as bacteria and mice. They target specific molecules in the body to interrupt the inflammation behind asthma symptoms."},{"cat":"Pharmacology","stem":"Beta-2 receptors on bronchial smooth muscle are particularly concentrated in the:","roman":null,"opts":["Small airways","Central, larger airways","Trachea and larynx","Alveolar sacs"],"ans":0,"why":"Beta-2 receptors are concentrated in the small airways, while anticholinergic agents act on the central, larger airways. That difference in site is one reason combining the two classes is additive."},{"cat":"Pharmacology","stem":"Anticholinergic bronchodilators exert their effect primarily on the:","roman":null,"opts":["Small peripheral airways","Central, larger airways","Alveolar capillary membrane","Pulmonary vasculature"],"ans":1,"why":"Anticholinergics act on the central, larger airways, and the effect depends on how much bronchial tone is present to be blocked."},{"cat":"Pharmacology","stem":"Why does an anticholinergic produce minimal airway dilation in a healthy subject?","roman":null,"opts":["The receptors are absent in healthy lungs","Only a basal level of tone exists to block","The drug is destroyed before reaching the lung","Healthy airways lack smooth muscle"],"ans":1,"why":"The effect depends on the degree of bronchial tone present that can be blocked. A healthy person has only a basal or resting level of tone, so there is little to reverse."},{"cat":"Pharmacology","stem":"Bronchospasm in the COPD patient is due to:","roman":null,"opts":["Underactivity of the sympathetic system","Overstimulation of the parasympathetic system","Direct injury to the alveolar membrane","Loss of beta-2 receptors"],"ans":1,"why":"Inhaled irritants send a nerve impulse from the airway to the CNS, which returns through the parasympathetic system to constrict smooth muscle and increase mucus secretion and cough."},{"cat":"Drug administration","stem":"Which drugs are documented as compatible for mixing with albuterol, levalbuterol, and formoterol?","roman":["Ipratropium","Acetylcysteine","Budesonide","Tobramycin"],"opts":["I and II only","II and III only","I, II, and III","None of the above"],"ans":2,"why":"Ipratropium, acetylcysteine, and budesonide are all listed as compatible, with no chemical changes. Remember that most agents are NOT FDA approved to be mixed with other agents."},{"cat":"Drug administration","stem":"Regarding mixing aerosolized medications, which statement is correct?","roman":null,"opts":["All nebulized drugs may be mixed freely","Most agents are not FDA approved for mixing","Mixing always causes a chemical change","Only saline may be added to any drug"],"ans":1,"why":"Most agents are not FDA approved to be mixed with other agents. A small number of combinations, such as albuterol with ipratropium, acetylcysteine, or budesonide, are documented as compatible."},{"cat":"Safety","stem":"A long-acting beta-2 agonist should be used in a patient who is:","roman":null,"opts":["Already controlled on a low-dose steroid","Not controlled on an inhaled corticosteroid","Using no controller medication at all","A child taking no corticosteroid"],"ans":1,"why":"LABAs are for patients not controlled on agents such as inhaled corticosteroids. They are not used without a controller, and children should use one only together with a corticosteroid."},{"cat":"Adverse effects","stem":"The most common side effect of bronchodilator therapy is:","roman":null,"opts":["Muscle tremor","Urinary retention","Oral candidiasis","Bradycardia"],"ans":0,"why":"Muscle tremor results from stimulation of beta-2 receptors in the skeletal muscles. Beta receptors in the heart and vessels also make increased heart rate and vasodilation possible."},{"cat":"Assessment","stem":"During a bronchodilator treatment, which change in heart rate is considered significant?","roman":null,"opts":["Any increase at all","A rise of 20 beats per minute","A rise of 5 beats per minute","Only a rise above 200"],"ans":1,"why":"A heart rate greater than 20% above baseline, or a rise of 20 beats per minute, is considered significant. Mild tremor is expected, but a heart rate change of that size warrants stopping and notifying."},{"cat":"Adverse effects","stem":"Bronchodilator side effects are generally LEAST common when the drug is given by which route?","roman":null,"opts":["Oral","Intravenous","Inhalation","Intramuscular"],"ans":2,"why":"Side effects are less common when the drug is inhaled rather than taken orally or given intravenously, because inhalation delivers drug directly to the airway with less systemic exposure."},{"cat":"Adverse effects","stem":"Which electrolyte and metabolic changes are associated with beta agonists?","roman":null,"opts":["Hyperkalemia and hypoglycemia","Hypokalemia and hyperglycemia","Hypernatremia and acidosis","Hypocalcemia and alkalosis"],"ans":1,"why":"Beta agonists drive potassium into cells, producing hypokalemia, and raise blood glucose. Cardiac effects include arrhythmias, palpitations, tachycardia, and unifocal premature ventricular contractions."},{"cat":"Assessment","stem":"Which finding indicates a POSITIVE response to bronchodilator therapy?","roman":null,"opts":["Decreased wheezing with louder breath sounds","Decreased wheezing with diminished breath sounds","Increased accessory muscle use","A falling PEF with reduced sputum"],"ans":0,"why":"Wheezing should decrease while breath sound intensity INCREASES, which means air is moving better. Wheezing that fades while breath sounds diminish is a warning sign, not an improvement."},{"cat":"Assessment","stem":"Other positive responses to a bronchodilator include all of the following EXCEPT:","roman":null,"opts":["Reduced dyspnea and improved appearance","Increased sputum production","Decreased use of accessory muscles","Falling oxygen saturation"],"ans":3,"why":"Improved oxygenation is expected, not a decline. The other positive responses are improved appearance, reduced dyspnea, less accessory muscle use, better vital signs, more sputum, and a rise in FEV1 or PEF."},{"cat":"Assessment","stem":"When should a patient be assessed in relation to a bronchodilator treatment?","roman":null,"opts":["Only before the treatment","Only after the treatment","Before, during, and after","Only if the patient complains"],"ans":2,"why":"Assessing before, during, and after gives an accurate picture of how effective the medication is. Ask about perceived dyspnea and observe the breathing pattern, and obtain PEF or FEV1 before and after."},{"cat":"Xanthine","stem":"A theophylline level greater than 30 mcg/mL is associated with which effect?","roman":null,"opts":["No effects at all","Nausea only","Cardiac arrhythmias","Optimal bronchodilation"],"ans":2,"why":"On the graded scale, levels below 5 produce no effect, 5 to 15 is therapeutic, above 20 causes nausea, above 30 causes cardiac arrhythmias, and 40 to 45 produces seizures."},{"cat":"Xanthine","stem":"At which theophylline serum level would you expect seizures?","roman":null,"opts":["5 to 15 mcg/mL","Greater than 20 mcg/mL","Greater than 30 mcg/mL","40 to 45 mcg/mL"],"ans":3,"why":"Seizures appear at 40 to 45 mcg/mL. Nausea starts above 20 and cardiac arrhythmias above 30, while 5 to 15 is the therapeutic range."},{"cat":"Xanthine","stem":"A theophylline level of 22 mcg/mL would most likely produce which symptom first?","roman":null,"opts":["Nausea","Seizures","No symptoms","Improved bronchodilation"],"ans":0,"why":"Nausea appears above 20 mcg/mL. Arrhythmias follow above 30 and seizures at 40 to 45, so nausea is the earliest warning that the level has climbed past the therapeutic range."},{"cat":"Xanthine","stem":"Theophylline is metabolized by the ___ and eliminated by the ___.","roman":null,"opts":["Kidneys; liver","Liver; kidneys","Lungs; liver","Liver; lungs"],"ans":1,"why":"Theophylline is metabolized in the liver and eliminated by the kidneys. That is why liver disease and heart failure raise levels and require close monitoring."},{"cat":"Xanthine","stem":"Which is a physiologic effect of the xanthines?","roman":null,"opts":["Cerebral vasoconstriction","Cerebral vasodilation","CNS depression","Urinary retention"],"ans":0,"why":"Xanthines produce cerebral vasoconstriction along with peripheral and coronary vasodilation, CNS stimulation, cardiac muscle stimulation, diuresis, and smooth muscle relaxation."},{"cat":"Xanthine","stem":"Regarding theophylline in asthma, which statement is correct?","roman":null,"opts":["It is the preferred first-line therapy","It carries a higher risk than an inhaled SABA","It has fewer side effects than inhaled agents","It should replace inhaled corticosteroids"],"ans":1,"why":"Theophylline has a higher risk of side effects than an inhaled short-acting beta agonist and is not recommended in asthma. Intravenous methylxanthines are likewise not recommended in COPD."},{"cat":"Anticholinergic","stem":"Regarding ipratropium and asthma, which statement is correct?","roman":null,"opts":["It carries a labeled indication for asthma","It has no labeled indication for asthma","It is first-line therapy for all asthma","It replaces beta agonists in asthma"],"ans":1,"why":"Ipratropium does not have a labeled indication for asthma, although asthma guidelines note it may have some additive benefit. It is commonly added in severe asthma alongside beta agonists."},{"cat":"Anticholinergic","stem":"Which anticholinergic effect corresponds to the cholinergic effect of miosis?","roman":null,"opts":["Mydriasis","Cycloplegia","Lacrimation","Salivation"],"ans":0,"why":"Cholinergic stimulation causes miosis, contraction of the iris, so blocking it causes mydriasis, pupil dilation. Cycloplegia, the flattening of the lens, is the anticholinergic counterpart to lens thickening."},{"cat":"Anticholinergic","stem":"Cholinergic stimulation produces salivation and lacrimation. Anticholinergic effects on those same functions are:","roman":null,"opts":["Increased salivation and tearing","Drying of the airway and fewer tears","Increased mucus and more tears","Increased tears with a dry mouth"],"ans":1,"why":"Anticholinergics dry the upper airway and inhibit tear formation. They also slow mucociliary clearance, cause urinary retention, and produce constipation."},{"cat":"Anticholinergic","stem":"A long-acting muscarinic antagonist works for how long per dose?","roman":null,"opts":["1 to 3 hours","4 to 6 hours","12 to 24 hours","48 to 72 hours"],"ans":2,"why":"A LAMA works 12 to 24 hours per dose and is used for daily maintenance in COPD and severe asthma. A SAMA works 4 to 6 hours and serves as quick relief or short-term maintenance."},{"cat":"Biologic","stem":"A patient taking mepolizumab asks what to do during an asthma exacerbation. Your best response is:","roman":null,"opts":["Take an extra dose right away","Do not use it during an exacerbation","Double the dose for three days","Stop all other asthma medications"],"ans":1,"why":"Biologics are not used during an asthma or COPD exacerbation. Patients continue all their other medications without changing the doses."},{"cat":"Biologic","stem":"Mepolizumab for severe eosinophilic asthma in a patient aged 12 or older is dosed at:","roman":null,"opts":["40 mg every 4 weeks","100 mg every 4 weeks","300 mg every 2 weeks","100 mg every week"],"ans":1,"why":"Patients 12 and older receive 100 mg subcutaneously every 4 weeks, while children 6 to 11 receive 40 mg every 4 weeks."},{"cat":"Biologic","stem":"Dupilumab is supplied as a prefilled syringe or pen containing:","roman":null,"opts":["100 mg (1 mL)","300 mg (2 mL)","500 mg (5 mL)","40 mg (0.4 mL)"],"ans":1,"why":"Dupilumab comes as a 300 mg (2 mL) prefilled syringe or pen given subcutaneously, usually every 2 to 4 weeks depending on age and weight."},{"cat":"Indications","stem":"Adrenergic bronchodilators are indicated for reversible airflow obstruction in all of the following EXCEPT:","roman":null,"opts":["Acute and chronic asthma","Bronchitis and emphysema","Bronchiectasis","Pulmonary embolism"],"ans":3,"why":"The indications are asthma, bronchitis, emphysema, and bronchiectasis, all of which involve reversible airway smooth muscle constriction. A pulmonary embolism is a vascular problem, not an airway one."},{"cat":"Classification","stem":"A long-acting beta-2 agonist is defined by a duration of:","roman":null,"opts":["4 to 6 hours","8 hours or less","12 hours or more","24 hours exactly"],"ans":2,"why":"A LABA lasts 12 hours or more and is most beneficial as maintenance therapy. A SABA relieves acute reversible obstruction and serves as the rescue or reliever agent."},{"cat":"Pharmacology","stem":"Adding an anticholinergic to a short-acting beta-2 agonist in COPD has what documented effect?","roman":null,"opts":["It improves FEV1","It reduces heart rate","It eliminates the need for oxygen","It has no measurable effect"],"ans":0,"why":"Using a short-acting beta-2 agonist together with an anticholinergic improves FEV1 in COPD patients. COPD guidelines do not dictate the use of any single specific bronchodilator."},{"cat":"Drug development","stem":"In which phase of human testing is a new drug given to a small population of healthy volunteers?","roman":null,"opts":["Phase I","Phase II","Phase III","Phase IV"],"ans":0,"why":"Phase I uses a small group of healthy volunteers. Phase II tests people who have the disease, and Phase III runs large multicenter trials against a placebo or standard of care."},{"cat":"Drug development","stem":"Large multicenter trials comparing a drug against a placebo or standard of care occur in:","roman":null,"opts":["Phase I","Phase II","Phase III","Phase IV"],"ans":2,"why":"Phase III is the large multicenter trial stage with a control group. It is the last phase before approval, following the healthy-volunteer and disease-population phases."},{"cat":"Drug development","stem":"Postmarketing studies, performed after a drug is already on the market to detect rare or serious adverse effects, are:","roman":null,"opts":["Phase I studies","Phase II studies","Phase III studies","Phase IV studies"],"ans":3,"why":"Phase IV studies are the postmarketing studies. They are becoming more frequent and look for rare or serious adverse effects that may not have been detected before approval."},{"cat":"Drug development","stem":"Which federal agency regulates drug testing and approves new drugs for the market?","roman":null,"opts":["The FDA","The CDC","The NIH","The USAN Council"],"ans":0,"why":"The FDA regulates testing and approves new drugs, balancing the need to get useful drugs to market quickly against consumer safety. The USAN Council assigns generic names instead."},{"cat":"Drug development","stem":"Drugs today are derived from all of the following EXCEPT:","roman":null,"opts":["Plants and animals","Minerals and chemicals","Monoclonal antibodies and rDNA","Radioactive isotopes only"],"ans":3,"why":"Sources include plants, animals, minerals, chemicals, monoclonal antibodies, and recombinant DNA. Most drugs today are synthetic, though many are predicted to be bioengineered in the future."},{"cat":"Pharmacokinetics","stem":"Oral propranolol is dosed at 40 mg while the intravenous dose is 1 mg, yet both produce about the same response. This difference is explained by:","roman":null,"opts":["The first-pass effect","Tachyphylaxis","A depot formulation","Renal clearance"],"ans":0,"why":"Liver enzymes inactivate much of an orally absorbed drug before it reaches the circulation, so the oral dose must be higher. Parenteral routes bypass the liver and avoid the first-pass effect."},{"cat":"Pharmacokinetics","stem":"Which route AVOIDS the first-pass effect?","roman":null,"opts":["Oral","Nasogastric tube","Intravenous","PEG tube"],"ans":2,"why":"Parenteral routes such as IV go directly into the bloodstream and bypass the liver. Oral, NG, and PEG routes all deliver drug to the GI tract, so all are subject to first-pass metabolism."},{"cat":"Routes","stem":"Nitroglycerin is given sublingually for cardiac chest pain because:","roman":null,"opts":["It is better tolerated than a tablet","The vasculature there absorbs it quickly","It cannot be absorbed in the stomach","It avoids every cardiac side effect"],"ans":1,"why":"The rich vasculature under the tongue absorbs the drug quickly, which gives the rapid onset needed for chest pain. Good salivary flow is required for a sublingual tablet to dissolve."},{"cat":"Routes","stem":"Which route would be most appropriate for a patient who is NPO and vomiting?","roman":null,"opts":["Oral","Rectal","Sublingual","Nasogastric"],"ans":1,"why":"Rectal administration is effective for patients who are NPO, vomiting, or unable to swallow. Oral and sublingual both require the patient to take something by mouth."},{"cat":"Routes","stem":"Which statement about intramuscular absorption is correct?","roman":null,"opts":["Clear water-based solutions act rapidly","Oil-based suspensions act most rapidly","All IM formulations absorb identically","IM drugs can be removed if needed"],"ans":0,"why":"Clear or water-based solutions have a rapid effect, while cloudy or oil-based suspensions absorb more slowly. Once injected IM, the drug is there to stay even if side effects occur."},{"cat":"Routes","stem":"Which drug property prevents intravenous administration?","roman":null,"opts":["Being water soluble","Being insoluble","Having a short half-life","Having a bitter taste"],"ans":1,"why":"Insoluble drugs cannot be dissolved and therefore cannot be given intravenously. Some drugs also cannot be given together IV because of physical incompatibilities."},{"cat":"Routes","stem":"Which risks are specific to parenteral administration?","roman":null,"opts":["Infection, pain, and local irritation","Tooth decay and taste alteration","First-pass liver metabolism","Clogging of the feeding tube"],"ans":0,"why":"Parenteral administration carries risks of infection, pain, and local irritation. First-pass metabolism affects the oral route, and clogging is a concern with NG tubes."},{"cat":"Routes","stem":"A drug formulated in oil and given intramuscularly every 2 weeks to a noncompliant patient is called a:","roman":null,"opts":["Loading dose","Depot formulation","Sustained-release tablet","Transdermal patch"],"ans":1,"why":"Depot formulations release slowly after administration, so they need to be given only every week or so. Some are formulated in oil, and the goal is compliance rather than speed of onset."},{"cat":"Routes","stem":"Which feeding tube is inserted directly into the stomach and is generally more comfortable than the alternative?","roman":null,"opts":["Nasogastric tube","Orogastric tube","PEG tube","Nasotracheal tube"],"ans":2,"why":"A PEG tube is placed percutaneously and endoscopically, directly into the stomach. An NG tube passes through the nose and esophagus to rest in the stomach."},{"cat":"Routes","stem":"Which is a documented concern when giving medications through an NG tube?","roman":null,"opts":["First-pass metabolism is avoided","Drug stability and clogging of the tube","Absorption is always immediate","Sustained-release forms work best"],"ans":1,"why":"Drug stability and clogging of the tube are the practical concerns, and compatibility with foods and liquids must be considered. Being an enteral route, it does not avoid the first-pass effect."},{"cat":"Routes","stem":"According to the textbook, inhalation drug delivery is best described as a form of:","roman":null,"opts":["Enteral systemic delivery","Parenteral injection delivery","Topical delivery to the lungs","Transdermal patch delivery"],"ans":2,"why":"The textbook classifies inhalation as topical delivery to the lungs, where micron-sized particles reach the bronchial tree for rapid absorption. Note that your lecture slides list inhalation as its own route category instead."},{"cat":"Routes","stem":"Local administration of a drug to the lungs is advantageous because of the lungs':","roman":null,"opts":["Small surface area and slow blood flow","Large surface area and nearby circulation","Distance from the pulmonary vessels","Natural resistance to drug absorption"],"ans":1,"why":"The lungs offer a large surface area and sit close to the pulmonary circulation, so absorption is rapid. Delivering drug locally also often avoids systemic side effects."},{"cat":"Routes","stem":"Which is the main advantage of a transdermal patch?","roman":null,"opts":["Immediate onset of drug action","Sustained levels with less frequent dosing","Complete avoidance of all side effects","Higher total drug delivery per dose"],"ans":1,"why":"A patch releases drug slowly, giving sustained blood levels throughout the day without the patient having to remember doses. Less frequent dosing is easier to remember and improves compliance."},{"cat":"Routes","stem":"The oral route is usually described as the most:","roman":null,"opts":["Rapid in onset","Convenient and economical","Reliable in emergencies","Precise in dosing"],"ans":1,"why":"Oral is the most common, convenient, and economical route, but onset is slower and it is subject to the first-pass effect, so it is not the route for emergencies."},{"cat":"Routes","stem":"Which routes are considered enteral?","roman":["Oral (po)","Sublingual (SL)","Rectal (PR)","PEG tube"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"Enteral means absorption through the GI tract for systemic purposes, which includes oral, sublingual, rectal, and NG or PEG tube routes. Parenteral routes are the injectable ones."},{"cat":"Delivery device","stem":"Which drawback is specifically associated with the inhalational route?","roman":null,"opts":["More systemic side effects","It requires coordination","It cannot be used for emergencies","It bypasses the lungs"],"ans":1,"why":"Inhalation has FEWER systemic side effects, which is its advantage, but it requires patient coordination. MDIs, DPIs, and small-volume nebulizers all depend on correct technique."},{"cat":"Pharmacokinetics","stem":"Pharmacokinetics is best defined as:","roman":null,"opts":["What the drug does to the body","What the body does to the drug","How drugs bind to receptors","How drugs interact with each other"],"ans":1,"why":"Kinesis means movement, so pharmacokinetics is the movement of a drug through the body: absorption, distribution, metabolism, and elimination. What the drug does to the body is pharmacodynamics."},{"cat":"Pharmacokinetics","stem":"What is the rate-limiting step in drug absorption?","roman":null,"opts":["Disintegration","Distribution","Metabolism","Excretion"],"ans":0,"why":"A drug must disintegrate or dissolve before it can be absorbed, so disintegration limits the rate. A drug already in solution begins working more quickly."},{"cat":"Pharmacokinetics","stem":"Which route completely bypasses the absorption step?","roman":null,"opts":["Intramuscular","Subcutaneous","Intravenous","Intradermal"],"ans":2,"why":"Only intravenous injection enters the bloodstream directly. IM, SC, and intradermal injections must still be absorbed from body tissues."},{"cat":"Pharmacokinetics","stem":"The measure of how much drug is absorbed into the circulation is called:","roman":null,"opts":["Bioavailability","Volume of distribution","Clearance","Half-life"],"ans":0,"why":"Bioavailability measures the amount reaching the circulation. It is influenced by solubility, dosage form, route, pH, and salt form."},{"cat":"Pharmacokinetics","stem":"Which form of a drug is absorbed through membranes and therefore active?","roman":null,"opts":["The ionized form","The nonionized form","Both equally well","Neither crosses membranes"],"ans":1,"why":"The nonionized, uncharged form crosses membranes and can be active. The ionized, charged form is not absorbed. A useful hook is no charge, no problem."},{"cat":"Pharmacokinetics","stem":"Aspirin, an acidic drug, is best absorbed in which environment?","roman":null,"opts":["The acidic stomach","The alkaline colon","The bloodstream","The kidney tubules"],"ans":0,"why":"An acidic drug stays more nonionized in an acidic environment, so aspirin is better absorbed in the stomach at pH 1 to 2. Alkaline drugs such as quinidine absorb better further along the GI tract."},{"cat":"Pharmacokinetics","stem":"The approximate pH of the stomach is:","roman":null,"opts":["1 to 2","4 to 5","7 to 8","9 to 10"],"ans":0,"why":"The stomach is very acidic at pH 1 to 2, while the intestines sit around pH 4 to 5 and grow more alkaline further along the GI tract."},{"cat":"Pharmacokinetics","stem":"Which of the following are mechanisms by which drugs cross membranes?","roman":["Passive diffusion","Facilitated diffusion","Active transport","Ion channels"],"opts":["I and II only","II and III only","I, II, and III","I, II, III, and IV"],"ans":3,"why":"All four are mechanisms of membrane passage. Molecule size, ionization, and lipid solubility determine which drugs can use them."},{"cat":"Pharmacokinetics","stem":"What is the major vehicle for drug distribution in the body?","roman":null,"opts":["The lymphatic system","The bloodstream","The biliary tree","The interstitial fluid"],"ans":1,"why":"The bloodstream carries the drug to its receptors. Blood flow, fat or water solubility, and protein binding all influence where the drug ends up."},{"cat":"Pharmacokinetics","stem":"A drug bound to albumin in the bloodstream is:","roman":null,"opts":["Active at receptor sites","Inactive until released","Excreted immediately","More potent than free drug"],"ans":1,"why":"Bound drug cannot reach active sites, so only free, unbound drug is active. A helpful hook is that bound is benched and free is playing."},{"cat":"Pharmacokinetics","stem":"A malnourished patient with low serum albumin is given a highly protein-bound drug. You would expect:","roman":null,"opts":["A smaller drug response","A greater drug response","No change in response","Complete drug inactivation"],"ans":1,"why":"With less albumin available, more drug stays free in the bloodstream. Free drug is active drug, so blood levels of active drug and the overall response both rise."},{"cat":"Pharmacokinetics","stem":"Two highly protein-bound drugs are given together. What is the likely result?","roman":null,"opts":["They compete, freeing more active drug","Both become permanently inactive","Absorption stops entirely","Protein production increases"],"ans":0,"why":"There are only so many protein binding sites, so the drugs compete. Whichever is displaced becomes free and active, which is a common mechanism of drug interaction."},{"cat":"Pharmacokinetics","stem":"Diazepam is fat soluble. Compared with a lean patient, an obese patient given the same dose will most likely be:","roman":null,"opts":["Sedated for a shorter time","Sedated for a longer time","Unaffected by the drug","Resistant to sedation"],"ans":1,"why":"Fat-soluble drugs have a greater effect in patients with more fat, so sedation lasts longer. Changes in fat and water compartments with age also explain why young and elderly patients need different doses."},{"cat":"Pharmacokinetics","stem":"Drug metabolism, also called biotransformation, converts a drug into a form that is more:","roman":null,"opts":["Fat soluble","Water soluble","Protein bound","Highly ionized"],"ans":1,"why":"Metabolism makes the drug more water soluble so it can leave the body in urine, feces, or sweat. Some resulting metabolites are active and some are not."},{"cat":"Pharmacokinetics","stem":"The liver's microsomal drug oxidation system responsible for metabolizing many drugs is the:","roman":null,"opts":["Cytochrome P450 system","Renin-angiotensin system","Reticuloendothelial system","Glomerular filtration system"],"ans":0,"why":"The cytochrome P450 enzymes can be induced, meaning increased activity, or inhibited, meaning decreased activity. This is one of the commonest mechanisms of drug interaction."},{"cat":"Pharmacokinetics","stem":"Induction of cytochrome P450 enzymes would have which effect on a drug metabolized by that system?","roman":null,"opts":["It would be cleared more quickly","It would accumulate in the blood","It would stop being absorbed","It would bind more protein"],"ans":0,"why":"Induction increases enzyme activity, so the drug is broken down faster. This explains why frequent drinkers tolerate alcohol better, since induced enzymes clear it more quickly. Inhibition does the opposite and lets the drug build up."},{"cat":"Pharmacokinetics","stem":"Which statement about assessing the liver's ability to metabolize drugs is correct?","roman":null,"opts":["Liver function tests predict it reliably","Liver function tests do not correlate with it","It can be measured quantitatively","It is identical in all patients"],"ans":1,"why":"Liver function tests do not correlate with the body's ability to metabolize a drug, and hepatic elimination cannot be assessed quantitatively. Some patients also genetically lack certain enzymes."},{"cat":"Pharmacokinetics","stem":"Which two agents are classic causes of drug-induced liver toxicity, especially in combination?","roman":null,"opts":["Aspirin and ibuprofen","Alcohol and acetaminophen","Albuterol and ipratropium","Insulin and metformin"],"ans":1,"why":"More than 600 drugs have been associated with drug-induced liver toxicity, and alcohol plus acetaminophen is the classic dangerous pairing."},{"cat":"Pharmacokinetics","stem":"Renal excretion rate is affected by which processes?","roman":["Glomerular filtration","Tubular secretion","Tubular reabsorption"],"opts":["I and II only","I and III only","II and III only","I, II, and III"],"ans":3,"why":"All three affect the rate of renal excretion. Impaired renal function prolongs the effects of drugs cleared by the kidneys, because they remain in the system longer."},{"cat":"Pharmacokinetics","stem":"A patient with impaired renal function is given a drug eliminated by the kidneys. You would expect the drug's effects to be:","roman":null,"opts":["Shortened considerably","Prolonged considerably","Completely eliminated","Unchanged from normal"],"ans":1,"why":"A drug that is not readily eliminated remains in the system longer, so its effects are prolonged. That is why renal impairment often requires a dose or interval adjustment."},{"cat":"Pharmacokinetics","stem":"Drug action from inhalation anesthesia is terminated when the gas is:","roman":null,"opts":["Metabolized by the liver","Eliminated from the lungs","Bound to plasma albumin","Filtered by the glomerulus"],"ans":1,"why":"Inhaled anesthetic passes from inspired air to blood and brain, and its action ends when the drug is eliminated from the lungs. Elimination can occur through urine, feces, skin, or the pulmonary system."},{"cat":"Pharmacokinetics","stem":"How long a drug can be detected by urine testing depends largely on whether the drug is:","roman":null,"opts":["Acidic or alkaline","Fat or water soluble","Branded or generic","Oral or injected"],"ans":1,"why":"Fat or water solubility influences how long after ingestion a drug shows up in the urine. Urine testing screens for drug abuse, identifies poisoning, and monitors rehabilitation patients."},{"cat":"Clinical scenario","stem":"A COPD patient's heart rate rises from 84 to 112 during a nebulized albuterol treatment and he reports palpitations. Your first action is to:","roman":null,"opts":["Finish the treatment and chart the change","Stop the treatment and assess the patient","Increase the flow to finish faster","Give a second treatment immediately"],"ans":1,"why":"A rise of more than 20 beats per minute is significant. Stop first, assess, then notify the nurse and physician. Charting and further treatment come after the patient is safe."},{"cat":"Clinical scenario","stem":"A patient with asthma has been using her rescue inhaler four times a day for two weeks. The most appropriate recommendation is to:","roman":null,"opts":["Increase the rescue inhaler dose","Add or step up a controller medication","Switch to a different rescue inhaler","Stop the rescue inhaler entirely"],"ans":1,"why":"Heavy rescue use signals uncontrolled inflammation, which a bronchodilator cannot fix. The answer is a controller, usually an inhaled corticosteroid, not more reliever."},{"cat":"Clinical scenario","stem":"You are asked to give albuterol, acetylcysteine, and an inhaled corticosteroid to a cystic fibrosis patient, along with airway clearance. The correct order is:","roman":null,"opts":["Steroid, albuterol, clearance, mucolytic","Albuterol, mucolytic, clearance, steroid","Mucolytic, steroid, albuterol, clearance","Clearance, steroid, mucolytic, albuterol"],"ans":1,"why":"Open the airway first with the bronchodilator, thin the secretions with the mucolytic, clear them, then deposit the steroid in clean airways. The steroid always goes last so it is not coughed out."},{"cat":"Clinical scenario","stem":"A patient using an inhaled corticosteroid develops white patches in his mouth and a hoarse voice. This was most likely preventable by:","roman":null,"opts":["Using a faster inhalation","Rinsing the mouth after each dose","Taking the dose with food","Doubling the interval between doses"],"ans":1,"why":"Drug left in the mouth causes thrush and dysphonia. Rinsing and spitting after each dose, and using a spacer with an MDI, prevent it."},{"cat":"Clinical scenario","stem":"A patient taking theophylline is started on ciprofloxacin. You should anticipate:","roman":null,"opts":["A falling theophylline level","A rising theophylline level","No change in the level","A need to double the dose"],"ans":1,"why":"Ciprofloxacin inhibits the liver enzymes that clear theophylline, so the level climbs toward toxicity. Macrolides and cimetidine do the same, while smoking and rifampin lower levels."},{"cat":"Clinical scenario","stem":"A theophylline patient quits smoking. Which change should you anticipate?","roman":null,"opts":["The level will fall","The level will rise","The drug will stop working","Absorption will stop"],"ans":1,"why":"Smoking induces the enzymes that clear theophylline, so quitting removes that induction and the level rises. Dose adjustment and a repeat level are warranted."},{"cat":"Clinical scenario","stem":"A patient is admitted with a COPD exacerbation and cannot coordinate an inhaler because of severe dyspnea. The best delivery choice is:","roman":null,"opts":["A dry powder inhaler","A small-volume nebulizer","A soft mist inhaler alone","An oral tablet"],"ans":1,"why":"A nebulizer requires only tidal breathing, so it works when a patient cannot coordinate or generate adequate inspiratory flow. A DPI in particular needs a forceful breath the patient cannot produce."},{"cat":"Pharmacokinetics","stem":"Metabolism breaks a drug down into several components called:","roman":null,"opts":["Isomers, all of them inactive","Metabolites, some active and some not","Enantiomers that are always active","Precursors that must be reabsorbed"],"ans":1,"why":"Biotransformation yields metabolites, some pharmacologically active and some not. The purpose is to make the drug water soluble so it can leave in urine, feces, or sweat."},{"cat":"Clinical scenario","stem":"A patient receiving nebulized pentamidine begins wheezing partway through the treatment. The most likely explanation is:","roman":null,"opts":["The drug caused bronchospasm","The dose was too small","The nebulizer was overfilled","The drug was too warm"],"ans":0,"why":"Pentamidine commonly causes bronchospasm, which is why a bronchodilator is given first. Stop, treat the bronchospasm, and resume only when the airway settles."},{"cat":"Clinical scenario","stem":"A child with croup receives racemic epinephrine and improves markedly. Ninety minutes later the stridor returns. This is best explained by:","roman":null,"opts":["A second infection","Rebound as the drug wears off","An allergic reaction","Incorrect original diagnosis"],"ans":1,"why":"The effect lasts only about 1 to 2 hours and swelling can return as it fades, which is exactly why these patients are observed rather than discharged straight away."},{"cat":"Clinical scenario","stem":"A patient prescribed Advair asks whether she can use it when she suddenly cannot catch her breath. Your best response is:","roman":null,"opts":["Yes, use it for any sudden symptoms","No, it is a twice-daily controller","Yes, but only once per hour","No, and stop your rescue inhaler"],"ans":1,"why":"Advair pairs fluticasone with salmeterol, whose onset is far too slow for rescue. She keeps a short-acting inhaler for sudden symptoms and takes Advair on schedule."},{"cat":"Clinical scenario","stem":"An elderly patient on tiotropium reports difficulty starting his urine stream. This finding is:","roman":null,"opts":["Unrelated to the medication","A known anticholinergic effect","A sign of drug tolerance","An expected beta-2 effect"],"ans":1,"why":"Blocking muscarinic receptors can cause urinary retention, which is why benign prostatic hyperplasia is a standing caution with these drugs. Report it rather than dismissing it."},{"cat":"Clinical scenario","stem":"A patient's nebulized treatment order reads 0.5 mL of 2.25% racemic epinephrine. Before giving it you should:","roman":null,"opts":["Give it undiluted by mouthpiece","Dilute it in about 3 mL of saline","Warm it to body temperature","Mix it with acetylcysteine"],"ans":1,"why":"Racemic epinephrine is diluted, commonly in about 3 mL of normal saline, before nebulization. Protect it from light and discard it if it has discolored."},{"cat":"Clinical scenario","stem":"A patient with myasthenia gravis is prescribed an inhaled anticholinergic. Your response should be to:","roman":null,"opts":["Give it without comment","Question the order with the physician","Double the ordered dose","Substitute a beta agonist yourself"],"ans":1,"why":"Myasthenia gravis is a caution with anticholinergics because of their effect on neuromuscular transmission. Clarify with the physician rather than acting alone or substituting a drug."},{"cat":"Combination","stem":"Anoro Ellipta contains which combination?","roman":null,"opts":["A steroid and a beta agonist","A LABA and a LAMA","Two beta agonists","A steroid and a xanthine"],"ans":1,"why":"Anoro Ellipta pairs vilanterol, a long-acting beta agonist, with umeclidinium, a long-acting muscarinic antagonist. It is a once-daily dual bronchodilator for COPD."},{"cat":"Combination","stem":"Symbicort and Dulera share which pairing?","roman":null,"opts":["Two bronchodilators","A steroid and a LABA","A steroid and a LAMA","A xanthine and a steroid"],"ans":1,"why":"Symbicort is budesonide with formoterol and Dulera is mometasone with formoterol. Both pair an inhaled corticosteroid with a long-acting beta agonist for maintenance control."},{"cat":"Combination","stem":"Which product would be appropriate for a patient needing both a short-acting bronchodilator and an anticholinergic in one treatment?","roman":null,"opts":["Advair","DuoNeb","Spiriva","Pulmicort"],"ans":1,"why":"DuoNeb combines albuterol with ipratropium in a single nebulizer solution. Combivent Respimat delivers the same pairing as a soft mist inhaler."},{"cat":"Drug class","stem":"Spiriva, Incruse, and Tudorza all belong to which class?","roman":null,"opts":["Long-acting beta-2 agonists","Long-acting muscarinic blockers","Inhaled corticosteroids","Mast cell stabilizing agents"],"ans":1,"why":"Spiriva is tiotropium, Incruse is umeclidinium, and Tudorza is aclidinium. All three are long-acting anticholinergics used for COPD maintenance."},{"cat":"Drug class","stem":"Xopenex is the brand name for which drug?","roman":null,"opts":["Albuterol","Levalbuterol","Salmeterol","Ipratropium"],"ans":1,"why":"Xopenex is levalbuterol, the R-isomer of albuterol. It is short acting, with a duration of about 5 to 6 hours."},{"cat":"Drug class","stem":"Which brand name is paired correctly with its generic drug?","roman":null,"opts":["Atrovent is albuterol","Brovana is arformoterol","Serevent is formoterol","Pulmicort is fluticasone"],"ans":1,"why":"Brovana is arformoterol, a nebulized LABA for COPD. Atrovent is ipratropium, Serevent is salmeterol, and Pulmicort is budesonide."},{"cat":"Pharmacokinetics","stem":"Albuterol has a plasma half-life of about 3.8 hours. Roughly how long until half the drug in the plasma is gone?","roman":null,"opts":["About 2 hours","About 4 hours","About 8 hours","About 24 hours"],"ans":1,"why":"Half-life is the time for the plasma concentration to fall by half, so albuterol takes roughly 4 hours. Levalbuterol is similar at 3.3 hours and fluticasone is longer at 7.8."},{"cat":"Pharmacokinetics","stem":"Which drug from the half-life table would remain in the body the longest?","roman":null,"opts":["Acetaminophen","Morphine","Azithromycin","Amoxicillin"],"ans":2,"why":"Azithromycin has a half-life of about 40 hours, by far the longest on the list. Amoxicillin is 1.7, morphine 1.9, and acetaminophen 2."},{"cat":"Pharmacokinetics","stem":"A drug is described as having poor bioavailability by the oral route. This means that:","roman":null,"opts":["It is not absorbed into circulation well","It binds too tightly to receptors","It is eliminated only by the lungs","It cannot be given by injection"],"ans":0,"why":"Bioavailability is the amount of drug that actually reaches the circulation. Poor oral bioavailability often reflects heavy first-pass metabolism, so another route may be needed."},{"cat":"Pharmacokinetics","stem":"Two drugs compete for the same plasma protein binding sites. The clinical result is that:","roman":null,"opts":["Both drugs are rendered inactive","The displaced drug becomes active","Absorption of both drugs stops","Neither drug reaches its receptor"],"ans":1,"why":"Whichever drug is displaced from the protein is now free, and free drug is active drug. This is a classic mechanism of drug interaction and can push a patient into toxicity."},{"cat":"Pharmacokinetics","stem":"A patient with significant liver disease is prescribed a drug cleared by hepatic metabolism. The most appropriate expectation is that:","roman":null,"opts":["Liver function tests will predict clearance","The dose may need adjusting","Metabolism will be measurably faster","The drug will not be absorbed"],"ans":1,"why":"Liver disease may mean avoiding the drug or changing the dose. Liver function tests do not correlate with the ability to metabolize a drug, and hepatic elimination cannot be measured quantitatively."},{"cat":"Pharmacokinetics","stem":"Which route would be chosen to produce the most rapid systemic effect in an emergency?","roman":null,"opts":["Oral","Rectal","Intravenous","Transdermal"],"ans":2,"why":"Intravenous administration delivers drug straight into the bloodstream, bypassing absorption entirely. That is why it is the emergency route when an immediate response is needed."},{"cat":"Delivery device","stem":"A patient using an MDI without a spacer deposits most of the dose in the mouth and throat. The best correction is to:","roman":null,"opts":["Inhale faster and harder","Add a valved holding chamber","Hold the inhaler farther away","Take two puffs at once"],"ans":1,"why":"A spacer or valved holding chamber slows the aerosol and lets large particles drop out, which improves lung delivery and reduces oropharyngeal deposition and thrush."},{"cat":"Delivery device","stem":"Which device requires the patient to generate a forceful inspiratory effort?","roman":null,"opts":["Small-volume nebulizer","Dry powder inhaler","Soft mist inhaler","Metered dose inhaler with spacer"],"ans":1,"why":"A DPI relies on the patient's own inspiratory flow to break up and disperse the powder. A patient in severe distress may not manage it, which is when a nebulizer is the better choice."},{"cat":"Delivery device","stem":"Which nebulizer system must be used specifically with aztreonam?","roman":null,"opts":["PARI LC Plus","Altera","Respirgard II","SPAG-2"],"ans":1,"why":"Cayston is approved only with the Altera nebulizer. Respirgard II is for pentamidine and the SPAG-2 is for ribavirin, each matched to its drug for safety and delivery reasons."},{"cat":"Delivery device","stem":"Which device is required when administering ribavirin?","roman":null,"opts":["Jet nebulizer with mouthpiece","Small particle aerosol generator","Ultrasonic nebulizer","Metered dose inhaler"],"ans":1,"why":"Ribavirin is delivered only by the SPAG-2, the small particle aerosol generator, in a negative-pressure setting. Pregnant staff must avoid exposure because the drug is teratogenic."},{"cat":"Delivery device","stem":"A patient is switching from an HFA inhaler to an Ellipta device. Which instruction changes?","roman":null,"opts":["Rinse the mouth after steroid doses","Do not shake or prime the device","Keep the medication upright","Store it away from heat"],"ans":1,"why":"An Ellipta is a dry powder device, so there is nothing to shake or prime. Slide the cover until it clicks, inhale steadily and deeply, and do not exhale into it."},{"cat":"Autonomic","stem":"A cholinergic effect on the eye is miosis. The corresponding effect on the lens is:","roman":null,"opts":["Cycloplegia","Thickening of the lens","No change to the lens","Corneal clouding"],"ans":1,"why":"Cholinergic stimulation thickens the lens for near vision, and the anticholinergic counterpart is cycloplegia, in which the lens is flattened. That flattening is why blurred vision occurs."},{"cat":"Autonomic","stem":"Which effect would you expect from a parasympathomimetic drug in the airway?","roman":null,"opts":["Bronchodilation and drying","Bronchoconstriction and more mucus","No change in airway tone","Increased mucociliary clearance"],"ans":1,"why":"A parasympathomimetic copies acetylcholine, producing bronchoconstriction and increased mucus. That is precisely why these drugs are not used in lung disease."},{"cat":"Mechanism","stem":"A drug that inhibits phosphodiesterase would be expected to:","roman":null,"opts":["Lower cAMP and constrict airways","Raise cAMP and relax airways","Lower cGMP and constrict airways","Have no effect on airway tone"],"ans":1,"why":"Phosphodiesterase breaks cAMP down, so inhibiting it lets cAMP accumulate and the smooth muscle relax. This is the xanthine mechanism, though at usual doses theophylline is a weak inhibitor."},{"cat":"Mechanism","stem":"Which second messenger must DECREASE for an anticholinergic to produce bronchodilation?","roman":null,"opts":["cAMP","cGMP","Calcium alone","Acetylcholine"],"ans":1,"why":"Anticholinergics lower cyclic GMP, which relieves the parasympathetic bronchoconstricting signal. Sympathomimetics work the other way, by raising cAMP."},{"cat":"Assessment","stem":"A patient's wheezing has decreased but breath sounds are now much quieter and he appears more fatigued. This most likely indicates:","roman":null,"opts":["Successful bronchodilation","Worsening airflow, a silent chest","Complete symptom resolution","An expected response"],"ans":1,"why":"Wheezing needs airflow to be produced. If the wheeze fades while breath sounds diminish and the patient tires, air movement is falling. A true improvement pairs less wheeze with LOUDER breath sounds."},{"cat":"Assessment","stem":"Which pair of measurements should be obtained before and after a bronchodilator treatment?","roman":null,"opts":["Temperature and blood pressure","Peak flow or FEV1","Weight and height","Blood glucose and potassium"],"ans":1,"why":"Peak expiratory flow or FEV1 gives an objective before and after comparison. Subjective dyspnea, breathing pattern, and accessory muscle use are assessed alongside them."},{"cat":"Assessment","stem":"Increased sputum production after a bronchodilator treatment should be interpreted as:","roman":null,"opts":["A dangerous adverse reaction","A positive response","Evidence of infection","A reason to stop therapy"],"ans":1,"why":"Improved airflow lets the patient mobilize and expectorate secretions, so more sputum is one of the listed positive responses along with reduced dyspnea and better oxygenation."},{"cat":"Safety","stem":"You enter a room and the patient answers to a name that is not on your order. The correct action is to:","roman":null,"opts":["Give the treatment anyway","Verify identity before proceeding","Ask the roommate to confirm","Chart it and move on"],"ans":1,"why":"Confused patients sometimes answer to any name, and patients get moved between beds. Verify identity against two identifiers before giving anything. Right patient is one of the six rights."},{"cat":"Safety","stem":"A computerized order defaults to a route you did not intend and you commit it. This is an example of:","roman":null,"opts":["Alert fatigue from warnings","A default setting or auto-fill trap","A duplicate order entry","A formulary restriction"],"ans":1,"why":"Default settings and auto-fill traps are a recognized category of electronic ordering error, alongside wrong drug, wrong patient, wrong route, duplicate orders, and alert fatigue."},{"
