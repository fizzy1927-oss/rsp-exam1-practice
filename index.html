cat":"Safety","stem":"A patient's condition has not improved after several days on a medication, and there are no adverse effects. The best recommendation is to:","roman":null,"opts":["Discontinue all medications","Change the ineffective medication","Continue unchanged indefinitely","Discharge the patient"],"ans":1,"why":"An ineffective drug should be changed, or the amount increased or decreased. Discontinuing altogether is reserved for recovery or a serious adverse reaction."},{"cat":"Anticholinergic","stem":"Which effects would you expect from an anticholinergic bronchodilator?","roman":["Drying of the upper airway","Pupil dilation","Mucociliary slowing","Increased urination"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":1,"why":"Anticholinergics dry the airway, dilate the pupil, and slow mucociliary clearance. They cause urinary retention rather than increased urination, since blocking the parasympathetic system opposes voiding."},{"cat":"Adverse effects","stem":"Which are listed cardiac effects of bronchodilator therapy?","roman":["Cardiac arrhythmias","Palpitations","Unifocal premature ventricular contractions","Bradycardia"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":1,"why":"Arrhythmias, palpitations, and unifocal premature ventricular contractions are all listed, along with tachycardia and decreased cardiac efficiency. Beta agonists speed the heart rather than slowing it."},{"cat":"Clinical scenario","stem":"A patient is short of breath from airway edema rather than bronchospasm. Which interventions target the actual problem?","roman":["Racemic epinephrine","A corticosteroid","A beta-2 agonist"],"opts":["I only","I and II","II and III","I, II, and III"],"ans":1,"why":"Edema is vascular swelling, so a vasoconstrictor shrinks it and a corticosteroid blocks the inflammation driving it. A beta agonist relaxes smooth muscle, which is not what is narrowing the airway here."},{"cat":"Anticholinergic","stem":"Which conditions warrant caution before giving an anticholinergic bronchodilator?","roman":["Narrow-angle glaucoma","Benign prostatic hyperplasia","Myasthenia gravis","Hypothyroidism"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":1,"why":"Narrow-angle glaucoma, benign prostatic hyperplasia, and myasthenia gravis are all cautions, since blocking muscarinic receptors can raise eye pressure, cause urinary retention, and affect neuromuscular transmission. Hypothyroidism is not among them."},{"cat":"Safety","stem":"Which of the following are among the six rights of medication administration?","roman":["Right drug","Right dose","Right patient","Right documentation"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"All four are among the six rights, along with right time and right route. Double-check the order whenever the patient gives an unexpected response."},{"cat":"Delivery device","stem":"Which devices would be appropriate for a patient who cannot generate a strong inspiratory effort?","roman":["Small-volume nebulizer","Dry powder inhaler","Soft mist inhaler"],"opts":["I only","I and III","II and III","I, II, and III"],"ans":1,"why":"A nebulizer needs only tidal breathing, and a soft mist inhaler releases a slow-moving aerosol that is easier to inhale. A dry powder inhaler depends on a forceful breath the patient cannot produce."},{"cat":"Drug responsiveness","stem":"A patient has needed steadily higher doses of a drug over several months to get the same effect. This is:","roman":null,"opts":["Tachyphylaxis","Tolerance","Hypersensitivity","Anaphylaxis"],"ans":1,"why":"Tolerance is the decreasing intensity of response over time, requiring a higher dose. Tachyphylaxis happens within minutes of a dose and reverses when the drug is stopped."},{"cat":"Routes","stem":"A drug given in an oil-based formulation intramuscularly will:","roman":null,"opts":["Absorb faster than a water solution","Absorb more slowly than a water solution","Not be absorbed at all","Bypass absorption entirely"],"ans":1,"why":"Cloudy or oil-based suspensions absorb more slowly than clear water-based solutions. That slow release is the basis for depot formulations given every week or two."},{"cat":"Indications","stem":"Adrenergic bronchodilators work only when the airflow obstruction is:","roman":null,"opts":["Fixed and irreversible","Reversible","Caused by infection","Caused by fluid overload"],"ans":1,"why":"These drugs relax airway smooth muscle where there is reversible obstruction, such as asthma, bronchitis, emphysema, and bronchiectasis. Fixed obstruction will not respond."},{"cat":"Biologic","stem":"Biologics for asthma are directed at which underlying problem?","roman":null,"opts":["Spasm of airway smooth muscle","Type 2 eosinophilic inflammation","Thickened mucus plugging airways","Chronic bacterial colonization"],"ans":1,"why":"Monoclonal antibodies target specific molecules in the inflammatory pathway, such as IgE or interleukin signaling. They are add-on maintenance and do nothing for acute bronchospasm."},{"cat":"Drug naming","stem":"The designation 3,7-dihydro-1,3,7-trimethyl-1H-purine-2,6-dione identifies caffeine. This is its:","roman":null,"opts":["Chemical name","Code name","Official name","Trade name"],"ans":0,"why":"A chemical name states the explicit molecular structure. The code name is a temporary experimental label, the official name is the approved generic, and the trade name is the manufacturer's brand."},{"cat":"Drug naming","stem":"Caffeine citrate USP is an example of which naming stage?","roman":null,"opts":["Chemical name","Code name","Official name","Trade name"],"ans":2,"why":"Once an experimental drug receives full approval for general clinical use, the generic name becomes the official, formal public name. Cafcit would be the trade name for that same drug."},{"cat":"Drug naming","stem":"Proventil HFA and Cafcit are examples of:","roman":null,"opts":["Chemical names","Generic names","Official names","Trade names"],"ans":3,"why":"Trade names are the brand or proprietary names assigned by the manufacturer marketing the drug. Albuterol and caffeine citrate are the corresponding generic names."},{"cat":"Drug naming","stem":"Which organization assigns a drug its generic name?","roman":null,"opts":["The FDA","The USAN Council","The manufacturer","The PDR editorial board"],"ans":1,"why":"The United States Adopted Name Council assigns the generic, or nonproprietary, name once a chemical shows therapeutic potential and marketing is intended."},{"cat":"Pharmacology","stem":"Pharmacodynamics is best described as the study of:","roman":null,"opts":["What the body does to a drug","What a drug does to the body","How drugs are named and classified","How drugs are manufactured"],"ans":1,"why":"Pharmacodynamics focuses on drug-receptor interaction at the site of action and the physiologic effect it produces. Pharmacokinetics is the reverse: what the body does to the drug."},{"cat":"Pharmacokinetics","stem":"Metabolism, or biotransformation, occurs predominantly in which locations?","roman":null,"opts":["The kidneys and bladder","The liver and GI system","The lungs and bronchial tree","The spleen and lymph nodes"],"ans":1,"why":"The chemical breakdown of a drug happens mainly in the liver and GI system. Elimination of the resulting metabolites is then driven primarily by renal excretion."},{"cat":"Pharmacokinetics","stem":"Final elimination of drug metabolites and unchanged parent drug is driven primarily by:","roman":null,"opts":["Hepatic metabolism","Renal excretion","Pulmonary exhalation","Biliary secretion"],"ans":1,"why":"Clearance ends with renal excretion in most cases, although some drugs leave through feces, sweat, or the lungs. Inhaled anesthetics are the classic pulmonary example."},{"cat":"Pharmacokinetics","stem":"Steady state describes the condition in which:","roman":null,"opts":["The first dose has been fully absorbed","Drug input equals the elimination rate","All of the drug is protein bound","Hepatic metabolism has stopped"],"ans":1,"why":"At steady state, a stable maximum concentration is maintained because administration and elimination are balanced. A loading dose is used to reach therapeutic levels more rapidly."},{"cat":"Safety","stem":"According to FDA safety requirements, a long-acting beta-2 agonist should be added only when a patient is:","roman":null,"opts":["Newly diagnosed with asthma","Not controlled on an inhaled steroid","Controlled on a low-dose steroid","Using a rescue inhaler sparingly"],"ans":1,"why":"A LABA is added only when asthma is insufficiently controlled by an inhaled corticosteroid. It is never monotherapy, and it is not added to a patient already well controlled on low- or medium-dose ICS."},{"cat":"Safety","stem":"In pediatric patients, a long-acting beta-2 agonist must be given:","roman":null,"opts":["As a standalone inhaler device","Only as a steroid combination product","At double the usual adult dose","Only during an acute attack"],"ans":1,"why":"Children must receive a LABA only as a combination product containing an inhaled corticosteroid, which removes any chance of accidental monotherapy."},{"cat":"Safety","stem":"A patient whose asthma is already well controlled on a medium-dose inhaled corticosteroid asks about adding a LABA. The correct response is that a LABA:","roman":null,"opts":["Should be added to every regimen","Is not indicated at this control level","Replaces the inhaled corticosteroid","Is the preferred rescue option"],"ans":1,"why":"LABAs are not to be used in patients already adequately controlled on low- or medium-dose inhaled corticosteroids. They are reserved for insufficient control despite an ICS."},{"cat":"Adverse effects","stem":"In vitro evidence shows beta-receptor desensitization can begin within:","roman":null,"opts":["Minutes of exposure","Three days of therapy","Two weeks of therapy","Six months of therapy"],"ans":0,"why":"Acute desensitization appears within minutes of beta-agonist exposure, alongside longer-term receptor downregulation. Despite this, tolerance is not considered clinically significant and does not contraindicate continued therapy."},{"cat":"Adverse effects","stem":"Systemic corticosteroids affect beta-receptor desensitization by:","roman":null,"opts":["Accelerating receptor loss","Reversing it and potentiating the response","Preventing all beta-agonist binding","Having no measurable effect"],"ans":1,"why":"Systemic corticosteroids reverse the desensitization and potentiate the bronchodilator response. Inhaled corticosteroids do not appear to produce the same reversal."},{"cat":"Adverse effects","stem":"Clinically, tolerance to beta-agonist therapy is regarded as:","roman":null,"opts":["A reason to discontinue the drug","Not generally significant","An absolute contraindication","A sign of allergy"],"ans":1,"why":"Tolerance is not generally considered clinically significant and does not contraindicate continued beta-agonist use, even though receptor desensitization is measurable."},{"cat":"Concept","stem":"Airway narrowing from impaired mucociliary clearance should be targeted with:","roman":null,"opts":["Inhaled bronchodilators","Airway clearance and mucolytics","Topical vasoconstrictors","Systemic antibiotic therapy"],"ans":1,"why":"Retained secretions clog the lumen, so the treatment is airway clearance plus mucolytics. Bronchospasm calls for bronchodilators and edema calls for anti-inflammatories or vasoconstrictors."},{"cat":"Concept","stem":"Which treatment category targets airway edema specifically?","roman":null,"opts":["Inhaled beta-2 agonist bronchodilators","Anti-inflammatories or vasoconstrictors","Mucolytics with airway suctioning","Long-acting anticholinergic agents"],"ans":1,"why":"Edema is vascular dilation with fluid accumulation in the mucosa, so it responds to anti-inflammatories and vasoconstrictors. Bronchodilators relax smooth muscle, which is a different mechanism."},{"cat":"Concept","stem":"Bronchoconstriction from any cause produces which combination of findings?","roman":null,"opts":["Lower resistance and less work of breathing","Higher resistance, more work of breathing, dyspnea","Lower resistance with dyspnea only","No change in work of breathing"],"ans":1,"why":"Narrowing raises airway resistance, which elevates the work of breathing and causes dyspnea. Selecting the right treatment depends on identifying which of the three mechanisms is responsible."},{"cat":"Mechanism","stem":"Cyclic GMP is the intracellular messenger associated with:","roman":null,"opts":["Smooth muscle relaxation","Constriction and mucus secretion","Receptor downregulation","Protein binding"],"ans":1,"why":"cGMP is linked to bronchial smooth muscle constriction and mucus secretion when parasympathomimetics stimulate muscarinic pathways. Anticholinergics lower it, while cAMP drives relaxation."},{"cat":"Combination","stem":"In COPD, combining a short-acting beta-2 agonist with an anticholinergic produces:","roman":null,"opts":["Greater FEV1 improvement than either alone","The same effect as either drug alone","A reduction in FEV1","Benefit only in asthma"],"ans":0,"why":"Practice guidelines state that the combination produces superior FEV1 improvement compared with either agent alone, because the two act on different receptors and different regions of the airway."},{"cat":"Assessment","stem":"Auscultation during bronchodilator assessment should specifically compare:","roman":null,"opts":["Heart sounds and bowel sounds","Wheezing against aeration","Voice sounds only","Percussion notes"],"ans":1,"why":"Note wheezing versus aeration. A good response shows decreased wheezing with increased intensity of overall breath sounds, which signals that air is actually moving better."},{"cat":"Assessment","stem":"A heart rate increase of what magnitude requires immediate cessation of a bronchodilator treatment?","roman":null,"opts":["Any increase over baseline","More than 20% over baseline","More than 50% over baseline","Only above 180 beats per minute"],"ans":1,"why":"An increase greater than 20% over baseline, or an absolute rise of at least 20 beats per minute, is clinically significant and warrants stopping the treatment and re-evaluating the patient."},{"cat":"Assessment","stem":"Which finding is listed as an indicator of a positive treatment response?","roman":null,"opts":["Increased accessory muscle use","Increased sputum mobilization","Falling oxygen saturation","Rising respiratory rate"],"ans":1,"why":"Increased sputum mobilization and clearance is a positive sign, along with reduced dyspnea, less accessory muscle use, stabilized vital signs, and a measurable rise in FEV1 or PEF."},{"cat":"Assessment","stem":"Successful pharmacologic intervention is signaled by all of the following EXCEPT:","roman":null,"opts":["Improved vital signs and oxygen saturation","Better lung sounds and work of breathing","The patient reporting feeling better","An unchanged clinical picture"],"ans":3,"why":"Improvement should be visible in objective vital signs, in clinical indicators such as lung sounds and work of breathing, and in what the patient reports. No change means the drug is not working."},{"cat":"Safety","stem":"A patient develops a serious adverse reaction to a medication. The immediate action is to:","roman":null,"opts":["Reduce the dose by one half","Stop the drug and support the patient","Add a second medication","Continue it and monitor closely"],"ans":1,"why":"A serious adverse reaction calls for stopping the offending drug immediately and providing supportive care or airway intervention. Dose adjustment is for an ineffective drug, not a dangerous one."},{"cat":"Safety","stem":"A patient shows no improvement after an adequate trial of a medication but has no adverse effects. Appropriate options include all EXCEPT:","roman":null,"opts":["Increasing or decreasing the dose","Switching to an alternative drug","Adding a complementary agent","Stopping all therapy permanently"],"ans":3,"why":"Absence of improvement calls for re-evaluating and adjusting: change the dose, switch drugs, or add a second complementary agent. Complete discontinuation is reserved for recovery or a serious adverse reaction."},{"cat":"Safety","stem":"Which statements about long-acting beta-2 agonist use in asthma are correct?","roman":["They must never be used as monotherapy","They are not for patients controlled on low-dose ICS","They are added only when an ICS is insufficient","Children must receive them as a combination product"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"All four reflect the FDA safety mandate. A LABA is never monotherapy, is not added when control is already adequate on an ICS, is reserved for insufficient control, and in children must come as a combination product."},{"cat":"Delivery device","stem":"Which clinician errors are recognized traps of computerized order entry?","roman":["Selecting a look-alike or sound-alike drug","Placing orders in the wrong electronic chart","Choosing an oral instead of inhaled formulation","Accepting an automated dosage default"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"All four are documented CPOE traps, along with duplicate orders and alert fatigue from frequent pop-ups leading clinicians to override critical warnings."},{"cat":"Mechanism","stem":"Which statements correctly describe where bronchodilator classes act?","roman":["Beta-2 agonists act on small peripheral airways","Anticholinergics act on small peripheral airways","Anticholinergics act on central, larger airways"],"opts":["I and II only","I and III only","II and III only","I, II, and III"],"ans":1,"why":"Beta-2 receptors concentrate in the small peripheral airways and anticholinergics act predominantly on central, larger airways. Methylxanthines are systemic agents, not inhaled, so they do not target one airway region."},{"cat":"Autonomic","stem":"Which branches make up the peripheral nervous system?","roman":["Somatic","Parasympathetic","Sympathetic","Central nervous system"],"opts":["I and II only","I, II, and III","III and IV only","I, II, III, and IV"],"ans":1,"why":"The peripheral nervous system contains the somatic branch and the autonomic branch, and the autonomic branch divides into sympathetic and parasympathetic. The central nervous system is the brain and spinal cord, so it is not part of the PNS."},{"cat":"Autonomic","stem":"Which neurotransmitter is released at the PREganglionic fiber of both autonomic divisions?","roman":null,"opts":["Norepinephrine","Acetylcholine","Epinephrine","Dopamine"],"ans":1,"why":"Both the sympathetic and parasympathetic divisions release acetylcholine at the preganglionic synapse. They differ only after the ganglion, where the sympathetic switches to norepinephrine."},{"cat":"Autonomic","stem":"Norepinephrine at the POSTganglionic fiber is characteristic of which division?","roman":null,"opts":["Sympathetic only","Parasympathetic only","Both divisions equally","Neither division"],"ans":0,"why":"The sympathetic division releases norepinephrine at most postganglionic targets. The parasympathetic division uses acetylcholine at both the preganglionic and postganglionic fibers."},{"cat":"Autonomic","stem":"Acetylcholine released at the POSTganglionic fiber indicates which division?","roman":null,"opts":["Sympathetic only","Parasympathetic only","Neither division","Somatic motor only"],"ans":1,"why":"The parasympathetic division uses acetylcholine at both synapses, acting on muscarinic receptors at the target organ. The sympathetic division switches to norepinephrine after the ganglion."},{"cat":"Autonomic","stem":"Digestion is primarily controlled by which division of the autonomic nervous system?","roman":null,"opts":["Sympathetic","Parasympathetic","Somatic","Neither division"],"ans":1,"why":"Digestion belongs to the rest-and-digest parasympathetic side, along with salivation, peristalsis, urination, and defecation. The sympathetic side suppresses digestion during fight or flight."},{"cat":"Autonomic","stem":"Which term is synonymous with sympathomimetic?","roman":null,"opts":["Cholinergic","Adrenergic","Antiadrenergic","Anticholinergic"],"ans":1,"why":"Sympathomimetic and adrenergic both describe an agent that copies the sympathetic system. Cholinergic is the parasympathomimetic synonym, and the two anti- terms describe blockers."},{"cat":"Autonomic","stem":"Which term is synonymous with parasympathomimetic?","roman":null,"opts":["Cholinergic","Adrenergic","Antiadrenergic","Antihistaminic"],"ans":0,"why":"Parasympathomimetic and cholinergic both describe an agent that copies acetylcholine's effects. Adrenergic is the sympathomimetic synonym."},{"cat":"Autonomic","stem":"Which term is synonymous with parasympatholytic?","roman":null,"opts":["Cholinergic","Adrenergic","Anticholinergic","Antiadrenergic"],"ans":2,"why":"Parasympatholytic and anticholinergic both describe a drug that blocks acetylcholine at muscarinic receptors. Ipratropium and tiotropium belong to this group."},{"cat":"Autonomic","stem":"Which term is synonymous with sympatholytic?","roman":null,"opts":["Cholinergic","Adrenergic","Anticholinergic","Antiadrenergic"],"ans":3,"why":"Sympatholytic and antiadrenergic both describe a drug that blocks the sympathetic system. Beta blockers belong here, which is why they can trigger bronchospasm in asthma."},{"cat":"Autonomic","stem":"Bronchodilation can be achieved with which types of agent?","roman":["Parasympatholytic","Sympatholytic","Sympathomimetic","Parasympathomimetic"],"opts":["I and II only","II, III, and IV","III only","I and III only"],"ans":3,"why":"A parasympatholytic blocks the constricting signal and a sympathomimetic stimulates beta-2 receptors, so both open the airway. A sympatholytic and a parasympathomimetic both push toward constriction."},{"cat":"Autonomic","stem":"Skeletal muscle is found in which of the following?","roman":null,"opts":["Blood vessels","Airways","The heart","The diaphragm"],"ans":3,"why":"The diaphragm is skeletal muscle, which is why beta-2 stimulation causes tremor there and why theophylline can strengthen it. Blood vessels and airways contain smooth muscle, and the heart is cardiac muscle."},{"cat":"Clinical scenario","stem":"A patient recovering from an asthma exacerbation says his oral medication looks different from the white pill he takes at home. Which could explain this?","roman":null,"opts":["A different manufacturer","A medication error","A change in the dose","All of the above"],"ans":3,"why":"A different manufacturer, a genuine drug error, patient confusion, and a dose change can all alter a pill's appearance. Always double-check the original order when a patient gives an unexpected response."},{"cat":"Pharmacokinetics","stem":"After a drug is absorbed, which factors affect its distribution?","roman":null,"opts":["Protein binding","Fat solubility","Water solubility","All of the above"],"ans":3,"why":"Distribution depends on blood flow, fat and water solubility, and protein binding. Bound drug is inactive, and fat-soluble drugs concentrate where there is more fat."},{"cat":"Pharmacokinetics","stem":"Why does the half-life of a drug matter clinically?","roman":null,"opts":["It predicts the site of drug action","It guides dosing frequency and interval","It determines the brand name","It sets the route of administration"],"ans":1,"why":"Half-life measures how quickly a drug leaves the body, so it drives how often a dose must be repeated to hold a steady concentration. It also predicts how long effects persist after the drug is stopped."},{"cat":"Routes","stem":"A home care patient has severe nausea and cannot keep anything down. Which route would you recommend?","roman":null,"opts":["Oral tablet","Rectal suppository","Sublingual tablet","Oral elixir"],"ans":1,"why":"Rectal administration works when a patient is vomiting, NPO, or unable to swallow. All three other choices still require the patient to take and retain something by mouth."},{"cat":"Routes","stem":"A patient has a chronic inflammatory airway disease requiring corticosteroids, and systemic side effects are a concern. The preferred route is:","roman":null,"opts":["Oral tablets","Inhalation","Intramuscular injection","Rectal suppository"],"ans":1,"why":"Inhalation delivers the drug directly to the lung, so far less reaches the circulation and systemic side effects are reduced. This is exactly why inhaled corticosteroids replaced oral steroids for maintenance."},{"cat":"Routes","stem":"A busy executive needs nicotine replacement therapy and often forgets doses. The best route is:","roman":null,"opts":["Transdermal patch","Oral capsule","Sublingual tablet","Intramuscular injection"],"ans":0,"why":"A patch releases drug slowly for sustained levels all day with no doses to remember, which is why it suits a patient whose schedule works against compliance."},{"cat":"Routes","stem":"Which route would you select when a rapid onset is needed for a hospital emergency?","roman":null,"opts":["Oral","Transdermal","Intravenous","Rectal"],"ans":2,"why":"Intravenous administration puts drug straight into the bloodstream with no absorption step, giving the fastest possible onset. Every other route requires absorption first."},{"cat":"Drug reference","stem":"You need the FDA-required contraindications and adverse reactions for a drug, plus a photograph of the tablet. The best source is:","roman":null,"opts":["The Physicians' Desk Reference","A nursing care plan","The hospital formulary","A pharmacology lecture"],"ans":0,"why":"The PDR carries official FDA product information: drug names, clinical pharmacology, indications, contraindications, interactions, adverse reactions, dosage, and photographs of specific formulations."},{"cat":"Drug reference","stem":"At the bedside you need a drug detail quickly on a mobile device. Which resources are designed for that?","roman":["LexiDrugs","ePocrates","mobile-MICROMEDEX"],"opts":["I and II only","I, II, and III","II and III only","None of these"],"ans":1,"why":"LexiDrugs, ePocrates, and mobile-MICROMEDEX are point-of-care electronic references built for rapid lookup. The PDR is the comprehensive printed reference, better suited to detailed review than bedside speed."},{"cat":"Drug reference","stem":"You want to know whether a particular drug is stocked and available at your hospital. You should check the:","roman":null,"opts":["PDR","Formulary","Package insert","Standing orders"],"ans":1,"why":"A formulary lists the drugs available within a particular healthcare system. Protocols and standing orders tell you how a condition is treated, and the PDR gives product information regardless of local stock."},{"cat":"Drug reference","stem":"Where would you look to find a drug's protein-binding percentage?","roman":null,"opts":["The hospital formulary listing","The Physicians' Desk Reference","The unit standing orders","The patient's medical chart"],"ans":1,"why":"The PDR includes protein-binding percentages, which matter because displacement from plasma proteins is a common mechanism of drug interaction."},{"cat":"Routes","stem":"Compared with injection, the oral route's chief drawback is that:","roman":null,"opts":["Production costs are much higher","Part of the dose is lost in the liver","It cannot be self-administered","Sterile technique is required"],"ans":1,"why":"Oral drugs pass through the liver before reaching circulation, so a portion is inactivated and the dose must be higher. Oral is otherwise the most convenient and economical route."},{"cat":"Routes","stem":"Which is a DISADVANTAGE of the intramuscular route?","roman":null,"opts":["Absorption is always far too slow","Once injected it cannot be retrieved","It bypasses the liver entirely","Suspensions cannot be given this way"],"ans":1,"why":"Once an IM injection is given it stays in, even if side effects develop. Parenteral routes also carry risks of infection, pain, and local irritation."},{"cat":"Routes","stem":"The main advantage of the inhalation route for respiratory drugs is:","roman":null,"opts":["It requires no patient coordination","Fewer systemic side effects","It guarantees a precise dose","It works in unconscious patients"],"ans":1,"why":"Delivering drug straight to the lung means less reaches the circulation, so systemic effects are reduced. The tradeoff is that inhalation requires patient coordination."},{"cat":"Routes","stem":"Which statement describes a disadvantage of the sublingual route?","roman":null,"opts":["It is slow in onset","It depends on adequate salivary flow","It undergoes heavy first-pass loss","It requires a sterile needle"],"ans":1,"why":"A sublingual tablet needs good salivary flow to dissolve and be absorbed. Its advantage is the quick onset from the rich vasculature under the tongue, and it largely avoids first-pass metabolism."},{"cat":"Routes","stem":"Transdermal delivery improves compliance primarily because:","roman":null,"opts":["Onset is rapid in an emergency","Dosing is far less frequent","Side effects are eliminated","Control is minute to minute"],"ans":1,"why":"A patch releases drug slowly for sustained levels, so dosing is less frequent and easier to remember. Onset is slow, which makes it unsuitable for emergencies."},{"cat":"Routes","stem":"A medication delivered through an NG tube carries which practical risk?","roman":null,"opts":["The drug will avoid the liver","The tube may clog or degrade it","Absorption becomes immediate","Only sterile drugs may be used"],"ans":1,"why":"Drug stability and clogging of the tube are the practical concerns, and compatibility with feeds must be considered. Being enteral, the drug is still subject to first-pass metabolism."},{"cat":"Pharmacokinetics","stem":"Why might an elderly patient and a young adult require different doses of the same drug?","roman":null,"opts":["Receptors disappear with age","Fat and water compartments change with age","The liver stops working after 65","Drugs are not absorbed in the elderly"],"ans":1,"why":"Body fat and water compartments shift with age, which changes the volume of distribution. A fat-soluble drug behaves differently in a patient with more fat than in a lean one."},{"cat":"Pharmacokinetics","stem":"A patient is given a standard dose but has no therapeutic response and no toxicity. One possible explanation is that the patient:","roman":null,"opts":["Genetically lacks the enzyme for it","Has a known allergy to the drug","Took it with a full glass of water","Received it by the ordered route"],"ans":0,"why":"Some patients genetically lack the enzymes needed to metabolize or activate certain drugs. There is no easy way to predict this, and liver function tests will not reveal it."},{"cat":"Pharmacokinetics","stem":"Two patients receive identical doses of a water-soluble drug. The one with the larger water compartment will most likely show:","roman":null,"opts":["A greater drug effect","A smaller drug effect","No effect at all","Immediate toxicity"],"ans":0,"why":"Water-soluble drugs have an increased effect in patients with larger water compartments, just as fat-soluble drugs have more effect in patients with more body fat."},{"cat":"Pharmacokinetics","stem":"A patient in renal failure is given a drug eliminated unchanged in the urine. Compared with a healthy patient, the drug will:","roman":null,"opts":["Be cleared faster","Remain in the system longer","Never reach the circulation","Bind more plasma protein"],"ans":1,"why":"Impaired renal function prolongs the effects of drugs cleared by the kidneys, because they are not readily eliminated and accumulate. Dose or interval usually needs adjustment."},{"cat":"Drug responsiveness","stem":"A patient who drinks alcohol heavily tolerates its effects better than a non-drinker. This is explained by:","roman":null,"opts":["Enzyme induction speeding metabolism","Enzyme inhibition slowing metabolism","Reduced gastric absorption","Increased protein binding"],"ans":0,"why":"Repeated exposure induces the cytochrome P450 enzymes, so alcohol is metabolized more quickly. Enzyme induction and inhibition are a common mechanism behind altered drug response."},{"cat":"Drug responsiveness","stem":"Which patient factor would most likely INCREASE the free, active fraction of a highly protein-bound drug?","roman":null,"opts":["High serum albumin","Low serum albumin","Increased body fat","Increased muscle mass"],"ans":1,"why":"Low albumin leaves fewer binding sites, so more drug circulates free and active. Malnourished patients may therefore show an exaggerated response to a standard dose."},{"cat":"Drug responsiveness","stem":"A patient stabilized on a drug is started on a second drug that inhibits the same P450 enzymes. You should expect the first drug to:","roman":null,"opts":["Be cleared more rapidly","Accumulate toward toxicity","Stop being absorbed","Lose all activity"],"ans":1,"why":"Enzyme inhibition slows clearance, so the first drug builds up and can reach toxic levels. Induction does the opposite and can render a drug ineffective."},{"cat":"Drug responsiveness","stem":"Which of the following would alter a patient's response to an inhaled bronchodilator?","roman":["Poor inhaler technique","Beta-receptor desensitization","Concurrent beta blocker therapy","The degree of existing bronchial tone"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"All four change the response. Poor inhaler technique wastes the dose, receptor desensitization blunts it, concurrent beta blockers oppose it, and the degree of underlying bronchial tone determines how much there is to reverse."},{"cat":"Drug responsiveness","stem":"A patient's inhaler seems less effective than it was a month ago. Before changing the drug you should first:","roman":null,"opts":["Double the prescribed dose","Check the inhaler technique","Add a second bronchodilator","Switch to intravenous therapy"],"ans":1,"why":"Poor technique is the commonest reason an inhaled drug underperforms. Verify technique and adherence before assuming the medication has failed."},{"cat":"Concept","stem":"What is the relationship between bronchospasm and bronchoconstriction?","roman":null,"opts":["They are interchangeable terms","Bronchospasm is one cause of the other","Bronchoconstriction causes bronchospasm","The two are unrelated processes"],"ans":1,"why":"Bronchoconstriction is the broad term for a narrowed airway, and it has three causes: bronchospasm, edema, and secretions. Bronchospasm is specifically smooth muscle contraction."},{"cat":"Concept","stem":"A patient has significant bronchoconstriction but receives little benefit from albuterol. The most likely explanation is that the narrowing is caused by:","roman":null,"opts":["Smooth muscle spasm","Edema or retained secretions","Beta-2 receptor excess","Low airway resistance"],"ans":1,"why":"Bronchodilators only relieve smooth muscle spasm. If the narrowing comes from mucosal swelling or retained secretions, the drug has nothing to relax and the patient will not improve."},{"cat":"Concept","stem":"Which term specifically describes contraction of the smooth muscle in the bronchial wall?","roman":null,"opts":["Bronchoconstriction","Bronchospasm","Bronchiectasis","Atelectasis"],"ans":1,"why":"Bronchospasm is the specific muscular event. Bronchoconstriction is the umbrella term for any narrowing, whatever the mechanism."},{"cat":"Safety","stem":"A long-acting beta-2 agonist used without an inhaled corticosteroid in a patient with asthma is:","roman":null,"opts":["Preferred first-line therapy","Contraindicated","Recommended for children","The standard rescue option"],"ans":1,"why":"LABA monotherapy in asthma is contraindicated because it raises the risk of serious asthma-related events, including death. In asthma a LABA is always paired with an inhaled corticosteroid."},{"cat":"Safety","stem":"Which is a contraindication to ipratropium rather than a caution?","roman":null,"opts":["Benign prostatic hyperplasia","Hypersensitivity to atropine","Narrow-angle glaucoma","Advanced patient age"],"ans":1,"why":"Known hypersensitivity to atropine or its derivatives is a true contraindication. Glaucoma and prostatic hyperplasia are cautions that call for monitoring, not absolute bars to use."},{"cat":"Safety","stem":"A patient reports a severe milk protein allergy. Which device would concern you most?","roman":null,"opts":["A soft mist inhaler device","A lactose-based dry powder inhaler","A jet nebulizer treatment","An HFA metered dose inhaler"],"ans":1,"why":"Many dry powder inhalers use a lactose carrier that can contain milk protein, so severe milk allergy is a contraindication for those products. Nebulizer solutions and HFA inhalers do not carry it."},{"cat":"Safety","stem":"Zileuton is contraindicated in patients with:","roman":null,"opts":["Active liver disease","Mild seasonal allergies","Controlled hypertension","A history of smoking"],"ans":0,"why":"Zileuton carries a risk of hepatotoxicity and is contraindicated in active liver disease. ALT monitoring is required at baseline, monthly for three months, then periodically."},{"cat":"Safety","stem":"Biologics such as dupilumab and mepolizumab must never be given:","roman":null,"opts":["With an inhaled corticosteroid","During an acute exacerbation","On a four-week schedule","By subcutaneous injection"],"ans":1,"why":"Biologics are add-on maintenance only and are never used during an acute asthma or COPD exacerbation. Patients continue all their other medications at the same doses."},{"cat":"Safety","stem":"Which drug combination should specifically be avoided?","roman":null,"opts":["Albuterol with ipratropium bromide","Two long-acting beta agonists","Budesonide with formoterol","Albuterol with acetylcysteine"],"ans":1,"why":"Never use two long-acting beta agonists together, since overdose and additive cardiac effects result. The other three pairings are standard or documented as compatible."},{"cat":"Clinical scenario","stem":"An adult in the emergency department needs nebulized albuterol for acute bronchospasm. The standard single dose and interval is:","roman":null,"opts":["0.5 mg every 12 hours","2.5 mg every 4 to 6 hours","20 mcg every 12 hours","300 mg once monthly"],"ans":1,"why":"Nebulized albuterol for an adult is 2.5 mg in 3 mL, repeated every 4 to 6 hours as needed. In an acute exacerbation it may be given every 20 minutes for three doses."},{"cat":"Clinical scenario","stem":"A COPD patient is to receive nebulized ipratropium. The usual adult dose and frequency is:","roman":null,"opts":["0.5 mg every 6 to 8 hours","2.5 mg every 4 hours","15 mcg every 12 hours","62.5 mcg once daily"],"ans":0,"why":"Nebulized ipratropium is 0.5 mg in 2.5 mL, given every 6 to 8 hours. In acute care it may be repeated every 20 minutes for three doses alongside a beta agonist."},{"cat":"Clinical scenario","stem":"Nebulized formoterol for COPD maintenance is dosed at:","roman":null,"opts":["20 mcg every 12 hours","20 mcg every 4 hours","100 mcg once daily","2.5 mg every 6 hours"],"ans":0,"why":"One 20 mcg unit-dose vial is nebulized every 12 hours, and the total daily dose should not exceed 40 mcg. It is a maintenance drug, never a rescue treatment."},{"cat":"Clinical scenario","stem":"Arformoterol for COPD maintenance is given as:","roman":null,"opts":["15 mcg twice daily by nebulizer","15 mg twice daily by nebulizer","15 mcg once daily by inhaler","150 mcg every 4 hours"],"ans":0,"why":"Arformoterol is 15 mcg nebulized twice daily, morning and evening. Note the units carefully, since mcg and mg are a thousandfold apart."},{"cat":"Clinical scenario","stem":"Tiotropium by HandiHaler for COPD maintenance is dosed at:","roman":null,"opts":["18 mcg once daily","18 mg once daily","18 mcg four times daily","180 mcg twice daily"],"ans":0,"why":"One 18 mcg capsule is inhaled once daily. The capsule is pierced by the device and the powder inhaled; it must never be swallowed."},{"cat":"Clinical scenario","stem":"Which regimen correctly describes aclidinium for COPD?","roman":null,"opts":["400 mcg twice daily by dry powder","400 mcg once daily by nebulizer","40 mcg four times daily by MDI","4 mg twice daily by mouth"],"ans":0,"why":"Aclidinium is 400 mcg per actuation from the Pressair, a multidose dry powder inhaler, given twice daily. It is the twice-daily LAMA, unlike tiotropium and umeclidinium."},{"cat":"Clinical scenario","stem":"A patient needs a once-daily maintenance bronchodilator delivered as a slow-moving mist. Which drug and regimen fits?","roman":null,"opts":["Olodaterol, 2 puffs once daily","Albuterol, 2 puffs every 4 hours","Salmeterol, 1 inhalation twice daily","Ipratropium, 2 puffs four times daily"],"ans":0,"why":"Olodaterol comes as the Striverdi Respimat soft mist inhaler, 2 puffs totaling 5 mcg once daily. The slower aerosol velocity improves deposition and reduces impaction in the mouth."},{"cat":"Clinical scenario","stem":"A patient with severe dyspnea in the emergency department cannot coordinate an inhaler. For albuterol, you should recommend:","roman":null,"opts":["2 puffs by MDI without a spacer","2.5 mg by small-volume nebulizer","A dry powder inhaler","An oral extended-release tablet"],"ans":1,"why":"A nebulizer needs only tidal breathing, so it works when a patient cannot coordinate. An MDI with a spacer would be the alternative, but a plain MDI or a DPI both demand technique this patient cannot manage."},{"cat":"Clinical scenario","stem":"An asthma patient controlled on an inhaled corticosteroid still wakes at night. Which addition is appropriate, and how is it dosed?","roman":null,"opts":["Salmeterol, 1 inhalation every 12 hours","Albuterol, 2 puffs every 4 hours","Theophylline, titrated to 30 mcg/mL","Racemic epinephrine every 4 hours"],"ans":0,"why":"A LABA added to an existing inhaled corticosteroid is the right step for nocturnal symptoms, and salmeterol is dosed as one 50 mcg inhalation every 12 hours. A theophylline level of 30 would be toxic."},{"cat":"Clinical scenario","stem":"A COPD patient needs both bronchodilator classes by nebulizer in one treatment. The appropriate order is:","roman":null,"opts":["DuoNeb, 3 mL every 6 hours","Albuterol and ipratropium in separate rooms","Spiriva by nebulizer every 6 hours","Advair by nebulizer twice daily"],"ans":0,"why":"DuoNeb delivers ipratropium 0.5 mg with albuterol 3 mg in one 3 mL vial, given every 6 hours. Spiriva and Advair are not nebulizer products at all."},{"cat":"Brand names","stem":"Ventolin and ProAir are brand names for:","roman":null,"opts":["Levalbuterol","Albuterol","Terbutaline","Metaproterenol"],"ans":1,"why":"Ventolin, ProAir, and Proventil are all albuterol. Xopenex is levalbuterol, Brethine is terbutaline, and Alupent was metaproterenol."},{"cat":"Brand names","stem":"Serevent is the brand name for:","roman":null,"opts":["Formoterol","Salmeterol","Arformoterol","Indacaterol"],"ans":1,"why":"Serevent is salmeterol, a long-acting beta agonist with a slow onset, supplied as the Diskus dry powder inhaler."},{"cat":"Brand names","stem":"Brovana is the brand name for:","roman":null,"opts":["Formoterol","Arformoterol","Olodaterol","Salmeterol"],"ans":1,"why":"Brovana is arformoterol, the nebulized LABA dosed 15 mcg twice daily for COPD maintenance. Perforomist is the nebulized formoterol."},{"cat":"Brand names","stem":"Striverdi Respimat delivers which drug?","roman":null,"opts":["Indacaterol","Olodaterol","Vilanterol","Salmeterol"],"ans":1,"why":"Striverdi Respimat is olodaterol, a once-daily ultra-LABA given as 2 puffs from a soft mist inhaler. Arcapta Neohaler is indacaterol."},{"cat":"Brand names","stem":"Spiriva HandiHaler contains which drug?","roman":null,"opts":["Ipratropium","Tiotropium","Glycopyrrolate","Aclidinium"],"ans":1,"why":"Spiriva is tiotropium, 18 mcg per capsule once daily by HandiHaler, or 2 puffs daily from the Respimat."},{"cat":"Brand names","stem":"Incruse Ellipta is the brand name for:","roman":null,"opts":["Aclidinium","Umeclidinium","Tiotropium","Vilanterol"],"ans":1,"why":"Incruse Ellipta is umeclidinium, 62.5 mcg once daily. Anoro Ellipta adds vilanterol to the same drug."},{"cat":"Brand names","stem":"Tudorza Pressair delivers which drug?","roman":null,"opts":["Umeclidinium","Aclidinium","Tiotropium","Ipratropium"],"ans":1,"why":"Tudorza Pressair is aclidinium, 400 mcg twice daily. It is the only twice-daily LAMA, which is its distinguishing feature."},{"cat":"Brand names","stem":"Theo-24, Theochron, and Elixophyllin are all brands of:","roman":null,"opts":["Aminophylline","Theophylline","Caffeine citrate","Montelukast"],"ans":1,"why":"All three are oral theophylline preparations. Aminophylline is the intravenous salt form and Cafcit is caffeine citrate."},{"cat":"Brand names","stem":"Cafcit is the brand name for:","roman":null,"opts":["Theophylline","Caffeine citrate","Aminophylline","Doxapram"],"ans":1,"why":"Cafcit is caffeine citrate, used for apnea of prematurity in neonates at a loading dose of 20 mg/kg followed by 5 to 10 mg/kg daily."},{"cat":"Brand names","stem":"Singulair is the brand name for:","roman":null,"opts":["Zafirlukast","Montelukast","Zileuton","Cromolyn sodium"],"ans":1,"why":"Singulair is montelukast, taken once daily in the evening. It carries a boxed warning for serious neuropsychiatric events."},{"cat":"Brand names","stem":"Accolate and Zyflo are brands for which two drugs, respectively?","roman":null,"opts":["Montelukast and cromolyn","Zafirlukast and zileuton","Zileuton and zafirlukast","Cromolyn and montelukast"],"ans":1,"why":"Accolate is zafirlukast, a receptor blocker taken on an empty stomach. Zyflo is zileuton, the 5-lipoxygenase inhibitor requiring liver enzyme monitoring."},{"cat":"Brand names","stem":"Pulmicort is the brand name for:","roman":null,"opts":["Fluticasone","Budesonide","Beclomethasone","Flunisolide"],"ans":1,"why":"Pulmicort is budesonide, available as Respules for nebulization and as the Flexhaler dry powder inhaler."},{"cat":"Brand names","stem":"QVAR RediHaler contains which inhaled corticosteroid?","roman":null,"opts":["Budesonide","Beclomethasone","Fluticasone","Mometasone"],"ans":1,"why":"QVAR is beclomethasone dipropionate, a breath-actuated inhaler delivering extra-fine particles. It is used without a spacer."},{"cat":"Brand names","stem":"Flovent and Flonase both contain:","roman":null,"opts":["Budesonide","Fluticasone","Triamcinolone","Beclomethasone"],"ans":1,"why":"Both contain fluticasone. Flovent is the inhaled asthma product and Flonase is the nasal spray for allergic rhinitis."},{"cat":"Brand names","stem":"Solu-Medrol is the brand name for:","roman":null,"opts":["Prednisone","Methylprednisolone","Dexamethasone","Triamcinolone"],"ans":1,"why":"Solu-Medrol is intravenous methylprednisolone, dosed 40 to 60 mg daily for an asthma or COPD exacerbation. Deltasone is oral prednisone."},{"cat":"Brand names","stem":"Pulmozyme is the brand name for:","roman":null,"opts":["Acetylcysteine","Dornase alfa","Aztreonam","Tobramycin"],"ans":1,"why":"Pulmozyme is dornase alfa, 2.5 mg nebulized once daily for cystic fibrosis. It must never be diluted or mixed with other drugs."},{"cat":"Brand names","stem":"Mucomyst is the brand name for:","roman":null,"opts":["Dornase alfa","Acetylcysteine","Hypertonic saline","Cromolyn sodium"],"ans":1,"why":"Mucomyst is acetylcysteine, the mucolytic that breaks disulfide bonds. It has a strong sulfur odor and can trigger bronchospasm."},{"cat":"Brand names","stem":"Which brand name is matched with the correct biologic?","roman":null,"opts":["Xolair is mepolizumab","Dupixent is dupilumab","Nucala is omalizumab","Dupixent is omalizumab"],"ans":1,"why":"Dupixent is dupilumab, which blocks IL-4 and IL-13. Xolair is omalizumab, the anti-IgE agent, and Nucala is mepolizumab, the anti-IL-5 agent."},{"cat":"Brand names","stem":"TOBI and Cayston are inhaled antibiotics containing:","roman":null,"opts":["Gentamicin and colistin","Tobramycin and aztreonam","Aztreonam and tobramycin","Colistin and gentamicin"],"ans":1,"why":"TOBI is tobramycin and Cayston is aztreonam. Both treat Pseudomonas in cystic fibrosis on a 28-day on, 28-day off schedule."},{"cat":"Brand names","stem":"NebuPent and Virazole are used for which infections, respectively?","roman":null,"opts":["RSV and Pneumocystis","Pneumocystis and RSV","Pseudomonas and RSV","Pneumocystis and influenza"],"ans":1,"why":"NebuPent is pentamidine for Pneumocystis prophylaxis, given through a Respirgard II. Virazole is ribavirin for severe RSV, given by SPAG-2."},{"cat":"Brand names","stem":"Intal was the brand name for which prophylactic agent?","roman":null,"opts":["Montelukast","Cromolyn sodium","Zileuton","Beclomethasone"],"ans":1,"why":"Intal was cromolyn sodium, a mast cell stabilizer that prevents rather than treats bronchospasm. It must be taken regularly and is never a rescue drug."},{"cat":"Brand names","stem":"Which brand name would you expect on a prescription for formoterol by nebulizer?","roman":null,"opts":["Foradil","Perforomist","Brovana","Serevent"],"ans":1,"why":"Perforomist is the nebulized formoterol, 20 mcg every 12 hours for COPD. Foradil is the dry powder capsule form and Brovana is arformoterol."},{"cat":"Brand names","stem":"A patient is prescribed vilanterol with umeclidinium. The product is:","roman":null,"opts":["Incruse Ellipta","Anoro Ellipta","Breo Ellipta","Trelegy Ellipta"],"ans":1,"why":"Anoro Ellipta pairs the LABA vilanterol with the LAMA umeclidinium once daily. Incruse is umeclidinium alone and Trelegy adds an inhaled corticosteroid."},{"cat":"Brand names","stem":"Which product contains budesonide and formoterol together?","roman":null,"opts":["Advair","Symbicort","Dulera","Anoro"],"ans":1,"why":"Symbicort is budesonide with formoterol. Advair is fluticasone with salmeterol, Dulera is mometasone with formoterol, and Anoro is a dual bronchodilator."},{"cat":"Brand names","stem":"Which product contains mometasone and formoterol?","roman":null,"opts":["Symbicort","Dulera","Advair","Breo"],"ans":1,"why":"Dulera is mometasone with formoterol, supplied as 100/5 or 200/5 mcg per actuation and dosed 2 puffs twice daily."},{"cat":"Brand names","stem":"A nebulizer order reads DuoNeb. The patient will receive:","roman":null,"opts":["Albuterol alone","Ipratropium and albuterol","Budesonide and formoterol","Ipratropium alone"],"ans":1,"why":"DuoNeb contains ipratropium 0.5 mg with albuterol 3 mg in one 3 mL vial. Combivent Respimat delivers the same pairing as a soft mist."},{"cat":"Brand names","stem":"Which brand and generic pairings are correct?","roman":["Serevent is salmeterol","Spiriva is tiotropium","Xopenex is levalbuterol","Pulmicort is budesonide"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"All four are correct. Memorizing these pairings is worth the effort, because orders and charting switch between brand and generic without warning."},{"cat":"Brand names","stem":"Which pairings are INCORRECT?","roman":["Brovana is arformoterol","Atrovent is tiotropium","Advair is budesonide and formoterol","Singulair is montelukast"],"opts":["I and II only","II and III only","I, III, and IV","III and IV only"],"ans":1,"why":"Atrovent is ipratropium, not tiotropium, and Advair is fluticasone with salmeterol, not budesonide with formoterol. Brovana is arformoterol and Singulair is montelukast, both correct."},{"cat":"Brand names","stem":"Which brands are all long-acting muscarinic antagonists?","roman":["Spiriva","Incruse Ellipta","Tudorza Pressair","Atrovent"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":1,"why":"Spiriva, Incruse, and Tudorza are all LAMAs. Atrovent is ipratropium, which is short acting at 4 to 6 hours per dose."},{"cat":"Clinical scenario","stem":"A 6-year-old with asthma is prescribed a LABA. Before giving it you should confirm that:","roman":null,"opts":["The dose is halved for children","It is a steroid combination product","It is given four times daily","A spacer is used with the device"],"ans":1,"why":"Children must receive a LABA only as a combination product containing an inhaled corticosteroid, which eliminates any possibility of accidental monotherapy."},{"cat":"Clinical scenario","stem":"A ventilated patient needs albuterol. Which delivery method is appropriate?","roman":null,"opts":["Remove the patient from the ventilator first","An in-line nebulizer or MDI with adapter","A dry powder inhaler through the circuit","Oral syrup through the NG tube"],"ans":1,"why":"Bronchodilators are delivered in-line through the ventilator circuit using a nebulizer or an MDI with a spacer adapter. Disconnecting the patient risks derecruitment and hypoxemia."},{"cat":"Clinical scenario","stem":"A patient needs sputum induced for a diagnostic specimen. Which agent is appropriate?","roman":null,"opts":["Normal saline 0.9%","Hypertonic saline 3 to 5%","Sterile water alone","Dornase alfa"],"ans":1,"why":"Hypertonic saline draws water into the airway and provokes a productive cough, which is what induces the specimen. Pretreat with a bronchodilator, since it can cause bronchospasm."},{"cat":"Clinical scenario","stem":"A patient with exercise-induced bronchospasm asks when to use her albuterol inhaler. You advise:","roman":null,"opts":["Only after symptoms begin","About 15 minutes before exercise","Every morning regardless","Only on rest days"],"ans":1,"why":"A short-acting beta agonist taken shortly before exercise prevents the bronchospasm. Albuterol's onset is 5 to 15 minutes, so timing it just before activity gives protection through the session."},{"cat":"Clinical scenario","stem":"A CF patient is ordered dornase alfa and tobramycin. Regarding mixing them, you should:","roman":null,"opts":["Combine them to save time","Give them separately, never mixed","Mix only if both are refrigerated","Dilute both in sterile water"],"ans":1,"why":"Dornase alfa must never be diluted or mixed with another drug in the nebulizer. Give the bronchodilator first, then dornase alfa and airway clearance, with the antibiotic afterward."},{"cat":"Clinical scenario","stem":"A patient on chronic prednisone is being transitioned to an inhaled corticosteroid. The oral steroid should be:","roman":null,"opts":["Stopped abruptly on day one","Tapered gradually under supervision","Doubled during the transition","Continued indefinitely at full dose"],"ans":1,"why":"Abrupt withdrawal risks adrenal insufficiency, since chronic systemic steroids suppress the adrenal axis. The taper is supervised while the inhaled agent takes over."},{"cat":"Clinical scenario","stem":"A patient taking montelukast reports new agitation and trouble sleeping. You should:","roman":null,"opts":["Reassure him that this is expected","Report it; the drug has a boxed warning","Tell him to double the dose","Advise taking it in the morning instead"],"ans":1,"why":"Montelukast carries a boxed warning for serious neuropsychiatric events, including agitation, sleep disturbance, depression, and suicidal thinking. New mood or behavior changes must be reported."},{"cat":"Clinical scenario","stem":"A patient on zafirlukast takes it with a large breakfast each morning. You should advise that it be taken:","roman":null,"opts":["With a larger meal","On an empty stomach","With an antacid","Only at bedtime"],"ans":1,"why":"Food reduces zafirlukast absorption, so it is taken one hour before or two hours after a meal. Montelukast has no such restriction."},{"cat":"Clinical scenario","stem":"A nurse asks why a COPD patient receives both Spiriva and albuterol. Your best explanation is:","roman":null,"opts":["The drugs are duplicates in error","One is daily maintenance, one is rescue","Spiriva replaces the rescue inhaler","Albuterol prevents Spiriva side effects"],"ans":1,"why":"Spiriva is a once-daily maintenance LAMA and albuterol is the short-acting rescue drug. Both are appropriate together, since they serve different purposes."},{"cat":"Clinical scenario","stem":"An asthmatic patient is prescribed a nonselective beta blocker by her cardiologist. The appropriate action is:","roman":null,"opts":["Give it without any comment","Alert the prescriber to the asthma","Double her albuterol dose","Stop her inhaled corticosteroid"],"ans":1,"why":"A nonselective beta blocker opposes beta-2 stimulation and can provoke bronchospasm in asthma. The prescriber needs to know so a cardioselective agent or alternative can be considered."},{"cat":"Clinical scenario","stem":"A patient receiving an inhaled corticosteroid by nebulizer with a face mask should also be taught to:","roman":null,"opts":["Hold the breath for 30 seconds","Rinse the mouth and wash the face","Lie flat during treatment","Avoid drinking water afterward"],"ans":1,"why":"Rinsing the mouth prevents thrush and hoarseness, and washing the face removes drug deposited by the mask, which can irritate the skin around the mouth and eyes."},{"cat":"Clinical scenario","stem":"A patient's theophylline level returns at 8 mcg/mL and he reports good symptom control with no side effects. You should recommend:","roman":null,"opts":["Increasing the dose immediately","Continuing the current dose","Stopping the drug entirely","Switching to intravenous therapy"],"ans":1,"why":"A level of 8 sits comfortably in the 5 to 15 therapeutic range, and the patient is doing well with no toxicity. There is no reason to change a regimen that is working."},{"cat":"Clinical scenario","stem":"A patient using Advair Diskus asks whether she should shake it before each dose. You explain that:","roman":null,"opts":["She should shake it vigorously","Dry powder devices are not shaken","She should shake it once weekly","Shaking replaces priming"],"ans":1,"why":"A Diskus is a dry powder inhaler, so there is nothing to shake or prime. She should also avoid exhaling into the device, since moisture clumps the powder."},{"cat":"Clinical scenario","stem":"An older patient cannot manage an MDI even with coaching, and her inspiratory flow is weak. The best alternative is:","roman":null,"opts":["A dry powder inhaler","A small-volume nebulizer","A breath-actuated inhaler","An oral tablet only"],"ans":1,"why":"A nebulizer requires only tidal breathing, so it works when coordination and inspiratory flow are both poor. A DPI and a breath-actuated device each demand an effort she cannot generate."},{"cat":"Clinical scenario","stem":"A patient in status asthmaticus has received three albuterol treatments. The physician asks what to add. You recommend:","roman":null,"opts":["A long-acting beta agonist","Ipratropium and a systemic steroid","Oral theophylline therapy","A biologic injection now"],"ans":1,"why":"Adding ipratropium gives additive bronchodilation by a different mechanism, and a systemic corticosteroid treats the underlying inflammation. LABAs, oral theophylline, and biologics have no role in an acute attack."},{"cat":"Clinical scenario","stem":"A COPD patient admits he stops his Spiriva whenever he feels well. The most useful teaching point is that:","roman":null,"opts":["He is correct to save doses","Maintenance drugs work only if taken daily","He should switch to albuterol only","The drug is addictive if continued"],"ans":1,"why":"A once-daily LAMA keeps the airway open continuously, and the benefit is lost when doses are skipped. Feeling well is the result of taking it, not a reason to stop."},{"cat":"Clinical scenario","stem":"A patient receiving nebulized acetylcysteine begins coughing violently with audible wheezing. You should:","roman":null,"opts":["Continue and reassure the patient","Stop and give a bronchodilator","Increase the nebulizer flow","Add more acetylcysteine"],"ans":1,"why":"Acetylcysteine commonly provokes bronchospasm, which is why a bronchodilator is given beforehand. Stop the treatment, treat the bronchospasm, and have suction ready for the loosened secretions."},{"cat":"Clinical scenario","stem":"A home care patient's albuterol nebulizer solution has turned yellowish. You should advise him to:","roman":null,"opts":["Use it but add saline","Discard it and use a new vial","Warm it before using","Dilute it with sterile water"],"ans":1,"why":"Discoloration signals that the drug has oxidized and lost potency. Discard it, and store vials protected from light and heat."},{"cat":"Clinical scenario","stem":"A patient is prescribed Xolair. Before the first dose you would expect which baseline value to be checked?","roman":null,"opts":["Serum potassium","Serum IgE level","Theophylline level","Arterial blood gas"],"ans":1,"why":"Omalizumab dosing is calculated from baseline serum IgE and body weight, and the IgE must fall within the labeled range. The drug also carries a boxed warning for anaphylaxis."},{"cat":"Clinical scenario","stem":"A patient receiving his first dose of omalizumab should be:","roman":null,"opts":["Discharged immediately after injection","Observed afterward for anaphylaxis","Given a beta blocker first","Told to skip other asthma drugs"],"ans":1,"why":"Omalizumab carries a boxed warning for anaphylaxis, which can be delayed. Patients are observed after dosing and prescribed an epinephrine auto-injector."},{"cat":"Clinical scenario","stem":"A patient asks whether her biologic injection replaces her inhalers. You explain that biologics:","roman":null,"opts":["Replace all inhaled therapy","Are added on top of current drugs","Are used only during attacks","Are taken instead of steroids"],"ans":1,"why":"Biologics are add-on maintenance. Patients continue every other asthma and COPD medication at the same doses, and biologics are never used during an exacerbation."},{"cat":"Clinical scenario","stem":"You are asked to give racemic epinephrine to an adult with post-extubation stridor. The rationale is that the drug:","roman":null,"opts":["Relaxes bronchial smooth muscle only","Constricts vessels to reduce swelling","Thins airway secretions","Blocks muscarinic receptors"],"ans":1,"why":"Post-extubation stridor comes from mucosal swelling, and the alpha effect constricts the vessels to shrink it. Watch for rebound as the effect wears off in 1 to 2 hours."},{"cat":"Clinical scenario","stem":"A patient with a documented peanut and soy allergy needs an inhaled anticholinergic. Regarding Atrovent HFA, you should know that:","roman":null,"opts":["It is absolutely contraindicated","The HFA form has no soy lecithin","It must be given by nebulizer only","The ordered dose should be halved"],"ans":1,"why":"The older CFC inhalers carried a soy lecithin warning, but the HFA formulation does not contain it. Verify the specific product label before administering."},{"cat":"Clinical scenario","stem":"During a 20-minute nebulizer treatment the patient's oxygen saturation falls from 94% to 87%. Your first action is to:","roman":null,"opts":["Finish the treatment quickly","Stop and assess the patient","Increase the nebulizer flow","Chart it and continue"],"ans":1,"why":"A falling saturation during treatment is a deterioration, not a side effect to push through. Stop, assess airway and breathing, apply oxygen as needed, and notify the nurse and physician."},{"cat":"Mechanism","stem":"Which bronchodilator class raises cAMP INDIRECTLY rather than directly?","roman":null,"opts":["Sympathomimetics","Methylxanthines","Anticholinergics","Monoclonal antibodies"],"ans":1,"why":"Methylxanthines block phosphodiesterase, the enzyme that degrades cAMP, so cAMP accumulates without the drug ever touching the beta-2 receptor. Sympathomimetics raise it directly through that receptor."},{"cat":"Mechanism","stem":"Place the steps of beta-2 agonist action in the correct order.","roman":null,"opts":["Receptor binding, adenyl cyclase, cAMP, relaxation","cAMP, receptor binding, adenyl cyclase, relaxation","Adenyl cyclase, relaxation, cAMP, receptor binding","Relaxation, cAMP, adenyl cyclase, receptor binding"],"ans":0,"why":"The agonist binds the beta-2 receptor, a G protein activates adenyl cyclase, cAMP rises, and the smooth muscle relaxes. cAMP then lowers intracellular calcium and blocks the actin-myosin interaction."},{"cat":"Mechanism","stem":"A drug blocks muscarinic receptors in the airway. Its class and effect on cGMP are:","roman":null,"opts":["Sympathomimetic, cGMP rises","Anticholinergic, cGMP falls","Methylxanthine, cGMP rises","Biologic, cGMP unchanged"],"ans":1,"why":"Blocking muscarinic receptors interrupts the parasympathetic constricting signal, which lowers cGMP and allows the airway to open."},{"cat":"Mechanism","stem":"Which of the four classes does NOT relax bronchial smooth muscle directly?","roman":null,"opts":["Sympathomimetics","Anticholinergics","Methylxanthines","Monoclonal antibodies"],"ans":3,"why":"Monoclonal antibodies disrupt inflammatory pathways such as IgE or interleukin signaling. They reduce inflammation over weeks and have no direct effect on smooth muscle, which is why they are useless in an acute attack."},{"cat":"Mechanism","stem":"Theophylline is described as a weak bronchodilator because at usual clinical doses it is:","roman":null,"opts":["Poorly absorbed from the gut wall","A poor phosphodiesterase inhibitor","Unable to reach the lung tissue","Bound entirely to plasma albumin"],"ans":1,"why":"At the doses used in humans theophylline inhibits phosphodiesterase only weakly, so the resulting rise in cAMP is modest. Its benefit comes largely from non-bronchodilating effects such as diaphragm strengthening."},{"cat":"Mechanism","stem":"Why are a beta-2 agonist and an anticholinergic additive when given together?","roman":null,"opts":["They share a single receptor type","They use different pathways and regions","One prevents the other's side effects","They are chemically near identical"],"ans":1,"why":"One raises cAMP through beta-2 receptors concentrated in the small airways, the other lowers cGMP by blocking muscarinic receptors in the central, larger airways. Different mechanisms in different regions mean the effects add."},{"cat":"Mechanism","stem":"Omalizumab achieves its effect by targeting:","roman":null,"opts":["Interleukin-5","Immunoglobulin E","Interleukin-4 and 13","Muscarinic receptors"],"ans":1,"why":"Omalizumab binds free IgE, which blunts the allergic cascade in allergic asthma. Mepolizumab targets IL-5 and dupilumab blocks IL-4 and IL-13 signaling."},{"cat":"Mechanism","stem":"Mepolizumab works by blocking which mediator?","roman":null,"opts":["Immunoglobulin E","Interleukin-5","Interleukin-4","Leukotriene D4"],"ans":1,"why":"Mepolizumab is an anti-IL-5 antibody, so blood and tissue eosinophils fall. That is why it is reserved for the eosinophilic phenotype."},{"cat":"Mechanism","stem":"Dupilumab interrupts signaling by which two interleukins?","roman":null,"opts":["IL-1 and IL-6","IL-4 and IL-13","IL-5 and IL-8","IL-2 and IL-10"],"ans":1,"why":"Dupilumab blocks the IL-4 receptor alpha subunit, which shuts down both IL-4 and IL-13 signaling and so dampens type 2 inflammation."},{"cat":"Mechanism","stem":"Which class is the only one of the four given systemically rather than by aerosol?","roman":null,"opts":["Sympathomimetics","Anticholinergics","Methylxanthines","All are given by aerosol"],"ans":2,"why":"Methylxanthines are given orally or intravenously and are never aerosolized. Biologics are injected, but the four classic bronchodilator methods place the xanthines as the systemic one."},{"cat":"Mechanism","stem":"Match each class to its primary molecular target.","roman":["Sympathomimetic targets the beta-2 receptor","Anticholinergic targets the muscarinic receptor","Methylxanthine targets phosphodiesterase","Biologic targets an inflammatory mediator"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"All four pairings are correct. Knowing the target for each class is the fastest way to predict both the therapeutic effect and the side effect profile."},{"cat":"Mechanism","stem":"A patient's airway opens because the parasympathetic constricting signal has been interrupted. The drug given was most likely:","roman":null,"opts":["Albuterol","Ipratropium","Theophylline","Omalizumab"],"ans":1,"why":"Interrupting the parasympathetic signal is the anticholinergic mechanism, and ipratropium is the short-acting example. Albuterol works through beta-2 stimulation instead."},{"cat":"Mechanism","stem":"Which statement about the biologic class is accurate?","roman":null,"opts":["They produce rapid bronchodilation","They disrupt inflammatory pathways","They block phosphodiesterase","They stimulate beta-2 receptors"],"ans":1,"why":"Biologics are engineered antibodies that disrupt specific inflammatory cascades, typically eosinophilic or IgE mediated. Their benefit builds over weeks, so they are add-on maintenance only."},{"cat":"Mechanism","stem":"Beta-2 receptors that mediate bronchodilation are located primarily on:","roman":null,"opts":["Alveolar capillary membranes","Bronchial smooth muscle","Mucous gland ducts","Pulmonary arterioles"],"ans":1,"why":"Beta-2 receptors sit on bronchial smooth muscle and are concentrated in the small, peripheral airways. Stimulating them raises cAMP and relaxes that muscle."},{"cat":"Mechanism","stem":"Which enzyme must be ACTIVATED for a sympathomimetic to work?","roman":null,"opts":["Phosphodiesterase","Adenyl cyclase","Monoamine oxidase","Catechol-O-methyltransferase"],"ans":1,"why":"Receptor binding activates adenyl cyclase, which manufactures cAMP. Phosphodiesterase does the opposite by degrading cAMP, and MAO and COMT break down catecholamines."},{"cat":"Mechanism","stem":"A drug raises cAMP by preventing its degradation. This describes the action of:","roman":null,"opts":["Albuterol","Ipratropium","Theophylline","Mepolizumab"],"ans":2,"why":"Preventing degradation is phosphodiesterase inhibition, the methylxanthine mechanism. Albuterol increases cAMP production instead, which is a different route to the same messenger."},{"cat":"Classification","stem":"A drug name ends in -terol. Without knowing anything else, you can conclude it is a:","roman":null,"opts":["Beta agonist","Anticholinergic","Methylxanthine","Corticosteroid"],"ans":0,"why":"The -terol suffix marks a beta agonist: albuterol, salmeterol, formoterol, arformoterol, indacaterol, olodaterol, vilanterol. Spotting the suffix gives you the class, mechanism, and side effects at once."},{"cat":"Classification","stem":"A drug name ends in -ium. This suffix identifies it as a:","roman":null,"opts":["Beta agonist","Anticholinergic","Leukotriene modifier","Mucolytic"],"ans":1,"why":"Ipratropium, tiotropium, aclidinium, and umeclidinium all end in -ium, which marks a quaternary ammonium compound. The charge keeps the drug in the lung, which is why systemic effects are minimal."},{"cat":"Anticholinergic","stem":"Atropine lacks the -ium ending that ipratropium has. The clinical consequence is that atropine:","roman":null,"opts":["Works only by injection","Crosses into the brain and tissues","Has no muscarinic activity","Lasts much longer per dose"],"ans":1,"why":"Without the quaternary ammonium charge, atropine is a lipophilic tertiary amine that crosses biologic barriers freely. That single structural difference explains its CNS effects and its drying of secretions."},{"cat":"Autonomic","stem":"Blocking the parasympathetic system opens the airway for the same reason that:","roman":null,"opts":["Blocking the sympathetic system does","Stimulating the sympathetic system does","Stimulating the parasympathetic does","Neither system affects the airway"],"ans":1,"why":"Two negatives make a positive. The parasympathetic closes the airway, so blocking it leaves the airway open, which is the same endpoint as stimulating the sympathetic side."},{"cat":"Autonomic","stem":"A patient shows salivation, lacrimation, urination, and defecation. These effects indicate:","roman":null,"opts":["Anticholinergic stimulation","Cholinergic stimulation","Beta-2 stimulation","Alpha stimulation"],"ans":1,"why":"These are the SLUDGE effects of cholinergic, or parasympathetic, stimulation. Cholinergic makes everything wet; anticholinergic dries everything up."},{"cat":"Anticholinergic","stem":"The phrase can't see, can't pee, can't spit, can't shit summarizes the effects of:","roman":null,"opts":["A cholinergic agent","An anticholinergic agent","A beta-2 agonist","A methylxanthine"],"ans":1,"why":"Blurred vision, urinary retention, dry mouth, and constipation are the classic anticholinergic effects, the exact opposite of the wet SLUDGE picture."},{"cat":"Mechanism","stem":"Which pairing correctly describes how each messenger relates to airway tone?","roman":null,"opts":["cAMP up opens, cGMP down opens","cAMP down opens, cGMP up opens","Both must rise to open","Both must fall to open"],"ans":0,"why":"Raising cAMP relaxes smooth muscle and lowering cGMP removes the constricting signal. Beta agonists and xanthines work on cAMP; anticholinergics work on cGMP."},{"cat":"Classification","stem":"Which group of drugs would all share the -ium suffix?","roman":["Ipratropium","Tiotropium","Umeclidinium","Albuterol"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":1,"why":"Ipratropium, tiotropium, and umeclidinium are all quaternary ammonium anticholinergics. Albuterol ends in -terol, which marks it as a beta agonist."},{"cat":"Clinical scenario","stem":"A 68-year-old with COPD is admitted with increased sputum and dyspnea. He uses albuterol PRN and nothing else. The physician asks for a maintenance recommendation. You suggest:","roman":null,"opts":["A second rescue inhaler","A long-acting bronchodilator daily","Oral theophylline titrated up","A biologic injection monthly"],"ans":1,"why":"A patient on rescue therapy alone needs daily maintenance, and COPD guidelines support a LABA or LAMA. Theophylline is a third-line option and biologics are reserved for an eosinophilic phenotype."},{"cat":"Clinical scenario","stem":"A patient's albuterol MDI has no dose counter and she is unsure how much is left. The best advice is to:","roman":null,"opts":["Float the canister in water","Track doses and replace on schedule","Shake it and listen for liquid","Keep using until it feels empty"],"ans":1,"why":"Floating the canister is unreliable and can clog the valve. Counting doses from the start and replacing on a known schedule is the only dependable method when there is no counter."},{"cat":"Clinical scenario","stem":"An asthmatic teenager uses her rescue inhaler before every soccer practice and twice most nights. Her control is best described as:","roman":null,"opts":["Well controlled","Poorly controlled","Normal for an athlete","Improved from baseline"],"ans":1,"why":"Pre-exercise dosing alone is acceptable, but nighttime use twice most nights signals uncontrolled disease. Nocturnal symptoms are a classic marker that a controller needs to be started or stepped up."},{"cat":"Clinical scenario","stem":"A patient receiving continuous nebulized albuterol for status asthmaticus develops a serum potassium of 2.9 mEq/L. The most likely cause is:","roman":null,"opts":["Albuterol driving potassium into cells","Dehydration from rapid breathing","An unrelated renal problem","A laboratory sampling error"],"ans":0,"why":"Beta-2 stimulation shifts potassium intracellularly, and high-dose continuous therapy makes hypokalemia common. Monitor potassium whenever continuous or repeated high-dose beta agonists are used."},{"cat":"Clinical scenario","stem":"A nurse reports that a patient became jittery and tachycardic after his first dose of a new inhaler. Reviewing the MAR, you would most suspect:","roman":null,"opts":["An anticholinergic","A beta-2 agonist","An inhaled corticosteroid","A leukotriene modifier"],"ans":1,"why":"Tremor and tachycardia are the signature beta-2 agonist effects, from receptor stimulation in skeletal muscle and the heart. Anticholinergics dry secretions instead, and steroids act too slowly to cause this."},{"cat":"Clinical scenario","stem":"A COPD patient on Anoro Ellipta asks for a rescue inhaler to carry. You would expect the physician to prescribe:","roman":null,"opts":["A second dose of Anoro","Albuterol","Salmeterol","Tiotropium"],"ans":1,"why":"Anoro is a once-daily LABA and LAMA combination for maintenance. The patient still needs a short-acting rescue drug, and albuterol is the standard choice."},{"cat":"Clinical scenario","stem":"A patient is prescribed both Spiriva and Atrovent. Your best action is to:","roman":null,"opts":["Administer both exactly as ordered","Question the duplicate anticholinergic","Give only the Atrovent dose","Double the Spiriva dose instead"],"ans":1,"why":"Both are anticholinergics acting on the same muscarinic receptors, so combining them adds side effects without added benefit. Clarify the order with the prescriber."},{"cat":"Clinical scenario","stem":"During a treatment a patient says the mist tastes bitter and complains of a dry mouth. The drug was most likely:","roman":null,"opts":["Albuterol","Ipratropium","Normal saline","Budesonide"],"ans":1,"why":"Bitter taste and dry mouth are characteristic of ipratropium, from the anticholinergic blockade of salivary secretion. Keep the mist out of the eyes as well."},{"cat":"Clinical scenario","stem":"A patient with a new theophylline prescription asks how he will know the dose is right. You explain that:","roman":null,"opts":["His symptoms alone will guide it","Blood levels will be drawn regularly","A chest x-ray will confirm it","Pulse oximetry readings will show it"],"ans":1,"why":"Theophylline has a narrow range of 5 to 15 mcg/mL, so dosing is guided by serum levels plus a check for side effects. Levels are repeated after any dose change."},{"cat":"Clinical scenario","stem":"An intubated patient is receiving in-line albuterol by MDI. To improve delivery you should:","roman":null,"opts":["Remove the circuit humidifier entirely","Use a spacer and time with inspiration","Increase the set ventilator rate","Give the dose during exhalation"],"ans":1,"why":"A spacer or chamber adapter in the circuit and actuation timed to the start of inspiration both improve delivery. Firing during exhalation sends the dose out of the circuit."},{"cat":"Clinical scenario","stem":"A patient's peak flow before treatment is 240 L/min and after treatment is 250 L/min, with no symptom change. This suggests:","roman":null,"opts":["An excellent bronchodilator response","Little meaningful response","An error in technique only","That the dose was too high"],"ans":1,"why":"A rise of about 4% is not a meaningful bronchodilator response. Consider whether the obstruction is fixed, or whether edema or secretions rather than spasm are responsible."},{"cat":"Clinical scenario","stem":"A home care patient reports her nebulizer treatments now take 25 minutes instead of 10. The most likely cause is:","roman":null,"opts":["The drug has become more concentrated","The nebulizer or filter needs replacing","She is breathing far too deeply","The prescribed dose was increased"],"ans":1,"why":"A treatment time that creeps up usually means a worn nebulizer, a dirty or obstructed filter, or a failing compressor. Review cleaning and replacement schedules."},{"cat":"Clinical scenario","stem":"A patient taking prednisone 40 mg daily for five days asks whether she needs to taper. The correct response is that:","roman":null,"opts":["Every course requires a long taper","A short course of 5 to 10 days usually does not","She should stop at once and restart later","Tapering is only for inhaled steroids"],"ans":1,"why":"Short bursts of roughly 5 to 10 days generally do not require tapering. Courses beyond about two
