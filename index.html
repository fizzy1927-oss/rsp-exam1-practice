to three weeks suppress the adrenal axis and do need one."},{"cat":"Clinical scenario","stem":"A patient on omalizumab misses his clinic appointment and asks to self-inject at home. You should explain that:","roman":null,"opts":["All patients may self-inject right away","Early doses need supervised observation","The drug may simply be skipped","He should double his next dose"],"ans":1,"why":"Omalizumab carries a boxed warning for anaphylaxis, which can be delayed, so early doses are given under observation. Self-injection is considered only after training and a period without reactions."},{"cat":"Clinical scenario","stem":"A CF patient asks why her inhaled tobramycin is stopped every other month. You explain the 28-day on and off cycle:","roman":null,"opts":["Saves money on the prescription","Limits resistance and toxicity","Lets the lungs rest from aerosol","Matches the insurance refill"],"ans":1,"why":"Cycling reduces the development of resistant organisms and limits cumulative toxicity. Monitor renal function and hearing with aminoglycoside therapy."},{"cat":"Clinical scenario","stem":"A patient receiving an inhaled corticosteroid asks why her asthma did not improve after the first dose. You explain that the drug:","roman":null,"opts":["Was given incorrectly","Needs days to weeks for full effect","Only works during attacks","Must be taken with a rescue inhaler"],"ans":1,"why":"Inhaled corticosteroids reduce inflammation gradually, with benefit beginning in days and full effect over one to two weeks or longer. They are never a rescue medication."},{"cat":"Clinical scenario","stem":"An elderly patient on multiple drugs develops confusion, dry mouth, blurred vision, and urinary retention. You would review the chart for:","roman":null,"opts":["Excess beta-2 agonist dosing","Cumulative anticholinergic burden","Theophylline deficiency","Overuse of inhaled saline"],"ans":1,"why":"These are classic anticholinergic effects, and multiple drugs with anticholinergic properties add up. Older patients are especially sensitive, and confusion suggests central effects."},{"cat":"Clinical scenario","stem":"A patient brings in an expired albuterol inhaler and asks whether it still works. You advise that:","roman":null,"opts":["Expired inhalers are always safe","Potency is not guaranteed after expiry","It works better once aged","It should be refrigerated instead"],"ans":1,"why":"Potency is not guaranteed past the expiration date, and a rescue inhaler that underdelivers during an attack is dangerous. Replace it."},{"cat":"Clinical scenario","stem":"A patient with COPD and an eosinophilic phenotype remains uncontrolled on triple inhaled therapy. The next reasonable addition is:","roman":null,"opts":["Oral theophylline","A biologic such as dupilumab","A second LAMA","More frequent albuterol"],"ans":1,"why":"Dupilumab is approved as add-on maintenance for inadequately controlled COPD with an eosinophilic phenotype. A second LAMA duplicates therapy and theophylline carries more risk."},{"cat":"Clinical scenario","stem":"During assessment you note the patient is using accessory muscles and speaking in three-word sentences. This indicates:","roman":null,"opts":["Mild distress needing routine care","Significant distress needing treatment","Normal breathing for a COPD patient","A good response to the therapy"],"ans":1,"why":"Accessory muscle use and fragmented speech signal significant work of breathing. Treat promptly and reassess rather than waiting for a scheduled treatment."},{"cat":"Clinical scenario","stem":"A patient asks why she must rinse her mouth after Advair but not after her albuterol inhaler. The reason is that Advair contains:","roman":null,"opts":["A higher dose of bronchodilator","A corticosteroid that causes thrush","An antibiotic that stains teeth","A preservative that irritates"],"ans":1,"why":"The fluticasone component deposits in the mouth and promotes candidiasis and hoarseness. Albuterol alone carries no such risk, so rinsing is not required."},{"cat":"Clinical scenario","stem":"A patient's order reads albuterol 2.5 mg nebulized q4h PRN. The patient requests a treatment 90 minutes after the last one. You should:","roman":null,"opts":["Give it, since PRN means any time","Hold, assess, and call the prescriber","Give half of the ordered dose","Substitute ipratropium instead"],"ans":1,"why":"PRN still carries a minimum interval, and q4h means no sooner than four hours. Needing a treatment early signals deterioration, so assess and notify rather than dosing off-schedule."},{"cat":"Clinical scenario","stem":"A patient on a beta blocker for hypertension is admitted with wheezing that responds poorly to albuterol. The most likely explanation is:","roman":null,"opts":["The albuterol dose was far too low","The beta blocker opposes the albuterol","The patient also has pneumonia","The nebulizer unit is defective"],"ans":1,"why":"A beta blocker occupies the same receptors albuterol needs, blunting the response. An anticholinergic works by a different pathway and may be more effective here."},{"cat":"Clinical scenario","stem":"A neonate on caffeine citrate has a heart rate consistently above 180. You should:","roman":null,"opts":["Continue and recheck in a week","Report it and anticipate a level check","Double the dose for better effect","Switch to oral theophylline"],"ans":1,"why":"Persistent tachycardia suggests the level may be too high. Report it, expect a serum caffeine level, and remember that caffeine citrate is twice the caffeine base dose."},{"cat":"Clinical scenario","stem":"A patient is to receive budesonide, albuterol, and ipratropium by nebulizer. Regarding mixing, you may:","roman":null,"opts":["Mix all three in one cup","Mix them, since all three are compatible","Give each one separately only","Mix only the albuterol and budesonide"],"ans":1,"why":"Albuterol, levalbuterol, and formoterol are documented as compatible with ipratropium, acetylcysteine, and budesonide. Most other agents are not approved for admixture."},{"cat":"Clinical scenario","stem":"A patient is discharged on Symbicort and asks whether to keep using her albuterol. You explain that:","roman":null,"opts":["Albuterol is no longer needed at all","Symbicort is maintenance, albuterol rescue","Both of them are rescue inhalers","She should alternate the two daily"],"ans":1,"why":"Symbicort is a twice-daily controller combining budesonide with formoterol. Unless her plan specifically uses it as a reliever, she keeps a short-acting inhaler for sudden symptoms."},{"cat":"Clinical scenario","stem":"A patient has been on salmeterol alone for asthma for three months. Your immediate concern is that:","roman":null,"opts":["The dose is probably far too low","LABA alone carries a mortality risk","Salmeterol works far too quickly","He needs a nebulizer instead"],"ans":1,"why":"LABA monotherapy in asthma is contraindicated and raises the risk of serious asthma-related events, including death. He needs an inhaled corticosteroid added or a combination product."},{"cat":"Clinical scenario","stem":"A patient coughs violently every time he uses his dry powder inhaler. The most likely explanation is:","roman":null,"opts":["The device is defective","Powder irritation on inhalation","He is inhaling too slowly","The drug is expired"],"ans":1,"why":"Cough right after inhalation is a known effect of dry powder formulations, particularly indacaterol. Confirm technique, and if the cough persists a different device may suit him better."},{"cat":"Clinical scenario","stem":"A patient with glaucoma is scheduled for nebulized ipratropium by face mask. The safest modification is:","roman":null,"opts":["Cancel the treatment entirely","Use a mouthpiece instead of a mask","Halve the ordered dose","Give it by MDI without a spacer"],"ans":1,"why":"Anticholinergic mist reaching the eyes can raise intraocular pressure and precipitate acute angle-closure glaucoma. A mouthpiece keeps the aerosol away from the eyes."},{"cat":"Clinical scenario","stem":"A patient on chronic inhaled corticosteroids reports easy bruising and a rounder face. These findings suggest:","roman":null,"opts":["Normal aging changes","Systemic corticosteroid absorption","An allergic reaction","Beta-2 receptor downregulation"],"ans":1,"why":"Even inhaled steroids are absorbed to a degree, and high doses over time can produce systemic effects such as skin thinning, bruising, and cushingoid features. The dose should be reviewed."},{"cat":"Routes","stem":"Smaller doses are effective by the inhalation route because:","roman":null,"opts":["The lung absorbs more than the gut","There is no first-pass effect","The drug is more concentrated","Inhaled drugs never reach blood"],"ans":1,"why":"An inhaled drug goes straight to the airway and skips the liver, so none of the dose is lost to first-pass metabolism. An oral dose has to be larger to compensate."},{"cat":"Clinical scenario","stem":"Which aerosolized bronchodilator is best for a patient having an acute asthma exacerbation?","roman":null,"opts":["Salmeterol (Serevent)","Albuterol (Proventil)","Tiotropium (Spiriva)","Cromolyn sodium (Intal)"],"ans":1,"why":"Albuterol is the short-acting rescue agent, with an onset of 5 to 15 minutes. Salmeterol and tiotropium are maintenance drugs and cromolyn prevents attacks rather than treating them."},{"cat":"Clinical scenario","stem":"An asthma patient fails to improve after a nebulized albuterol treatment. Which would be most appropriate next?","roman":null,"opts":["A second identical albuterol dose","Levalbuterol (Xopenex)","Salmeterol (Serevent)","Cromolyn sodium (Intal)"],"ans":1,"why":"Levalbuterol is the R-isomer of albuterol and is sometimes chosen when albuterol has not produced the desired response or has caused troublesome side effects. The long-acting agents have no role in an acute failure to respond."},{"cat":"Assessment","stem":"A patient's pretreatment pulse is 85 beats/min. Using the 20% rule, the treatment should be stopped once the pulse reaches roughly:","roman":null,"opts":["90 beats/min","100 beats/min","130 beats/min","150 beats/min"],"ans":1,"why":"Twenty percent of 85 is about 17, so the threshold lands near 102 and 100 is the closest choice. The companion rule is an absolute rise of 20 beats per minute."},{"cat":"Assessment","stem":"A patient's pretreatment pulse is 80 beats/min. An absolute rise of 20 beats would mean stopping at:","roman":null,"opts":["90 beats/min","100 beats/min","110 beats/min","120 beats/min"],"ans":1,"why":"A rise of 20 beats from a baseline of 80 reaches 100. Either a 20% increase over baseline or an absolute 20 beat rise is considered clinically significant."},{"cat":"Routes","stem":"A physician wants a patient to receive acetaminophen by the enteral route. Acceptable choices include:","roman":["Oral tablet","Rectal suppository","Through a PEG tube","Sublingual"],"opts":["I and II only","I, II, and III","II, III, and IV","I, II, III, and IV"],"ans":3,"why":"Enteral means through the GI tract, which covers oral, sublingual, rectal, and feeding tube routes. Intravenous would be parenteral."},{"cat":"Clinical scenario","stem":"A patient extubated this morning is switched from a 35% cool aerosol mask to a nasal cannula at 3 L/min. He becomes tachypneic with accessory muscle use and a hoarse, high-pitched inspiratory sound. The most appropriate treatment is:","roman":null,"opts":["Nebulized albuterol","Racemic epinephrine","Nebulized ipratropium","An inhaled corticosteroid"],"ans":1,"why":"A hoarse, high-pitched INSPIRATORY noise is stridor, which means upper airway swelling after extubation, not bronchospasm. Racemic epinephrine constricts the vessels and shrinks the edema. Watch for rebound in 1 to 2 hours. NOTE: your instructor's study set keys this scenario to albuterol, so ask him which answer he wants."},{"cat":"Assessment","stem":"A patient has a hoarse, high-pitched noise heard on INSPIRATION after extubation. This finding is:","roman":null,"opts":["Expiratory wheezing from bronchospasm","Stridor from upper airway swelling","Normal breath sounds","Crackles from fluid"],"ans":1,"why":"Stridor is inspiratory and comes from narrowing above or at the larynx. Wheezing is mostly expiratory and comes from the lower airways. The distinction decides whether you reach for racemic epinephrine or a bronchodilator."},{"cat":"Assessment","stem":"Which finding points to LOWER airway bronchospasm rather than upper airway swelling?","roman":null,"opts":["Inspiratory stridor at rest","Prolonged expiratory wheezing","A newly hoarse voice","A barking seal-like cough"],"ans":1,"why":"Prolonged expiratory wheezing signals lower airway narrowing, which responds to a bronchodilator. Stridor, hoarseness, and a barking cough all point upward to the larynx."},{"cat":"Clinical scenario","stem":"A 20-year-old woman with asthma gets significant tremor and a racing heart from albuterol, though it does relieve her symptoms. A reasonable alternative is:","roman":null,"opts":["Salmeterol","Levalbuterol","Ipratropium","Theophylline"],"ans":1,"why":"Levalbuterol is the purified R-isomer and is often tried when albuterol's beta side effects are troublesome. Evidence for a real advantage is limited, since beta toxicity is largely dose related, but it is the standard substitution."},{"cat":"Clinical scenario","stem":"A 67-year-old man with asthma controlled on an inhaled corticosteroid still has symptoms overnight. The appropriate addition at bedtime is:","roman":null,"opts":["Albuterol","Salmeterol","Racemic epinephrine","Cromolyn sodium"],"ans":1,"why":"Salmeterol lasts about 12 hours, so a bedtime dose carries through the early morning. It is added to the existing inhaled corticosteroid and never used alone in asthma."},{"cat":"Clinical scenario","stem":"A patient in the emergency department has a respiratory rate of 31, a heart rate of 110, and a prolonged expiratory wheeze with a history of asthma. The drug of choice is:","roman":null,"opts":["Aclidinium","Albuterol","Salmeterol","Caffeine citrate"],"ans":1,"why":"A prolonged expiratory wheeze with distress is acute bronchospasm, which calls for a short-acting rescue agent. The long-acting drugs work too slowly and caffeine citrate treats neonatal apnea."},{"cat":"Routes","stem":"Compared with an oral dose of the same drug, an inhaled dose for airway effect is usually:","roman":null,"opts":["Considerably larger","Considerably smaller","Exactly the same","Given less often"],"ans":1,"why":"Inhalation delivers drug straight to the target tissue without first-pass loss, so a much smaller dose achieves the same airway effect with fewer systemic side effects."},{"cat":"Assessment","stem":"Besides heart rate, which change during a bronchodilator treatment should prompt you to stop?","roman":null,"opts":["A mild tremor of the hands","New palpitations or irregular pulse","A slight metallic aftertaste","Mild dryness of the throat"],"ans":1,"why":"New palpitations or an irregular rhythm mean the cardiac effects have become significant. Mild tremor, taste changes, and dryness are expected and are not reasons to stop."},{"cat":"Clinical scenario","stem":"A patient's wheeze persists after two albuterol treatments in the emergency department. Which addition gives bronchodilation by a different mechanism?","roman":null,"opts":["A second albuterol dose","Ipratropium","Salmeterol","Montelukast"],"ans":1,"why":"Ipratropium blocks muscarinic receptors in the larger airways, so its effect adds to the beta-2 stimulation albuterol provides. Repeating the same drug does not add a new mechanism."},{"cat":"Drug naming","stem":"Proventil HFA, Ventolin, and ProAir are all examples of which type of name for the same drug?","roman":null,"opts":["Chemical names","Generic names","Trade names","Official names"],"ans":2,"why":"All three are brand or proprietary names assigned by manufacturers. The single generic name underneath all of them is albuterol."},{"cat":"Pharmacology","stem":"A patient becomes less responsive to a drug over months, so the dose has to be raised to get the same effect. This is:","roman":null,"opts":["Tolerance","Tachyphylaxis","Hypersensitivity","Anaphylaxis"],"ans":0,"why":"Tolerance is the gradual loss of response with long-term use that requires a higher dose. Tachyphylaxis is the rapid version, appearing within minutes of a dose and reversing when the drug stops."},{"cat":"Clinical scenario","stem":"A COPD patient on albuterol alone asks what a daily inhaler would add. Your best answer is that a long-acting agent:","roman":null,"opts":["Replaces the need for any rescue inhaler","Keeps the airway open continuously","Works faster than albuterol","Treats infection as well"],"ans":1,"why":"A LABA or LAMA holds the airway open around the clock, which reduces how often rescue medication is needed. The rescue inhaler is still kept for sudden symptoms."},{"cat":"Assessment","stem":"What is the purpose of taking a pulse before starting an aerosolized bronchodilator?","roman":null,"opts":["To document the billing time","To establish a baseline to compare","To decide the nebulizer flow rate","To select the right mouthpiece size"],"ans":1,"why":"Without a pretreatment pulse you cannot judge whether the rise during treatment is significant. The thresholds, 20% over baseline or 20 beats per minute, are both measured against that starting number."},{"cat":"Clinical scenario","stem":"A patient is extubated and placed on cool aerosol. Which assessment finding would most concern you in the next few hours?","roman":null,"opts":["A mild sore throat","Developing inspiratory stridor","Clear bilateral breath sounds","A stable respiratory rate"],"ans":1,"why":"Stridor developing after extubation signals laryngeal edema, which can progress to obstruction. It needs prompt treatment with a vasoconstricting aerosol and close observation."},{"cat":"Core drugs","stem":"The usual adult nebulized dose range for levalbuterol is:","roman":null,"opts":["0.063 to 0.125 mg","0.63 to 1.25 mg","6.3 to 12.5 mg","63 to 125 mg"],"ans":1,"why":"Levalbuterol comes as 0.31, 0.63, and 1.25 mg unit-dose vials in 3 mL, given every 6 to 8 hours. The 0.63 mg strength is the common adult starting dose."},{"cat":"Core drugs","stem":"Levalbuterol 0.63 mg is considered roughly equivalent in effect to which dose of racemic albuterol?","roman":null,"opts":["0.63 mg","1.25 mg","2.5 mg","5 mg"],"ans":1,"why":"Levalbuterol is the active R-isomer, so about half the racemic dose gives a comparable effect. Racemic albuterol contains both the R and S isomers, and only the R half is active."},{"cat":"Core drugs","stem":"Levalbuterol is best described as:","roman":null,"opts":["A long-acting beta agonist","The R-isomer of albuterol","An anticholinergic agent","The S-isomer of albuterol"],"ans":1,"why":"Levalbuterol is the purified R-isomer, which is the active half of racemic albuterol. It is short acting, lasting about 5 to 6 hours."},{"cat":"Core drugs","stem":"The duration of action of nebulized levalbuterol is approximately:","roman":null,"opts":["1 to 2 hours","5 to 6 hours","12 hours","24 hours"],"ans":1,"why":"Levalbuterol lasts about 5 to 6 hours, with up to 8 hours reported in some patients. That keeps it firmly in the short-acting rescue category."},{"cat":"Core drugs","stem":"Levalbuterol unit-dose vials should be:","roman":null,"opts":["Kept at room temperature in open light indefinitely","Protected from light and used within 2 weeks","Frozen until the day of the scheduled treatment","Diluted with sterile water immediately before use"],"ans":1,"why":"Protect the vials from light and use them within two weeks once removed from the foil pouch. They are supplied ready to nebulize with no dilution needed."},{"cat":"Core drugs","stem":"Racemic epinephrine is supplied as which concentration?","roman":null,"opts":["0.083%","0.5%","2.25%","20%"],"ans":2,"why":"Racemic epinephrine is a 2.25% solution. The usual dose is 0.25 to 0.5 mL diluted in about 3 mL of normal saline for nebulization."},{"cat":"Core drugs","stem":"The primary therapeutic effect of racemic epinephrine in croup comes from:","roman":null,"opts":["Beta-2 bronchodilation","Alpha vasoconstriction","Muscarinic blockade","Phosphodiesterase inhibition"],"ans":1,"why":"The alpha effect constricts mucosal blood vessels and shrinks the swollen airway lining. It is only a relatively weak bronchodilator, so swelling rather than spasm is its target."},{"cat":"Core drugs","stem":"Racemic epinephrine would be indicated for all of the following EXCEPT:","roman":null,"opts":["Croup in a toddler","Post-extubation stridor","Laryngeal edema","Chronic COPD maintenance"],"ans":3,"why":"Racemic epinephrine treats upper airway swelling: croup, post-extubation stridor, and laryngeal edema. It has no role in chronic maintenance, where a long-acting bronchodilator is used."},{"cat":"Core drugs","stem":"A racemic epinephrine solution has turned pink. You should:","roman":null,"opts":["Use it; the color is normal","Discard it, since it has oxidized","Dilute it with more saline","Warm it before administering"],"ans":1,"why":"Catecholamines turn pink as they oxidize, meaning the drug has lost potency. Protect it from heat, light, and air, and discard any discolored solution."},{"cat":"Core drugs","stem":"What makes formoterol unusual among the long-acting beta agonists?","roman":null,"opts":["It lasts 24 hours","Its onset is 2 to 3 minutes","It is an anticholinergic","It is given once daily"],"ans":1,"why":"Formoterol is both fast and long acting, with an onset of 2 to 3 minutes and a 12-hour duration. Salmeterol, by contrast, is slow to start."},{"cat":"Core drugs","stem":"Nebulized formoterol (Perforomist) is labeled for which condition?","roman":null,"opts":["Asthma only","COPD only","Both asthma and COPD","Acute bronchospasm only"],"ans":1,"why":"Perforomist is indicated for COPD maintenance only and is not indicated for asthma. The Foradil capsule form carries the asthma indication, always with an inhaled corticosteroid."},{"cat":"Core drugs","stem":"Despite its rapid onset, formoterol should not be used as a rescue drug because:","roman":null,"opts":["Its onset is far too slow for sudden symptoms","Repeated doses accumulate and risk toxicity","It causes paradoxical bronchoconstriction","It has no effect on airway smooth muscle"],"ans":1,"why":"Repeated dosing of a long-acting agent builds up in the body and raises the risk of toxicity. A short-acting agent is kept for sudden symptoms."},{"cat":"Core drugs","stem":"The maximum total daily dose of nebulized formoterol is:","roman":null,"opts":["20 mcg","40 mcg","80 mcg","120 mcg"],"ans":1,"why":"Two 20 mcg doses twelve hours apart give a maximum of 40 mcg per day. Exceeding it does not improve bronchodilation and increases cardiac risk."},{"cat":"Core drugs","stem":"The nebulized dose of arformoterol for COPD is:","roman":null,"opts":["15 mcg twice daily","15 mg twice daily","20 mcg twice daily","15 mcg four times daily"],"ans":0,"why":"Brovana is 15 mcg nebulized twice daily, morning and evening, for a maximum of 30 mcg per day. Watch the units, since 15 mg would be a thousandfold overdose."},{"cat":"Core drugs","stem":"Arformoterol vials should be stored:","roman":null,"opts":["At room temperature for the entire shelf life","Refrigerated, with limited time at room temp","In a freezer until the morning of the dose","In direct sunlight to maintain potency"],"ans":1,"why":"Keep the foil pouch refrigerated; it may be held at room temperature for a limited period. Use the vial immediately after opening and do not mix it with other drugs."},{"cat":"Core drugs","stem":"Arformoterol is indicated for:","roman":null,"opts":["Acute asthma attacks","COPD maintenance","Croup in children","Neonatal apnea"],"ans":1,"why":"Arformoterol is a long-acting beta agonist for COPD maintenance and is not indicated for asthma. Its onset of about 7 minutes is still far too slow for rescue."},{"cat":"Core drugs","stem":"Which two nebulized long-acting beta agonists are dosed every 12 hours for COPD?","roman":null,"opts":["Albuterol and levalbuterol","Formoterol and arformoterol","Ipratropium and albuterol","Salmeterol and tiotropium"],"ans":1,"why":"Formoterol 20 mcg and arformoterol 15 mcg are the two nebulized LABAs, both given twice daily for COPD. Salmeterol and tiotropium are not nebulizer products."},{"cat":"Core drugs","stem":"The usual nebulized dose of ipratropium bromide is:","roman":null,"opts":["0.5 mg every 6 to 8 hours","2.5 mg every 4 hours","20 mcg every 12 hours","18 mcg once daily"],"ans":0,"why":"Ipratropium is 0.5 mg in 2.5 mL of 0.02% solution, given every 6 to 8 hours. In acute care it may be repeated every 20 minutes for three doses alongside a beta agonist."},{"cat":"Core drugs","stem":"Ipratropium delivered by face mask requires which specific precaution?","roman":null,"opts":["Keeping the patient supine","Keeping the mist out of the eyes","Warming the solution first","Giving oxygen at 100%"],"ans":1,"why":"Anticholinergic mist reaching the eyes dilates the pupil and can precipitate acute angle-closure glaucoma. Use a mouthpiece or a well-fitted mask."},{"cat":"Core drugs","stem":"Compared with albuterol, ipratropium acts on which part of the airway?","roman":null,"opts":["The small peripheral airways","The central, larger airways","The alveoli only","The pulmonary vasculature"],"ans":1,"why":"Ipratropium works on the central, larger airways while beta-2 receptors concentrate in the small peripheral airways. Different sites plus different mechanisms is why the two are additive."},{"cat":"Core drugs","stem":"Why is ipratropium preferred over atropine for airway use?","roman":null,"opts":["It is substantially cheaper to manufacture","It stays in the lung with few systemic effects","It has a dramatically faster onset of action","It gives a full 24 hours of bronchodilation per dose"],"ans":1,"why":"Ipratropium is a charged quaternary ammonium compound, so it stays in the airway with few systemic effects and little impact on mucociliary clearance. Atropine is lipophilic and crosses everywhere."},{"cat":"Core drugs","stem":"One 3 mL vial of DuoNeb contains:","roman":null,"opts":["Albuterol 2.5 mg alone","Ipratropium 0.5 mg and albuterol 3 mg","Ipratropium 0.5 mg alone","Levalbuterol 1.25 mg and ipratropium"],"ans":1,"why":"DuoNeb delivers ipratropium 0.5 mg with albuterol sulfate 3 mg, equal to 2.5 mg albuterol base, in one 3 mL vial. The usual frequency is every 6 hours."},{"cat":"Core drugs","stem":"DuoNeb combines which two drug classes?","roman":null,"opts":["Two beta agonists","A beta agonist and an anticholinergic","A steroid and a beta agonist","An anticholinergic and a xanthine"],"ans":1,"why":"DuoNeb pairs albuterol, a sympathomimetic, with ipratropium, a parasympatholytic. The two open the airway by different pathways, so the effect adds up."},{"cat":"Core drugs","stem":"A patient is already receiving DuoNeb. The physician adds a separate albuterol treatment at the same time. You should:","roman":null,"opts":["Give both as ordered","Point out the duplicate albuterol","Give only the albuterol","Double the DuoNeb instead"],"ans":1,"why":"DuoNeb already contains albuterol, so adding a separate dose duplicates the beta agonist and compounds the tachycardia and tremor. Clarify the order before giving it."},{"cat":"Core drugs","stem":"Combivent Respimat delivers the same drug pairing as DuoNeb by which device?","roman":null,"opts":["A dry powder inhaler","A soft mist inhaler","A jet nebulizer","A breath-actuated MDI"],"ans":1,"why":"Combivent Respimat is a soft mist inhaler delivering ipratropium 20 mcg with albuterol 100 mcg per actuation. The slower aerosol velocity improves deposition."},{"cat":"Core drugs","stem":"Which of these is the only one indicated for acute rescue?","roman":null,"opts":["Formoterol","Albuterol","Arformoterol","Salmeterol"],"ans":1,"why":"Albuterol is short acting with an onset of 5 to 15 minutes. Formoterol, arformoterol, and salmeterol are all long-acting maintenance agents, never used for rescue."},{"cat":"Core drugs","stem":"Rank these by onset of action, fastest first.","roman":null,"opts":["Ipratropium, albuterol, formoterol","Formoterol, albuterol, ipratropium","Albuterol, ipratropium, formoterol","Ipratropium, formoterol, albuterol"],"ans":1,"why":"Formoterol starts in 2 to 3 minutes, albuterol in 5 to 15, and ipratropium in 15 to 30. Fast onset does not make formoterol a rescue drug, since duration defines the class."},{"cat":"Core drugs","stem":"Which drugs may be mixed together in one nebulizer cup?","roman":["Albuterol and ipratropium","Levalbuterol and budesonide","Formoterol and acetylcysteine","Dornase alfa and albuterol"],"opts":["I and II only","I, II, and III","II and IV only","None may be mixed"],"ans":1,"why":"Albuterol, levalbuterol, and formoterol are documented as compatible with ipratropium, acetylcysteine, and budesonide. Dornase alfa must never be mixed with anything."},{"cat":"Core drugs","stem":"Which pairing of drug and usual adult dose is correct?","roman":null,"opts":["Albuterol 0.5 mg neb","Ipratropium 0.5 mg neb","Formoterol 20 mg neb","Arformoterol 15 mg neb"],"ans":1,"why":"Ipratropium is 0.5 mg nebulized. Albuterol is 2.5 mg, formoterol is 20 micrograms, and arformoterol is 15 micrograms. Mixing up mg and mcg is a classic exam trap."},{"cat":"Clinical scenario","stem":"A COPD patient on albuterol as needed is started on a nebulized maintenance drug twice daily. Which is he most likely receiving?","roman":null,"opts":["Racemic epinephrine","Arformoterol","Ipratropium","Levalbuterol"],"ans":1,"why":"Arformoterol 15 mcg twice daily is a nebulized LABA for COPD maintenance. Formoterol 20 mcg twice daily would be the other possibility; the rest are short acting."},{"cat":"Clinical scenario","stem":"A 3-year-old has a barking cough and inspiratory stridor in the emergency department. The appropriate order is:","roman":null,"opts":["Albuterol 2.5 mg nebulized every 4 hours","Racemic epinephrine 0.5 mL in 3 mL saline","Ipratropium 0.5 mg nebulized every 6 hours","Arformoterol 15 mcg nebulized twice daily"],"ans":1,"why":"Croup is upper airway swelling, which responds to the alpha vasoconstriction of racemic epinephrine. Bronchodilators relax smooth muscle, which is not what is narrowing this airway."},{"cat":"Clinical scenario","stem":"An asthmatic in the emergency department has had three albuterol treatments with partial improvement. Adding which drug gives a different mechanism?","roman":null,"opts":["Levalbuterol","Ipratropium","Formoterol","More albuterol"],"ans":1,"why":"Ipratropium blocks muscarinic receptors, so its bronchodilation adds to the beta-2 effect albuterol provides. Levalbuterol and formoterol both work on the same beta-2 receptor."},{"cat":"Clinical scenario","stem":"A patient on nebulized formoterol asks for an extra dose because he feels short of breath. You should:","roman":null,"opts":["Give the extra dose","Hold it and give his rescue inhaler","Double the next scheduled dose","Switch him to arformoterol"],"ans":1,"why":"Formoterol is dosed every 12 hours and the daily maximum is 40 mcg. Extra doses risk accumulation and toxicity, so sudden symptoms are treated with the short-acting rescue agent."},{"cat":"Clinical scenario","stem":"After a racemic epinephrine treatment the child improves and the parents ask to go home. You advise that:","roman":null,"opts":["Discharge now is fine since he looks better","Observation is needed for possible rebound","A second dose is required before discharge","Overnight admission is mandatory in all cases"],"ans":1,"why":"The effect fades in 1 to 2 hours and swelling can return, so the child is observed before discharge rather than sent home on the immediate improvement."},{"cat":"Clinical scenario","stem":"A patient receiving DuoNeb every 6 hours develops a heart rate rise from 88 to 124 and a fine tremor. The most likely cause is:","roman":null,"opts":["The ipratropium component","The albuterol component","The saline diluent","The nebulizer flow rate"],"ans":1,"why":"Tremor and tachycardia are beta-2 effects from the albuterol half. Ipratropium produces dry mouth and a bitter taste rather than these cardiac and skeletal muscle effects."},{"cat":"Core drugs","stem":"Which core drug would you expect to cause dry mouth and a bitter taste?","roman":null,"opts":["Albuterol","Ipratropium","Formoterol","Racemic epinephrine"],"ans":1,"why":"Dry mouth and bitter taste are anticholinergic effects from blocking salivary secretion. The beta agonists cause tremor and tachycardia instead."},{"cat":"Core drugs","stem":"Which core drug carries the greatest risk of rebound airway swelling after it wears off?","roman":null,"opts":["Albuterol","Racemic epinephrine","Ipratropium","Arformoterol"],"ans":1,"why":"Racemic epinephrine shrinks swollen tissue by vasoconstriction, and the swelling can return as the drug fades over 1 to 2 hours. This is why observation after treatment is standard."},{"cat":"Core drugs","stem":"Which core drugs are short acting and therefore usable for quick relief?","roman":["Albuterol","Levalbuterol","Formoterol","Ipratropium"],"opts":["I and II only","I, II, and IV","II, III, and IV","I, II, III, and IV"],"ans":1,"why":"Albuterol and levalbuterol are short-acting beta agonists, and ipratropium is a short-acting anticholinergic used for quick relief or short-term maintenance. Formoterol is long acting."},{"cat":"Core drugs","stem":"Which core drug is given for its alpha effect rather than its beta effect?","roman":null,"opts":["Albuterol","Levalbuterol","Racemic epinephrine","Formoterol"],"ans":2,"why":"Racemic epinephrine is used for alpha-mediated vasoconstriction to shrink airway edema. Its beta bronchodilating effect is relatively weak and not the reason it is chosen."},{"cat":"Core drugs","stem":"An order reads albuterol 2.5 mg nebulized every 4 hours as needed. The concentration most commonly supplied is:","roman":null,"opts":["0.083% in 3 mL","0.02% in 2.5 mL","2.25% in 0.5 mL","0.5% in 20 mL"],"ans":0,"why":"Albuterol unit-dose is 2.5 mg in 3 mL of 0.083% solution. The 0.02% in 2.5 mL is ipratropium and the 2.25% is racemic epinephrine."},{"cat":"Core drugs","stem":"Which concentration belongs to ipratropium bromide?","roman":null,"opts":["0.083%","0.02%","2.25%","20%"],"ans":1,"why":"Ipratropium nebulizer solution is 0.02%, supplying 0.5 mg in 2.5 mL. Albuterol is 0.083% and racemic epinephrine is 2.25%."},{"cat":"Core drugs","roman":null,"stem":"Swelling can rebound once racemic epinephrine wears off. How long does its effect last?","opts":["About 15 minutes","About 1 to 2 hours","About 6 to 8 hours","About 12 hours"],"ans":1,"why":"The effect lasts only about 1 to 2 hours, which is why patients are observed afterward. Swelling can rebound as the vasoconstriction fades."},{"cat":"Core drugs","roman":null,"stem":"Which description fits arformoterol?","opts":["The R,R-isomer of formoterol","A short-acting anticholinergic","The S-isomer of albuterol","A methylxanthine"],"ans":0,"why":"Arformoterol is the purified (R,R)-isomer of formoterol, delivered by nebulizer for COPD maintenance. The relationship mirrors levalbuterol and albuterol."},{"cat":"Core drugs","roman":null,"stem":"How long after a nebulized ipratropium treatment does bronchodilation begin?","opts":["Under 1 minute","15 to 30 minutes","2 hours","6 hours"],"ans":1,"why":"Ipratropium takes 15 to 30 minutes to begin working, peaks at 1 to 2 hours, and lasts 4 to 6 hours. That slow onset is why it is a poor choice as a sole rescue agent."},{"cat":"Core drugs","roman":null,"stem":"Which statement about levalbuterol is correct?","opts":["It is the active R-isomer of albuterol","It is classified as a long-acting beta agonist","It must be diluted with saline before nebulizing","All of the above"],"ans":0,"why":"Levalbuterol is the active R-isomer. It is short acting at about 5 to 6 hours, not a LABA, and the unit-dose vials are supplied ready to nebulize with no dilution."},{"cat":"Core drugs","roman":null,"stem":"Which statement about ipratropium bromide is correct?","opts":["Its onset makes it a good single rescue agent","It is a quaternary compound that stays in the airway","It works mainly on the small peripheral airways","All of the above"],"ans":1,"why":"Ipratropium is a charged quaternary ammonium compound, so it is poorly absorbed and stays in the airway. Its 15 to 30 minute onset makes it a poor sole rescue agent, and it acts on the central, larger airways."},{"cat":"Core drugs","roman":null,"stem":"Which statement about nebulized formoterol is correct?","opts":["It may be repeated as needed for sudden symptoms","The usual dose is 20 mg given twice daily","Its onset of 2 to 3 minutes beats albuterol","All of the above"],"ans":2,"why":"Formoterol starts working in 2 to 3 minutes, faster than albuterol's 5 to 15. It is still a long-acting maintenance drug, never a rescue agent, and the dose is 20 micrograms, not 20 milligrams."},{"cat":"Core drugs","roman":null,"stem":"Which of the following are true of DuoNeb?","opts":["It contains ipratropium 0.5 mg","It contains albuterol sulfate 3 mg","It is usually given every 6 hours","All of the above"],"ans":3,"why":"One 3 mL vial holds ipratropium 0.5 mg plus albuterol sulfate 3 mg, equal to 2.5 mg albuterol base, and the usual frequency is every 6 hours."},{"cat":"Core drugs","roman":null,"stem":"Which statement about albuterol is correct?","opts":["The usual nebulized adult dose is 0.5 mg","Tremor and tachycardia are expected effects","It is supplied only as a 0.02% solution","All of the above"],"ans":1,"why":"Tremor and tachycardia are the predictable beta effects of albuterol. The usual nebulized dose is 2.5 mg, and 0.02% is the ipratropium concentration; albuterol unit dose is 0.083%."},{"cat":"Clinical scenario","stem":"Before an albuterol treatment a patient's FEV1 is 1.8 L. Fifteen minutes after, it is 2.1 L. This represents:","roman":null,"opts":["No meaningful change at all","A significant bronchodilator response","A sign of paradoxical bronchospasm","An invalid test that must be repeated"],"ans":1,"why":"The gain is 300 mL and about 17 percent. Significant reversibility is an increase of at least 12 percent AND at least 200 mL, so this patient meets both parts of the standard."},{"cat":"Clinical scenario","stem":"A patient in severe distress has a silent chest. After an albuterol treatment you hear loud wheezing throughout. This means:","roman":null,"opts":["The breath sounds were misread","He is getting worse quickly","Air movement has improved","The treatment caused bronchospasm"],"ans":2,"why":"A silent chest means too little airflow to generate sound, which is ominous. Wheezing returning means air is moving again, so the patient is improving even though he sounds louder."},{"cat":"Clinical scenario","stem":"You are assessing whether a nebulized albuterol treatment worked. The most useful objective measure at the bedside is:","roman":null,"opts":["The volume left in the cup","The total treatment time","The patient's stated comfort","Peak flow before and after"],"ans":3,"why":"Peak flow or FEV1 before and after gives an objective number to compare. Comfort matters too, but subjective report alone does not document the response."},{"cat":"Clinical scenario","stem":"During an albuterol treatment the patient's wheezing worsens and he becomes tighter. Your first action is to:","roman":null,"opts":["Stop and notify the physician","Increase the nebulizer flow","Add ipratropium to the cup","Finish and recheck in an hour"],"ans":0,"why":"This is paradoxical bronchospasm. Stop the treatment and report it, because continuing can worsen the obstruction. The drug is usually discontinued afterward."},{"cat":"Clinical scenario","stem":"An order reads albuterol 0.5 percent solution, 0.5 mL by nebulizer. How many milligrams is the patient receiving?","roman":null,"opts":["0.5 mg","2.5 mg","5 mg","25 mg"],"ans":1,"why":"A 0.5 percent solution is 5 mg per mL, so 0.5 mL delivers 2.5 mg. That is the same dose as one 3 mL unit-dose vial of 0.083 percent."},{"cat":"Clinical scenario","stem":"A physician orders albuterol 0.5 percent solution 0.5 mL for nebulization. Before giving it you should:","roman":null,"opts":["Substitute a unit-dose vial of 0.083 percent","Give it undiluted as ordered","Dilute it to about 3 mL with saline","Warm the solution to body heat"],"ans":2,"why":"The 0.5 percent concentrate must be diluted to roughly 3 mL with normal saline so the nebulizer can aerosolize it over a usable treatment time."},{"cat":"Clinical scenario","stem":"A child in status asthmaticus is placed on continuous nebulized albuterol. Compared with intermittent treatments, you should watch most closely for:","roman":null,"opts":["Worsening dry mouth","Pinpoint pupils","Rising blood pressure","Falling serum potassium"],"ans":3,"why":"Beta-2 stimulation drives potassium into cells, so continuous high-dose albuterol can cause hypokalemia along with tachycardia and tremor. Monitor the potassium and the cardiac rhythm."},{"cat":"Clinical scenario","stem":"In acute asthma, ipratropium is commonly added to albuterol on what schedule?","roman":null,"opts":["Every 20 minutes for three doses","Every 12 hours as maintenance","Once daily in the morning","Once at the start only"],"ans":0,"why":"In the acute setting ipratropium 0.5 mg is given with albuterol every 20 minutes for three doses. Beyond the acute phase it returns to every 6 to 8 hours."},{"cat":"Clinical scenario","stem":"A 2-year-old with croup is ordered racemic epinephrine. The usual dose is:","roman":null,"opts":["0.05 mL of 2.25 percent","0.25 to 0.5 mL of 2.25 percent","2.25 mL of 0.5 percent","5 mL of 2.25 percent"],"ans":1,"why":"The usual dose is 0.25 to 0.5 mL of the 2.25 percent solution diluted in about 3 mL of normal saline. Smaller children get the lower end of that range."},{"cat":"Clinical scenario","stem":"A patient opens a brand-new albuterol HFA inhaler. Before the first dose she should:","roman":null,"opts":["Rinse the mouthpiece in water","Use it right away","Prime it with 4 sprays","Shake it for 60 seconds"],"ans":2,"why":"A new albuterol HFA inhaler is primed with 4 test sprays into the air so the first real dose delivers the full amount. It is re-primed the same way after 2 weeks of non-use."},{"cat":"Clinical scenario","stem":"A patient says her albuterol inhaler sat unused in a drawer for a month. You advise her to:","roman":null,"opts":["Warm it in her hands first","Use two puffs instead of one","Discard it and get a refill","Re-prime it with 4 sprays"],"ans":3,"why":"After about 2 weeks without use an albuterol HFA inhaler needs re-priming with 4 sprays. The drug has not gone bad; the valve simply needs to be reloaded."},{"cat":"Clinical scenario","stem":"After actuating her albuterol MDI a patient exhales immediately. The correct coaching is to:","roman":null,"opts":["Hold her breath about 10 seconds","Take three fast breaths in a row","Cough hard after each puff","Exhale right away as she did"],"ans":0,"why":"A breath hold of about 10 seconds lets the aerosol settle in the airway instead of being blown back out. Exhaling at once wastes much of the dose."},{"cat":"Clinical scenario","stem":"A 4-year-old cannot coordinate an albuterol MDI. The best way to deliver it is:","roman":null,"opts":["A dry powder inhaler","A spacer with a mask","The MDI held near his face","A soft mist inhaler alone"],"ans":1,"why":"A valved holding chamber with a properly fitted mask lets a small child inhale over several normal breaths, removing the need to coordinate. Dry powder inhalers need a fast inspiratory flow a 4-year-old cannot generate."},{"cat":"Clinical scenario","stem":"Partway through a nebulized albuterol treatment the cup begins to sputter. You should:","roman":null,"opts":["Double the flowmeter setting","Stop and discard the rest","Tap the cup and continue","Add 5 mL more saline"],"ans":2,"why":"Sputtering means the solution is nearly gone. Tapping the cup returns the clinging droplets to the bottom so the remaining dose is delivered, and then the treatment ends."},{"cat":"Clinical scenario","stem":"An intubated patient on a heated humidified circuit receives in-line albuterol. Humidity in the circuit tends to:","roman":null,"opts":["Have no effect at all","Make the drug inactive","Increase drug delivery","Reduce drug delivery"],"ans":3,"why":"Humidity makes aerosol particles grow and rain out in the circuit, cutting the dose that reaches the lung. Dose adjustments are often needed for ventilated patients."},{"cat":"Clinical scenario","stem":"A diabetic patient on frequent albuterol treatments asks why her glucose readings have risen. The reason is that beta agonists:","roman":null,"opts":["Raise blood glucose levels","Damage the pancreas","Interfere with the glucometer","Block insulin receptors"],"ans":0,"why":"Beta-2 stimulation promotes glycogenolysis, so blood glucose rises. It also drives potassium into cells. Both are expected systemic effects, not errors."},{"cat":"Clinical scenario","stem":"A patient with benign prostatic hyperplasia is to start nebulized ipratropium. You should:","roman":null,"opts":["Refuse to give the anticholinergic","Give it and watch for urinary retention","Cut the ordered dose in half","Give it only at bedtime each night"],"ans":1,"why":"Ipratropium is a quaternary compound with little systemic absorption, so it is generally given. Anticholinergic caution still applies, so watch for urinary retention and report difficulty voiding."},{"cat":"Clinical scenario","stem":"A patient who uses more than two albuterol canisters a month most likely needs:","roman":null,"opts":["Treatments twice as often","A stronger rescue inhaler","A daily controller medication","A larger spacer device"],"ans":2,"why":"Heavy rescue inhaler use is a marker of poor control, not a reason for more rescue medication. It signals uncontrolled inflammation and the need for a daily controller such as an inhaled corticosteroid."},{"cat":"Clinical scenario","stem":"A patient on scheduled albuterol four times a day reports it does not work as well as it used to. The likely explanation is:","roman":null,"opts":["A nebulizer malfunction","He needs more oxygen","The drug has expired","Beta receptor tolerance"],"ans":3,"why":"Regular, repeated beta agonist use downregulates beta receptors, so the response weakens. This is one reason short-acting agents are preferred as needed rather than on a standing schedule."},{"cat":"Clinical scenario","stem":"A patient is already on nebulized arformoterol twice daily. The physician now orders nebulized formoterol. Your best action is to:","roman":null,"opts":["Clarify the duplicate LABA order","Give only the arformoterol","Alternate them each day","Give both as ordered"],"ans":0,"why":"Arformoterol and formoterol are both long-acting beta agonists, so giving both doubles the LABA. Clarify the order before administering either one."},{"cat":"Clinical scenario","stem":"A patient with known hyperkalemia is given nebulized albuterol. The purpose is to:","roman":null,"opts":["Relieve the airway narrowing","Shift potassium into the cells","Increase urine output markedly","Correct the metabolic acidosis"],"ans":1,"why":"Beta-2 agonists drive potassium intracellularly, so albuterol is used as a temporizing measure in hyperkalemia. The same mechanism causes hypokalemia when it is used in high doses for asthma."},{"cat":"Clinical scenario","stem":"A patient with a history of ventricular arrhythmia needs a short-acting bronchodilator. The physician may reasonably choose:","roman":null,"opts":["Theophylline","Racemic epinephrine","Levalbuterol","Formoterol"],"ans":2,"why":"Levalbuterol is the active R-isomer and is sometimes chosen when cardiac side effects are a concern. The evidence for a real difference is modest, but it is the usual reason it is selected."},{"cat":"Clinical scenario","stem":"A patient is ordered albuterol and chest physiotherapy. The correct sequence is:","roman":null,"opts":["Both at the same time","Physiotherapy only","Physiotherapy, then albuterol","Albuterol, then physiotherapy"],"ans":3,"why":"The bronchodilator goes first so the airways are open before secretions are mobilized. The same logic puts a bronchodilator before an inhaled corticosteroid or a mucolytic."},{"cat":"Clinical scenario","stem":"A patient uses both an albuterol inhaler and an inhaled corticosteroid each morning. You should teach her to:","roman":null,"opts":["Use the albuterol first","Use them at the same moment","Space them 4 hours apart","Use the steroid first"],"ans":0,"why":"The bronchodilator opens the airway so the steroid reaches further into the lung. She should also rinse her mouth after the steroid."},{"cat":"Clinical scenario","stem":"A patient with exercise-induced bronchospasm uses albuterol correctly when she takes it:","roman":null,"opts":["Only after symptoms begin","About 15 minutes before exercise","Every night at bedtime","Once each morning year round"],"ans":1,"why":"Albuterol taken roughly 15 minutes before exercise prevents symptoms and protects for a few hours. Waiting for symptoms means treating an attack that could have been avoided."},{"cat":"Clinical scenario","stem":"A COPD patient says his ipratropium does nothing when he gets suddenly short of breath. The best explanation is that it:","roman":null,"opts":["Must be given by mouth","Has expired on the shelf","Takes 15 to 30 minutes to work","Only works with oxygen"],"ans":2,"why":"Ipratropium takes 15 to 30 minutes to begin working and peaks at 1 to 2 hours, so it is a poor sole rescue drug. He needs a short-acting beta agonist for sudden symptoms."},{"cat":"Clinical scenario","stem":"A patient is sent home with both DuoNeb and a separate albuterol nebulizer solution. The most important teaching point is that:","roman":null,"opts":["The albuterol should be discarded","DuoNeb replaces his rescue inhaler","Both may be used together freely","DuoNeb already contains albuterol"],"ans":3,"why":"DuoNeb contains albuterol, so taking both at once doubles the beta agonist. He needs to understand which is scheduled and which is for rescue, and not stack them."},{"cat":"Clinical scenario","stem":"A home patient keeps his arformoterol vials on the kitchen counter. You should tell him to:","roman":null,"opts":["Keep them in the refrigerator","Store them in the freezer","Keep them on a sunny windowsill","Leave them where they are"],"ans":0,"why":"Arformoterol is stored refrigerated in its foil pouch, with only a limited period allowed at room temperature. Vials are used immediately after opening."},{"cat":"Clinical scenario","stem":"A patient asks whether she can mix her ipratropium and albuterol in one nebulizer cup. The correct answer is:","roman":null,"opts":["No, they react chemically","Yes, they are compatible","Only if she adds saline","Only in a large volume nebulizer"],"ans":1,"why":"Albuterol and ipratropium are compatible and are routinely mixed, which is exactly what the premixed DuoNeb vial contains."},{"cat":"Clinical scenario","stem":"A patient receiving nebulized ipratropium by mask complains of blurred vision and eye pain. You should suspect:","roman":null,"opts":["Low oxygen delivery","A normal drug effect","Mist reaching the eyes","An allergic reaction"],"ans":2,"why":"Anticholinergic mist leaking into the eyes dilates the pupil and can precipitate acute angle-closure glaucoma. Stop, check the mask fit, and consider a mouthpiece."},{"cat":"Clinical scenario","stem":"A patient was extubated an hour ago and now has inspiratory stridor and a hoarse voice. The appropriate drug is:","roman":null,"opts":["Nebulized ipratropium","Nebulized arformoterol","Nebulized albuterol","Racemic epinephrine"],"ans":3,"why":"Post-extubation stridor comes from laryngeal edema. The alpha effect of racemic epinephrine shrinks the swollen mucosa, which bronchodilators cannot do."},{"cat":"Clinical scenario","stem":"A newly diagnosed COPD patient needs a maintenance drug he can nebulize twice a day. Appropriate choices include:","roman":null,"opts":["Formoterol or arformoterol","Racemic epinephrine","Albuterol only","Albuterol or levalbuterol"],"ans":0,"why":"Formoterol 20 mcg and arformoterol 15 mcg are the nebulized long-acting beta agonists, both dosed every 12 hours. The short-acting agents are for rescue, not maintenance."},{"cat":"Clinical scenario","stem":"A patient needs the fastest possible relief of acute bronchospasm. Which nebulized drug acts soonest?","roman":null,"opts":["Ipratropium","Albuterol","Arformoterol","Budesonide"],"ans":1,"why":"Albuterol begins working in 5 to 15 minutes. Ipratropium needs 15 to 30 minutes, arformoterol is a maintenance drug, and an inhaled steroid does nothing acutely."},{"cat":"Clinical scenario","stem":"A hospitalized COPD patient is wheezing despite albuterol every 4 hours. The physician wants a second bronchodilator class. You would expect an order for:","roman":null,"opts":["Racemic epinephrine","Levalbuterol","Ipratropium","Formoterol"],"ans":2,"why":"Ipratropium blocks muscarinic receptors, a different pathway from the beta-2 route albuterol uses, so the two add together. Levalbuterol and formoterol work on the same receptor albuterol does."},{"cat":"Clinical scenario","stem":"An asthmatic teenager's only medication is an albuterol inhaler she uses most days. The most appropriate change is to:","roman":null,"opts":["Switch her to levalbuterol","Add a nebulizer at home","Increase her albuterol dose","Add an inhaled corticosteroid"],"ans":3,"why":"Needing rescue medication most days means the underlying inflammation is untreated. An inhaled corticosteroid is the controller that addresses the cause."}]};
</script>
<script>
(function(){
 var S = window.DATA, CARDS = S.cards, DECKS = S.decks, QS = S.questions;
 var $ = function(id){ return document.getElementById(id); };
 var LET = ["a","b","c","d","e"], ROM = ["I","II","III","IV","V"];
 var FIELDS = [["all","Everything"],["cls","Class"],["route","How it's given"],["pk","Onset, peak, duration"],["does","What it does"],["dose","Typical dose"],["side","Side effects"],["watch","Watch out for"],["tip","Memory tip"]];
 var LABEL = {cls:"Class",route:"How it's given",onset:"Onset",peak:"Peak effect",duration:"Duration",does:"What it does",dose:"Typical dose",side:"Common side effects",watch:"Watch out for",tip:"Memory tip"};
 var PHARM = ["Drug naming","Drug development","Pharmacokinetics","Routes","Drug responsiveness","Abbreviations","Pharmacology"];
 var PH_SAFE = ["six rights","hospitalizations","formulary","warnings","discontinue"];

 function esc(s){ return String(s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
 var CORE_RX = /albuterol|levalbuterol|xopenex|proventil|ventolin|proair|racemic epi|vaponefrin|micronefrin|formoterol|perforomist|foradil|brovana|ipratropium|atrovent|duoneb|combivent/i;
 function isCore(q){ return CORE_RX.test(q.stem + " " + q.opts.join(" ") + " " + q.why); }
 function shuffle(a){ for (var n = a.length-1; n > 0; n--){ var j = Math.floor(Math.random()*(n+1)); var t = a[n]; a[n] = a[j]; a[j] = t; } return a; }
 function mmss(s){ var m = Math.floor(Math.abs(s)/60), r = Math.abs(s)%60; return (s<0?"-":"") + m + ":" + (r<10?"0":"") + r; }
 var store = {
   get:function(k,d){ try{ var v = localStorage.getItem("rxp_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
   set:function(k,v){ try{ localStorage.setItem("rxp_"+k, JSON.stringify(v)); }catch(e){} }
 };
 function section(q){
   if (PHARM.indexOf(q.cat) >= 0) return "Pharmacology basics";
   if (q.cat === "Safety"){
     var s = q.stem.toLowerCase();
     for (var i = 0; i < PH_SAFE.length; i++) if (s.indexOf(PH_SAFE[i]) >= 0) return "Pharmacology basics";
   }
   return "Bronchodilators";
 }
 function mkOpts(q){
   var o = q.opts.map(function(t,k){ return {t:t, correct:k===q.ans}; });
   var lock = q.roman || q.opts.some(function(t){ return /of the above/i.test(t); });
   return lock ? o : shuffle(o);
 }
 function qid(q){ var h = 0, x = q.stem; for (var i = 0; i < x.length; i++){ h = ((h<<5) - h + x.charCodeAt(i)) | 0; } return h; }
 function seenMap(){ return store.get("seen",{}); }
 function markSeen(q, wrong){
   var m = seenMap(), k = qid(q), e = m[k] || [0,0];
   e[0]++;
   e[1] = wrong ? 1 : 0;
   m[k] = e; store.set("seen", m);
 }
 function seenCount(pool){ var m = seenMap(); return pool.filter(function(q){ return m[qid(q)]; }).length; }
 function pickPool(pool, want, focusMissed){
   var m = seenMap(), fresh = [], missed = [], done = [];
   pool.forEach(function(q){
     var e = m[qid(q)];
     if (!e) fresh.push(q); else if (e[1] > 0) missed.push(q); else done.push(q);
   });
   shuffle(fresh); shuffle(missed);
   done.sort(function(a,b){ return m[qid(a)][0] - m[qid(b)][0]; });
   var order = focusMissed ? missed.concat(fresh, done) : fresh.concat(missed, done);
   if (want <= 0) return shuffle(order);
   return shuffle(order.slice(0, want));
 }
 function coverLine(pool){
   var m = seenMap();
   var fresh = pool.filter(function(q){ return !m[qid(q)]; }).length;
   var missed = pool.filter(function(q){ var e = m[qid(q)]; return e && e[1] > 0; }).length;
   return '<p class="cover"><b class="num">' + fresh + '</b> of ' + pool.length + ' questions still new' +
          (missed ? ', <b class="num">' + missed + '</b> to review' : '') +
          '. <button class="linky" id="resetSeen">Reset history</button></p>';
 }
 function wireReset(after){
   var b = document.getElementById("resetSeen");
   if (b) b.onclick = function(){ store.set("seen", {}); after(); };
 }
 function romanHtml(q){
   return q.roman ? '<div class="roman">' + q.roman.map(function(r,k){
     return '<div><b>' + ROM[k] + '.</b><span>' + esc(r) + '</span></div>'; }).join("") + '</div>' : "";
 }
 function optsHtml(list, chosen){
   return list.map(function(o,k){
     return '<button class="opt' + (chosen===k ? " sel" : "") + '" data-k="' + k + '">' +
            '<span class="badge">' + LET[k] + '</span><span>' + esc(o.t) + '</span></button>';
   }).join("");
 }
 function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

 var timer = null;
 function chrome(title, active, back){
   $("crumb").innerHTML = (back ? '<a href="#/">All sets</a>' : "") + '<h1>' + esc(title) + '</h1>';
   $("tabs").innerHTML =
     '<a href="#/"' + (active==="home"||active==="set"?' aria-current="page"':'') + '>Flashcards</a>' +
     '<a href="#/quiz"' + (active==="quiz"?' aria-current="page"':'') + '>Quiz</a>' +
     '<a href="#/exam"' + (active==="exam"?' aria-current="page"':'') + '>Practice exam</a>';
   Array.prototype.forEach.call($("tabs").querySelectorAll("a"), function(a){
     a.onclick = function(){ if (location.hash === a.getAttribute("href")) route(); };
   });
 }

 /* ---------------- flashcard set ---------------- */
 function setView(slug){
   var meta = DECKS[slug];
   if (!meta){ location.hash = "#/"; return; }
   chrome(meta.title,"set","back");
   var D = meta.idx.map(function(i){ return CARDS[i]; });
   var known = store.get(slug+"_known",{}), cat = store.get(slug+"_cat",""), deck = [], i = 0;
   var cats = [];
   D.forEach(function(d){ if (cats.indexOf(d.cat) < 0) cats.push(d.cat); });
   if (cats.indexOf(cat) < 0) cat = "";

   $("app").innerHTML =
     '<div class="chips" id="chips" role="group" aria-label="Filter by category"></div>' +
     '<div class="status"><span id="pos" class="num"></span><span id="score" class="num"></span></div>' +
     '<div class="track"><i id="bar"></i></div>' +
     '<div class="stage"><div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Press space to flip."></div></div>' +
     '<div class="deck-nav">' +
     '<button class="arrow" id="prev" aria-label="Previous card">&#8592;</button>' +
     '<button class="miss" id="again">Still learning</button>' +
     '<button class="hit" id="got">Got it</button>' +
     '<button class="arrow fwd" id="next" aria-label="Next card">&#8594;</button></div>' +
     '<div class="sub-tools"><select id="focus" aria-label="Quiz me on"></select>' +
     '<div class="pair"><button id="shuf">Shuffle</button><button id="reset">Reset progress</button></div></div>';

   $("chips").innerHTML = ['<button class="chip" data-c="">All ' + D.length + '</button>']
     .concat(cats.map(function(c){
       var n = D.filter(function(d){ return d.cat === c; }).length;
       return '<button class="chip" data-c="' + esc(c) + '">' + esc(c) + ' ' + n + '</button>';
     })).join("");
   $("focus").innerHTML = FIELDS.map(function(f){ return '<option value="' + f[0] + '">Quiz me on: ' + f[1] + '</option>'; }).join("");
   $("focus").value = store.get("focus","all");
   if (cats.length < 2) $("chips").style.display = "none";
   if (!D.some(function(d){ return !d.a; })) $("focus").style.display = "none";

   function build(sh){
     deck = D.filter(function(d){ return !cat || d.cat === cat; });
     if (sh) shuffle(deck);
     i = 0;
     each(".chip", function(b){ b.setAttribute("aria-pressed", b.dataset.c === cat ? "true" : "false"); });
     render();
   }
   function render(){
     var card = $("card"); card.classList.remove("flip");
     var n = deck.length, kn = deck.filter(function(d){ return known[d.name]; }).length;
     $("score").textContent = n ? kn + " learned" : "";
     $("bar").style.width = (n ? kn/n*100 : 0) + "%";
     if (!n){ card.innerHTML = '<div class="face front"><p class="term">No cards here</p></div>'; $("pos").textContent = ""; return; }
     var d = deck[i], f = $("focus").value;
     $("pos").textContent = (i+1) + " of " + n;
     if (d.a){
       card.innerHTML =
         '<div class="face front"><div class="kind">Concept</div>' +
         '<p class="term" style="font-size:clamp(1.3rem,4.4vw,1.85rem)">' + esc(d.name) + '</p>' +
         '<div class="ask">Recall the answer</div><div class="tap">Tap to flip</div></div>' +
         '<div class="face back"><h4>' + esc(d.name) + '</h4><div class="ans">' +
         d.a.split("\n").map(function(l){ return '<p>' + esc(l) + '</p>'; }).join("") + '</div></div>';
       return;
     }
     var ask = f === "all" ? "Recall everything you know" : "Recall: " + FIELDS.filter(function(x){ return x[0]===f; })[0][1].toLowerCase();
     var keys = (f === "all" ? Object.keys(LABEL) : f === "pk" ? ["onset","peak","duration"] : [f]).filter(function(k){ return d[k]; });
     card.innerHTML =
       '<div class="face front"><div class="kind">' + esc(d.cat) + '</div>' +
       '<p class="term">' + esc(d.name) + '</p>' +
       '<div class="sub">' + esc(d.brand || "") + '</div>' +
       '<div class="ask">' + ask + '</div><div class="tap">Tap to flip</div></div>' +
       '<div class="face back"><h4>' + esc(d.name) + '</h4><dl>' +
       (keys.length ? keys.map(function(k){ return '<dt>' + LABEL[k] + '</dt><dd>' + esc(d[k]) + '</dd>'; }).join("")
                    : '<dt>Not recorded</dt><dd>This card has nothing for that field yet.</dd>') + '</dl></div>';
   }
   function go(s){ if (deck.length){ i = (i+s+deck.length) % deck.length; render(); } }

   $("card").onclick = function(){ $("card").classList.toggle("flip"); };
   $("next").onclick = function(){ go(1); };
   $("prev").onclick = function(){ go(-1); };
   $("got").onclick = function(){ known[deck[i].name] = 1; store.set(slug+"_known",known); go(1); };
   $("again").onclick = function(){ delete known[deck[i].name]; store.set(slug+"_known",known); go(1); };
   $("shuf").onclick = function(){ build(true); };
   $("reset").onclick = function(){ known = {}; store.set(slug+"_known",known); render(); };
   $("focus").onchange = function(){ store.set("focus",$("focus").value); render(); };
   each(".chip", function(b){ b.onclick = function(){ cat = b.dataset.c; store.set(slug+"_cat",cat); build(false); }; });
   window.__keys = function(e){
     var t = document.activeElement.tagName;
     if (t === "SELECT") return;
     if (e.key === " "){ if (t === "BUTTON") return; e.preventDefault(); $("card").classList.toggle("flip"); }
     else if (e.key === "ArrowRight") go(1);
     else if (e.key === "ArrowLeft") go(-1);
   };
   build(false);
 }

 /* ---------------- quiz ---------------- */
 function quiz(){
   chrome("Quiz","quiz","back");
   var deck = [], i = 0, right = 0, answered = false;
   var cats = [];
   QS.forEach(function(q){ if (cats.indexOf(q.cat) < 0) cats.push(q.cat); });
   cats.sort();
   $("app").innerHTML =
     '<div class="sub-tools" style="margin:0 0 18px"><select id="cat" aria-label="Topic"></select>' +
     '<div class="pair"><select id="len" aria-label="Number of questions">' +
     '<option value="10">10 questions</option><option value="25" selected>25 questions</option><option value="0">Every question</option>' +
     '</select><select id="mode" aria-label="Which questions">' +
     '<option value="new">New questions first</option><option value="missed">Focus on ones I missed</option>' +
     '</select></div><button class="primary block" id="start">New quiz</button></div>' +
     '<div id="cover"></div>' +
     '<div class="status"><span id="pos" class="num"></span><span id="tally" class="num"></span></div>' +
     '<div class="track"><i id="bar"></i></div><div id="stage"></div>';
   $("cat").innerHTML = '<option value="">All topics (' + QS.length + ' questions)</option>' +
     '<option value="__core">Core drugs only (' + QS.filter(isCore).length + ')</option>' +
     cats.map(function(c){
       var n = QS.filter(function(q){ return q.cat === c; }).length;
       return '<option value="' + esc(c) + '">' + esc(c) + ' (' + n + ')</option>';
     }).join("");

   function build(){
     var c = $("cat").value;
     var pool = QS.filter(function(q){ return !c ? true : c === "__core" ? isCore(q) : q.cat === c; });
     $("cover").innerHTML = coverLine(pool);
     wireReset(build);
     deck = pickPool(pool, parseInt($("len").value,10), $("mode").value === "missed").map(function(q){ return {q:q, opts:mkOpts(q)}; });
     i = 0; right = 0; show();
   }
   function show(){
     answered = false;
     var n = deck.length, d = deck[i];
     $("pos").textContent = "Question " + (i+1) + " of " + n;
     $("tally").textContent = right + " correct";
     $("bar").style.width = (i/n*100) + "%";
     $("stage").innerHTML = '<div class="panel"><p class="stem">' + esc(d.q.stem) + '</p>' + romanHtml(d.q) +
       '<div class="opts">' + optsHtml(d.opts,null) + '</div><div id="fb"></div></div>';
     each(".opt", function(b){ b.onclick = function(){ pick(parseInt(b.dataset.k,10)); }; });
   }
   function pick(k){
     if (answered) return;
     answered = true;
     var d = deck[i], ok = d.opts[k].correct;
     if (ok) right++;
     markSeen(d.q, !ok);
     each(".opt", function(b){
       var bk = parseInt(b.dataset.k,10); b.disabled = true;
       if (d.opts[bk].correct) b.classList.add("right"); else if (bk === k) b.classList.add("wrong");
     });
     var letter = LET[d.opts.map(function(o){ return o.correct; }).indexOf(true)];
     $("fb").innerHTML =
       '<div class="why"><p class="verdict ' + (ok?"r":"w") + '">' + (ok ? "Correct" : "Not quite. The answer is " + letter) + '</p>' +
       '<p>' + esc(d.q.why) + '</p></div>' +
       '<button class="primary block next-q" id="next">' + (i+1 < deck.length ? "Next question" : "See your score") + '</button>';
     $("tally").textContent = right + " correct";
     $("next").onclick = function(){ i++; if (i < deck.length) show(); else done(); };
     $("next").focus();
   }
   function done(){
     var n = deck.length, pct = Math.round(right/n*100);
     $("pos").textContent = "Finished"; $("tally").textContent = right + " of " + n; $("bar").style.width = "100%";
     var note = pct >= 80 ? "Solid. Keep the weak topics in rotation."
       : pct >= 70 ? "Passing range, with room to tighten up."
       : "Work the flashcards for this topic, then try again.";
     $("stage").innerHTML = '<div class="panel"><h2>Quiz complete</h2><div class="score">' + pct + '%</div>' +
       '<p class="score-note">' + right + ' of ' + n + ' correct</p>' +
       '<p class="lede" style="margin:10px 0 0">' + note + '</p>' +
       '<button class="primary block next-q" id="again">Take another quiz</button></div>';
     $("again").onclick = build;
   }
   $("start").onclick = build; $("cat").onchange = build; $("len").onchange = build; $("mode").onchange = build;
   window.__keys = function(e){
     if (document.activeElement.tagName === "SELECT") return;
     if (!answered && /^[1-4]$/.test(e.key)){
       var b = document.querySelector('.opt[data-k="' + (e.key-1) + '"]'); if (b) b.click();
     } else if (answered && (e.key === "Enter" || e.key === " ")){
       var nx = $("next"); if (nx && document.activeElement !== nx){ e.preventDefault(); nx.click(); }
     }
   };
   build();
 }

 /* ---------------- practice exam ---------------- */
 function exam(){
   chrome("Practice exam","exam","back");
   var list = [], idx = 0, limit = 0, elapsed = 0, pending = false;

   function setup(){
     clearInterval(timer); timer = null;
     var ph = QS.filter(function(q){ return section(q) === "Pharmacology basics"; }).length;
     $("app").innerHTML =
       '<div class="hero"><h2>Exam 1 practice</h2><p>Pharmacology basics and bronchodilators. Nothing is revealed until you submit.</p></div>' +
       '<div class="panel setup">' +
       '<div class="field"><label for="sec">Topics</label><select id="sec">' +
       '<option value="both">Both topics (' + QS.length + ' available)</option>' +
       '<option value="Pharmacology basics">Pharmacology basics only (' + ph + ')</option>' +
       '<option value="Bronchodilators">Bronchodilators only (' + (QS.length - ph) + ')</option>' +
       '<option value="core">Core drugs only (' + QS.filter(isCore).length + ')</option></select></div>' +
       '<div class="field"><label for="len">Length</label><select id="len">' +
       '<option value="25">25 questions</option><option value="50" selected>50 questions</option><option value="0">Every question</option></select></div>' +
       '<div class="field"><label for="mode">Which questions</label><select id="mode">' +
       '<option value="new">New questions first</option>' +
       '<option value="missed">Focus on ones I missed</option></select></div>' +
       '<div class="field"><label for="tl">Time limit</label><select id="tl">' +
       '<option value="0" selected>No limit, stopwatch only</option><option value="75">75 seconds per question</option><option value="60">60 seconds per question</option></select></div>' +
       '<button class="primary block" id="begin">Start exam</button></div>' + coverLine(QS);
     $("begin").onclick = begin;
     wireReset(setup);
   }
   function begin(){
     var sec = $("sec").value;
     var pool = QS.filter(function(q){ return sec === "both" ? true : sec === "core" ? isCore(q) : section(q) === sec; });
     list = pickPool(pool, parseInt($("len").value,10), $("mode").value === "missed").map(function(q){ return {q:q, opts:mkOpts(q), chosen:null, flagged:false}; });
     var per = parseInt($("tl").value,10);
     limit = per > 0 ? per * list.length : 0;
     elapsed = 0; idx = 0; pending = false;
     timer = setInterval(tick,1000);
     show();
   }
   function tick(){
     elapsed++;
     var c = $("clock"); if (!c) return;
     if (limit){
       var left = limit - elapsed;
       c.textContent = mmss(left);
       c.className = "clock" + (left <= 120 ? " low" : "");
       if (left <= 0){ clearInterval(timer); timer = null; results(true); }
     } else { c.textContent = mmss(elapsed); }
   }
   function show(){
     pending = false;
     var n = list.length, e = list[idx];
     var doneN = list.filter(function(x){ return x.chosen !== null; }).length;
     var map = list.map(function(x,k){
       var cls = (x.chosen !== null ? "done " : "") + (x.flagged ? "flagged " : "") + (k === idx ? "cur" : "");
       return '<button class="' + cls.trim() + '" data-g="' + k + '">' + (k+1) + '</button>';
     }).join("");
     $("app").innerHTML =
       '<div class="status"><span class="num">Question ' + (idx+1) + ' of ' + n + ', ' + doneN + ' answered</span>' +
       '<span class="clock" id="clock">' + (limit ? mmss(limit-elapsed) : mmss(elapsed)) + '</span></div>' +
       '<div class="track"><i style="width:' + (doneN/n*100) + '%"></i></div>' +
       '<div class="panel"><p class="stem">' + esc(e.q.stem) + '</p>' + romanHtml(e.q) +
       '<div class="opts">' + optsHtml(e.opts, e.chosen) + '</div>' +
       '<div class="tools"><button id="prev">Previous</button>' +
       '<button id="flag" class="flag' + (e.flagged?" on":"") + '">' + (e.flagged?"Flagged":"Flag for review") + '</button>' +
       '<button id="next">Next</button></div></div>' +
       '<div class="map"><h3>Jump to a question</h3><div class="grid">' + map + '</div>' +
       '<div class="legend"><span>Filled means answered</span><span>Outlined means flagged</span></div></div>' +
       '<button class="primary block next-q" id="sub">Submit exam</button><div id="confirm"></div>';
     each(".opt", function(b){ b.onclick = function(){ list[idx].chosen = parseInt(b.dataset.k,10); show(); }; });
     each(".map .grid button", function(b){ b.onclick = function(){ idx = parseInt(b.dataset.g,10); show(); }; });
     $("prev").onclick = function(){ idx = (idx-1+n)%n; show(); };
     $("next").onclick = function(){ idx = (idx+1)%n; show(); };
     $("flag").onclick = function(){ list[idx].flagged = !list[idx].flagged; show(); };
     $("sub").onclick = ask;
   }
   function ask(){
     if (pending) return;
     pending = true;
     var blank = list.filter(function(x){ return x.chosen === null; }).length;
     var fl = list.filter(function(x){ return x.flagged; }).length;
     var msg = "Submit and see your score?";
     if (blank) msg = blank + (blank>1 ? " questions are" : " question is") + " unanswered.";
     else if (fl) msg = fl + (fl>1 ? " questions are" : " question is") + " still flagged.";
     $("confirm").innerHTML = '<div class="confirm"><p>' + msg + '</p><div class="r">' +
       '<button id="back">Keep working</button><button class="primary" id="yes">Submit exam</button></div></div>';
     $("back").onclick = function(){ pending = false; $("confirm").innerHTML = ""; };
     $("yes").onclick = function(){ results(false); };
   }
   function results(timedOut){
     clearInterval(timer); timer = null;
     var n = list.length, right = 0, bySec = {}, byCat = {};
     list.forEach(function(e){
       var ok = e.chosen !== null && e.opts[e.chosen].correct;
       if (ok) right++;
       if (e.chosen !== null) markSeen(e.q, !ok);
       var s = section(e.q), c = e.q.cat;
       bySec[s] = bySec[s] || [0,0]; bySec[s][1]++; if (ok) bySec[s][0]++;
       byCat[c] = byCat[c] || [0,0]; byCat[c][1]++; if (ok) byCat[c][0]++;
     });
     var pct = Math.round(right/n*100);
     var note = pct >= 80 ? "Strong. Comfortably above most passing lines."
       : pct >= 70 ? "Passing range. The weakest topics below are where the points are."
       : "Below passing. Work the flashcards for your lowest section, then retake.";
     function rows(o){
       return Object.keys(o).sort(function(a,b){ return (o[a][0]/o[a][1]) - (o[b][0]/o[b][1]); })
         .map(function(k){ var v = o[k];
           return '<div class="r"><span>' + esc(k) + '</span><span>' + v[0] + ' of ' + v[1] + ', ' + Math.round(v[0]/v[1]*100) + '%</span></div>';
         }).join("");
     }
     var review = list.map(function(e,k){
       var ok = e.chosen !== null && e.opts[e.chosen].correct;
       var correct = e.opts.filter(function(o){ return o.correct; })[0].t;
       var yours = e.chosen === null ? "Left blank" : e.opts[e.chosen].t;
       var rm = e.q.roman ? '<p class="a"><b>Items:</b> ' + e.q.roman.map(function(r,j){ return ROM[j] + ". " + esc(r); }).join("; ") + '</p>' : "";
       return '<article><p class="tag' + (ok?"":" bad") + '">Question ' + (k+1) + ', ' + (ok?"correct":"missed") + '</p>' +
         '<p class="q">' + esc(e.q.stem) + '</p>' + rm +
         (ok ? "" : '<p class="a"><b>Your answer:</b> ' + esc(yours) + '</p>') +
         '<p class="a"><b>Correct answer:</b> ' + esc(correct) + '</p>' +
         '<p class="note">' + esc(e.q.why) + '</p></article>';
     }).join("");
     $("app").innerHTML =
       '<div class="panel"><h2>' + (timedOut ? "Time expired" : "Exam complete") + '</h2>' +
       '<div class="score">' + pct + '%</div>' +
       '<p class="score-note">' + right + ' of ' + n + ' correct in ' + mmss(elapsed) + '</p>' +
       '<p class="lede" style="margin:12px 0 0">' + note + '</p>' +
       '<div class="rows"><h3>By section</h3>' + rows(bySec) + '</div>' +
       '<div class="rows"><h3>By topic, weakest first</h3>' + rows(byCat) + '</div>' +
       '<button class="primary block next-q" id="again">Take another exam</button>' +
       '<div class="review"><h2>Full review</h2>' + review + '</div></div>';
     $("again").onclick = setup;
     window.scrollTo(0,0);
   }
   window.__keys = function(e){
     if (e.target.tagName === "SELECT" || !list.length || !$("clock")) return;
     if (/^[1-4]$/.test(e.key)){ var b = document.querySelector('.opt[data-k="' + (e.key-1) + '"]'); if (b) b.click(); }
     else if (e.key === "ArrowRight"){ var nx = $("next"); if (nx) nx.click(); }
     else if (e.key === "ArrowLeft"){ var pv = $("prev"); if (pv) pv.click(); }
   };
   setup();
 }

 /* ---------------- router ---------------- */
 function route(){
   clearInterval(timer); timer = null;
   window.__keys = null;
   var h = (location.hash || "#/").replace(/^#\/?/,"");
   var parts = h.split("/");
   if (parts[0] === "set" && parts[1]) setView(decodeURIComponent(parts[1]));
   else if (parts[0] === "quiz") quiz();
   else if (parts[0] === "exam") exam();
   else home();
   window.scrollTo(0,0);
 }
 document.addEventListener("keydown", function(e){ if (window.__keys) window.__keys(e); });
 window.addEventListener("hashchange", route);
 route();
})();
</script>
</body>
</html>
